aid: distru
name: Distru
description: >-
  Distru is a cannabis-industry ERP and seed-to-sale platform that serves as the
  central operating hub for cultivators, processors and manufacturers,
  distributors, retailers and multi-state operators. It unifies inventory
  management with live Metrc and BioTrack compliance synchronization, order
  fulfillment, wholesale sales (DistruCommerce), invoicing, procurement and
  purchasing, warehouse management, production and assemblies with bills of
  materials and cost accounting, cultivation management, label printing, and
  certificate-of-analysis and test-result tracking. Distru also exposes a public
  REST API so operators can build custom integrations against products,
  inventory, orders, invoices, purchases, companies, contacts, batches,
  packages, strains, test results and more. The API uses Bearer API-key
  authentication generated inside the Distru app and returns JSON with cursor-
  style page[number]/page[size] pagination.
