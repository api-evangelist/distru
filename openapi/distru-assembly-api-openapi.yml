openapi: 3.2.0
info:
  license:
    name: Proprietary
    url: https://www.distru.com/legal/terms-of-service
  title: Distru Assembly API
  version: '1.0'
servers:
- url: https://app.distru.com
security:
- Bearer: []
tags:
- name: Assembly
paths:
  /public/v1/assemblies:
    get:
      description: 'Get a page of assemblies, each with its full outputs, inputs, and costs, ordered oldest to newest

        by their last modified date. All filters below are ANDed together, and results are paginated.


        Because the order is by last modified date, an assembly that is modified while you are paging moves

        to the end of the order and can appear again on a later page — walking the pages is safe as long as

        you treat a repeated ID as the same assembly. No assembly is ever skipped this way.


        Nested `input_*` and `output_*` filters match against an assembly''s inputs and outputs. When you

        combine several filters for the same side, a single line must satisfy all of them: e.g.

        `input_product_ids` + `input_batch_ids` keeps only assemblies that have one input matching both.

        Input and output filters combine across sides too — an assembly must have a matching input AND a

        matching output to be returned.


        This endpoint returns eventually consistent data, with changes taking up to 1 second to propagate

        in responses — an assembly you just created or updated (including via the upsert or split-package

        endpoints) may not appear here for up to a second.


        Required permission: `assemblies_permissions_view`. Results are scoped to your company and further

        filtered to only the assemblies the authenticated user''s team restrictions allow them to see, so a

        restricted key may see fewer rows than exist.'
      operationId: DistruPublic.V1.AssemblyController.index
      parameters:
      - description: Restrict the result to specific assemblies by ID (the same ID returned as each assembly's `id`). Repeat the bracketed key once per ID. Unknown IDs simply match nothing; an empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Filter by the datetime an assembly was completed, as an inclusive `after,before` range of ISO 8601 timestamps. Either side may be left blank: `2022-07-10T00:00:00Z,` returns everything completed on or after that instant, `,2022-07-10T00:00:00Z` everything completed on or before it, and `2022-07-01T00:00:00Z,2022-07-31T00:00:00Z` the closed interval between the two. Only COMPLETED assemblies have a completion datetime, so any value here implicitly excludes PENDING assemblies.'
        in: query
        name: completion_datetime
        required: false
        example: ?completion_datetime=2022-07-01T00:00:00Z,2022-07-31T00:00:00Z
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      - description: 'Filter to assemblies that originated a given way, matching exactly one value. • `MANUALLY_CREATED` — built by hand in Distru or via the upsert endpoint (the only source this API can modify). • `SALES_ORDER` — generated to fulfill a sales order. • `SPLIT_PACKAGE` — produced by splitting a Metrc package (including via the split-package endpoint). • `LAB_TESTING` — created to pull a test sample. Note: this attribute is unreliable for assemblies created before September 2020, which may report `MANUALLY_CREATED` regardless of their true origin.'
        in: query
        name: creation_source
        required: false
        schema:
          type: string
          enum:
          - MANUALLY_CREATED
          - SALES_ORDER
          - SPLIT_PACKAGE
          - LAB_TESTING
      - description: Filter to assemblies tied to the license with this exact license number within your company (exact match, not a substring). Assemblies on non-compliance (NONE) licenses have no license number and are excluded when this is set.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000123-LIC
        schema:
          type: string
      - description: Filter by assembly status, matching exactly one value. • `PENDING` — still in progress; ingredient inventory is claimed but not yet consumed and the assembly can still be edited or deleted. • `COMPLETED` — finished; inputs are consumed and outputs produced into inventory, and the assembly is frozen.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - COMPLETED
      - description: Filter by custom field values, as `custom_data[{id}]=value` where `{id}` is a custom field's numeric id. Repeat with different ids to filter on several fields at once; a record must match every one (AND). Matching is case-sensitive exact against the value stored on the record. The id must be a filterable custom field defined on this entity — use `GET /public/v1/custom-fields?parent_object=assembly` to list the ids, their types, and which are filterable. A non-numeric id, an id not defined on this entity, or an id that isn't filterable returns a 400.
        in: query
        name: custom_data
        required: false
        schema:
          type: object
      - description: Filter by when the assembly was created, as an inclusive `after,before` range of ISO 8601 timestamps. Either side may be left blank to make the range open-ended.
        in: query
        name: inserted_datetime
        required: false
        example: ?inserted_datetime=2022-07-01T00:00:00Z,2022-07-31T00:00:00Z
        schema:
          type: string
      - description: Filter by when the assembly was last modified, as an inclusive `after,before` range of ISO 8601 timestamps. Either side may be left blank to make the range open-ended.
        in: query
        name: updated_datetime
        required: false
        example: ?updated_datetime=2022-07-01T00:00:00Z,2022-07-31T00:00:00Z
        schema:
          type: string
      - description: Restrict to assemblies owned by any of these user IDs (matched against each assembly's `owner_id`). Repeat the bracketed key once per ID. Unknown IDs match nothing; an empty list is no filter. At most 200 IDs.
        in: query
        name: owner_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies tied to any of these license IDs. This is the exact-ID counterpart to `license_number`; both may be combined (ANDed). Assemblies on non-compliance (NONE) licenses have no license and are excluded when this is set. Repeat the bracketed key once per ID. Unknown IDs match nothing; an empty list is no filter. At most 200 IDs.
        in: query
        name: license_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input of any of these product IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input drawn from any of these package IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_package_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input drawn from any of these batch IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_batch_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input package carrying any of these Metrc compliance labels (case-sensitive exact match per value). Repeat the bracketed key per label. At most 200.
        in: query
        name: input_package_compliance_labels
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input package whose Distru batch number is any of these (case-sensitive exact match per value). Repeat the bracketed key per value. At most 200.
        in: query
        name: input_package_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input batch whose batch number is any of these (case-sensitive exact match per value). Repeat the bracketed key per value. At most 200.
        in: query
        name: input_batch_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product belongs to any of these category IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_category_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product belongs to any of these subcategory IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_subcategory_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product SKU is any of these (case-insensitive exact match per value). Repeat the bracketed key per SKU. At most 200.
        in: query
        name: input_product_skus
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product belongs to any of these product group IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_group_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product belongs to any of these brand IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_brand_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product is tied to any of these vendor (company relationship) IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_vendor_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product carries any of these tag IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_tag_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an input whose product belongs to any of these strain IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: input_product_strain_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output of any of these product IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output produced into any of these package IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_package_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output produced into any of these batch IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_batch_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output package carrying any of these Metrc compliance labels (case-sensitive exact match per value). Repeat the bracketed key per label. At most 200.
        in: query
        name: output_package_compliance_labels
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output package whose Distru batch number is any of these (case-sensitive exact match per value). Repeat the bracketed key per value. At most 200.
        in: query
        name: output_package_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output batch whose batch number is any of these (case-sensitive exact match per value). Repeat the bracketed key per value. At most 200.
        in: query
        name: output_batch_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product belongs to any of these category IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_category_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product belongs to any of these subcategory IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_subcategory_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product SKU is any of these (case-insensitive exact match per value). Repeat the bracketed key per SKU. At most 200.
        in: query
        name: output_product_skus
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product belongs to any of these product group IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_group_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product belongs to any of these brand IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_brand_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product is tied to any of these vendor (company relationship) IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_vendor_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product carries any of these tag IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_tag_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to assemblies with an output whose product belongs to any of these strain IDs. Repeat the bracketed key per ID. At most 200. Unknown IDs match nothing; an empty list is no filter.
        in: query
        name: output_product_strain_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: A list of assemblies
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Assemblies'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's list rate limit (3000 calls, refilling at 5 per minute, one per page) was exceeded. Retry after the period in the Retry-After header. Calls with an `updated_datetime` lower bound within the last 30 days are free and never refused; see [Incremental Sync](#incremental-sync).
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get assemblies
      tags:
      - Assembly
    post:
      description: 'Create, update, or delete an assembly and its outputs, inputs, and costs in a single request. Every row — the assembly and each nested output, input, and cost — carries a required `action` of

        `CREATE`, `UPDATE`, or `DELETE`. `UPDATE` and `DELETE` must include the row''s `id`; `CREATE` omits

        it. `DELETE` on the assembly removes it along with all of its outputs, inputs, and costs. Updates

        are sparse: only the fields you send are changed. A nested row (output, input, or cost) you leave

        out entirely is left untouched — omission never deletes it; removing one always requires sending it

        with `action` `DELETE`. The whole request is applied atomically: if any row is rejected, none of the

        changes are saved. How this moves inventory: while the assembly is `PENDING`, each fulfilled input (`status` `PENDING`

        or `COMPLETED`) claims specific on-hand inventory from its batch or package, and each `DRAFT` input

        reserves product-level quantity without committing a specific lot. Completing an output consumes its

        inputs and produces the output into inventory at its `location_id` — as a batch for batch-/product-

        tracked outputs, or as a new package for package-tracked (Metrc) outputs. Completing the whole

        assembly requires all of its outputs to be completed. How this moves compliance: on a Metrc license, completing a package-tracked output (or a Metrc

        processing job) is pushed to Metrc as a side effect after the request commits. A 2xx therefore means

        the change was saved in Distru, not that Metrc has finished syncing — the created packages'' Metrc

        identifiers may still be absent and the affected packages briefly flagged as syncing. Re-fetch the

        assembly with `GET /public/v1/assemblies/{id}` to observe the synced result. This endpoint supports

        Metrc and non-compliance (NONE) licenses only; BioTrack is not supported. Only assemblies with `creation_source=MANUALLY_CREATED` (i.e. created via the Assembly form in

        Distru or via the API) can be modified or deleted by this endpoint; system-generated assemblies

        (`SALES_ORDER`, `SPLIT_PACKAGE`, `LAB_TESTING`) are rejected. Metrc processing jobs: set `metrc_processing_job.name` and `metrc_processing_job.type_id` together

        to make the assembly a Metrc processing job. Both are required together, the license must be a

        Metrc license with processing-job capability, `type_id` must be the Metrc ID of an existing Metrc

        processing job type, and `name` must be non-empty and not already used by a processing job in Metrc. Once set, `name` and `type_id` are permanent — they

        cannot be changed on a later update; only `notes` and `waste` stay editable. `metrc_processing_job.id`

        in the response is the job''s Metrc-assigned ID (set by Metrc once Distru creates the job there); it

        is read-only and null until then. Completing a processing job (setting `status` to `COMPLETED`) requires

        `notes`. `waste` is what Distru reports to Metrc when the job is finished (each quantity sent with

        its unit name); record it while the assembly is still `PENDING` — at the latest in the same request

        that completes it. Once the assembly is `COMPLETED` the waste fields are read-only. Completed assemblies: once an assembly''s `status` is `COMPLETED`, the only assembly-level fields

        you can still change are `description`, `custom_data`, `estimated_work_hours`,

        `estimated_work_minutes`, and `owner_id`; every other assembly field is read-only, and the assembly

        can be neither un-completed nor deleted. Its outputs and inputs are frozen — they cannot be edited

        or deleted. Costs behave differently: an existing cost on a completed output cannot be edited or

        deleted, but you can still add new costs to that output. Completing an assembly requires all of its

        outputs to be completed. For a Metrc processing job, packages (inputs) cannot be added or removed

        once any output is completed; to delete such an assembly, finish the job in Metrc and Distru removes

        it automatically about 30 minutes later.'
      operationId: DistruPublic.V1.AssemblyController.upsert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAssemblyRequest'
        description: The assembly to create, update or delete
        required: true
      responses:
        '200':
          description: The updated assembly
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssemblyResponse'
        '201':
          description: The created assembly
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssemblyResponse'
        '204':
          description: The assembly was deleted
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upsert an assembly
      tags:
      - Assembly
  /public/v1/assemblies/create_test_sample:
    post:
      description: 'Pull a quantity from an existing Metrc package into a new test sample package, ready to be

        sent to a testing lab.


        Creates one already-completed assembly with a single input (the quantity drawn from the

        source package) and a single test sample output — the assembly renders with

        `creation_source: LAB_TESTING` and its output with `is_test_sample: true`. The drawn quantity is consumed from the

        source package''s inventory immediately, and the sample package is produced into inventory at

        `location_id`. On success the sample is queued for creation in Metrc as a testing package and

        synced asynchronously — the Metrc package identifiers are not present in the immediate

        response, and the source and sample packages are briefly flagged as syncing. Poll

        `GET /public/v1/assemblies/{id}` to observe the synced result.


        Metrc licenses only, and the license''s Metrc facility must be allowed to create test sample

        packages. The whole operation is atomic: if anything is rejected, nothing is changed.


        Required permission: `assemblies_permissions_create`, and assembly visibility other than

        "Restrict access" on your teams (admins are always allowed).'
      operationId: DistruPublic.V1.AssemblyController.create_test_sample
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestSampleRequest'
        description: The source package and the test sample to create from it
        required: true
      responses:
        '201':
          description: The created assembly
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssemblyResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create a test sample
      tags:
      - Assembly
  /public/v1/assemblies/split_package:
    post:
      description: 'Split a single Metrc source package into multiple output packages.


        Creates one assembly containing every input and output. On success each output package is

        queued for creation in Metrc and synced asynchronously — the Metrc package identifiers are

        not present in the immediate response, and the source and output packages are briefly flagged

        as syncing.


        Metrc licenses only. Up to 300 outputs per request. The whole split is applied atomically:

        if any output is rejected, none are created.


        Required permission: `assemblies_permissions_create`, and assembly visibility other than

        "Restrict access" on your teams (admins are always allowed).'
      operationId: DistruPublic.V1.AssemblyController.split_package
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitPackageRequest'
        description: The source package and outputs to create
        required: true
      responses:
        '201':
          description: The created assembly
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssemblyResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Split a package
      tags:
      - Assembly
  /public/v1/assemblies/{id}:
    delete:
      description: 'Deletes an assembly. This is a hard delete: the assembly is permanently removed together with all of its outputs, inputs, costs, and bin links — it disappears from `GET /public/v1/assemblies`, `GET /public/v1/assemblies/{id}` returns 404 for it, and it cannot be recovered through the API. This is the same operation as `POST /public/v1/assemblies` with `action` `DELETE`. Responds 204 with no body on success, or 404 if no assembly with that `id` exists in your company (including one that belongs to another company), or 403 if your team restrictions hide it. Metrc and non-compliance (NONE) licenses only; BioTrack is not supported.


        Some assemblies cannot be deleted; each of these is refused with a 400 and nothing is changed:


        • An assembly with any COMPLETED output — which includes every COMPLETED assembly (completing an assembly requires all of its outputs to be completed). The inventory a completed output produced stays; there is no way to un-complete or delete such an assembly through the API.

        • A Metrc processing job assembly whose job has been adjusted in Metrc, or that has completed outputs. Finish the processing job in Metrc instead — Distru deletes the assembly automatically about 30 minutes later.

        • A system-generated assembly (`creation_source` SALES_ORDER, SPLIT_PACKAGE, or LAB_TESTING) — only MANUALLY_CREATED assemblies can be deleted through the API.

        • A BioTrack assembly.

        • An assembly another request is mutating at that same moment (transient — retry).


        Inventory: the quantities the assembly''s PENDING or COMPLETED inputs had claimed, and the product-level quantities its DRAFT inputs had reserved, are released back to available inventory. An input package this assembly had fully consumed (finished) is reactivated, and unfinished in Metrc as well.


        Other effects, all in one atomic call: tasks tied to the assembly are deleted; batches linked to it and files attached to it are detached but kept. If the assembly created a Metrc processing job (and that job was never adjusted in Metrc), the job is deleted in Metrc as a side effect after the request commits (that sync is eventual — observe it in Metrc, not in the 204).


        Required permission: `assemblies_permissions_delete`.'
      operationId: DistruPublic.V1.AssemblyController.delete
      parameters:
      - description: ID of the assembly to delete, as returned by the list, fetch, and upsert endpoints. An ID that doesn't exist for your company returns 404, and one your team restrictions hide returns 403.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete an assembly
      tags:
      - Assembly
    get:
      description: 'Get a single assembly by ID, with its full outputs, inputs, and costs.


        Like the list endpoint, this reflects eventually consistent data — an assembly you just created or

        updated may take up to a second to reflect its latest state here. Returns 404 if no assembly with

        that ID exists in your company, and 403 if your team restrictions hide it.


        Required permission: `assemblies_permissions_view`.'
      operationId: DistruPublic.V1.AssemblyController.show
      parameters:
      - description: The ID of the assembly to fetch.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A single assembly
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssemblyResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get an assembly
      tags:
      - Assembly
  /public/v1/assemblies/{id}/pdf:
    post:
      description: 'Generate the work order PDF for a single assembly — the same printable production sheet listing

        its outputs, inputs, and costs that Distru generates in the UI — and download it directly, get a

        signed link to it, or email it (see `format`). This is a read-only operation: it neither changes

        the assembly nor touches inventory or compliance.


        The same permissions that govern downloading this PDF in the Distru web app apply to this endpoint; when `format` is `email`, the web app''s permission for emailing it applies instead (documents the web app cannot email keep the download permission).


        `format` selects how the generated PDF is delivered and has three modes: `binary` returns the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` returns a JSON envelope `{"data": {"url": ..., "expires_datetime": ...}}` with a temporary signed download URL; `email` sends the PDF to the addresses in `email_addresses` and returns a JSON envelope `{"data": {"emailed_to": [...]}}`. `format` is required, but for backward compatibility omitting it defaults to `binary`.


        All PDF download endpoints share a single, combined rate limit for your account: 20 requests per minute and 1000 per day in total across every PDF endpoint (not per endpoint). Requests over the limit return 429 with a Retry-After header, and only successful downloads count toward it.'
      operationId: DistruPublic.V1.AssemblyController.download_pdf
      parameters:
      - description: The ID of the assembly whose work order PDF you want.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/DistruPublic.V1.AssemblyController.download_pdfBody'
      responses:
        '200':
          description: 'When `format` is `binary` (or omitted), the raw PDF file (`Content-Type: application/pdf`). When `format` is `url`, a JSON body with a temporary signed download URL; when `format` is `email`, a JSON body listing the addresses the PDF was emailed to (see the PdfResponse schema).'
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
        '400':
          description: Invalid parameters
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's shared PDF download rate limit (20/minute, 1000/day across all PDF endpoints) was exceeded. Retry after the period in the Retry-After header.
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Generate a work order PDF
      tags:
      - Assembly
components:
  schemas:
    UnitType:
      description: A unit of measure used for quantities and pricing (e.g. Gram, Each, Pound). This is the compact reference carrying just id and name; the full unit type (its measurement category and conversion factor) is available from the unit types endpoint.
      properties:
        id:
          description: ID for this unit type
          type: string
        name:
          description: Human readable name for this unit type
          type: string
      required:
      - name
      - id
      title: Unit Type
      type: object
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    UpsertAssemblyMetrcProcessingJob:
      description: The Metrc processing job details for an assembly
      properties:
        name:
          description: The Metrc processing job name. Required together with `type_id`; must be non-empty and not already used by a processing job in Metrc. Permanent once set — cannot be changed on a later update.
          type: string
        notes:
          description: The Metrc processing job notes. Required to complete (status COMPLETED) a job. Editable after the job is created.
          type: string
        type_id:
          description: The Metrc ID of an existing Metrc processing job type. Required together with `name`. Permanent once set — cannot be changed on a later update.
          type: integer
        waste:
          $ref: '#/components/schemas/UpsertAssemblyMetrcProcessingJobWaste'
      title: Upsert Assembly Metrc Processing Job
      type: object
    BinCompact:
      description: Minimal details about a bin, as nested on other records
      properties:
        id:
          description: ID for this bin
          type: string
        name:
          description: The name of the bin
          type: string
      required:
      - name
      - id
      title: BinCompact
      type: object
    BillOfMaterialsProductInput:
      description: A specific product consumed by a bill of materials
      properties:
        id:
          description: ID for this input
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: How much of the product this recipe consumes, in the product's unit, as a decimal string (e.g. "2.5").
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsProductInput
      type: object
    UpsertAssemblyMetrcProcessingJobWaste:
      description: Waste reported to Metrc when finishing a Metrc processing job. Each quantity must be sent with its unit name. Submit it while the assembly is still PENDING (at the latest in the request that sets status to COMPLETED); it is read-only once the assembly is COMPLETED.
      properties:
        count_quantity:
          description: Count-based waste. Required together with `count_unit_name`.
          type: number
        count_unit_name:
          description: The Metrc unit name for `count_quantity`, e.g. "Each".
          type: string
        volume_quantity:
          description: Volume-based waste. Required together with `volume_unit_name`.
          type: number
        volume_unit_name:
          description: The Metrc unit name for `volume_quantity`, e.g. "Milliliters".
          type: string
        weight_quantity:
          description: Weight-based waste. Required together with `weight_unit_name`.
          type: number
        weight_unit_name:
          description: The Metrc unit name for `weight_quantity`, e.g. "Grams".
          type: string
      title: Upsert Assembly Metrc Processing Job Waste
      type: object
    BillOfMaterialsCost:
      description: An additional cost applied by a bill of materials
      properties:
        cost_type:
          $ref: '#/components/schemas/BillOfMaterialsCostType'
        description:
          description: Free-text description of this cost, or null when none was entered
          type: string
        id:
          description: ID for this cost
          type: string
        quantity:
          description: How many units of the cost type this line applies, as a decimal string (e.g. "3"). Multiply by the cost type's `cost_per_unit` to get the line total.
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsCost
      type: object
    AssemblyMetrcProcessingJobWaste:
      description: Waste recorded when a Metrc processing job is finished
      properties:
        count_quantity:
          description: Count-based waste, as a decimal string (e.g. "5"). Reported to Metrc as TotalCountWaste. Null when no count waste was recorded.
          type: string
        count_unit_name:
          description: The Metrc unit name for `count_quantity` (e.g. "Each"), or null when `count_quantity` is null
          type: string
        volume_quantity:
          description: Volume-based waste, as a decimal string (e.g. "10.5"). Reported to Metrc as TotalVolumeWaste. Null when no volume waste was recorded.
          type: string
        volume_unit_name:
          description: The Metrc unit name for `volume_quantity` (e.g. "Milliliters"), or null when `volume_quantity` is null
          type: string
        weight_quantity:
          description: Weight-based waste, as a decimal string (e.g. "2.75"). Reported to Metrc as TotalWeightWaste. Null when no weight waste was recorded.
          type: string
        weight_unit_name:
          description: The Metrc unit name for `weight_quantity` (e.g. "Grams"), or null when `weight_quantity` is null
          type: string
      title: Assembly Metrc Processing Job Waste
      type: object
    CompactMenu:
      description: A lightweight reference to a DistruCommerce menu — the online catalog a buyer browses to place an order — carrying just its id and name. Where it appears on a sales order, it is the menu that order was placed through. Use the id to fetch the full menu from the menus endpoint.
      properties:
        id:
          description: ID of the menu
          type: string
        name:
          description: Display name of the menu
          type: string
      required:
      - name
      - id
      title: CompactMenu
      type: object
    SplitPackageOutput:
      description: A single output package produced by the split
      properties:
        batch_number:
          description: Distru batch number stored on the output package.
          type: string
        bin_ids:
          description: Bins to store the output package in (requires bin inventory tracking enabled for the company). Optional; omit or send an empty array to assign no bins.
          items:
            type: string
          type: array
        compliance_label:
          description: The Metrc tag for the new package. Must be an available tag in the source package's license.
          type: string
        copy_custom_data_from_input:
          description: When true, copies the source package's custom field values onto the output package.
          type: boolean
        costs:
          description: Costs to apply to the output package. Optional.
          items:
            $ref: '#/components/schemas/CostEntryInput'
          type: array
        expiration_date:
          description: Expiration date reported to Metrc, e.g. "2027-08-19".
          type: string
        input_compliance_quantity:
          description: Amount drawn from the source package, in the source package's compliance unit. Must be > 0.
          type: number
        location_id:
          description: The output location ID. Must be in the same Metrc license as the source package.
          type: string
        metrc_item_id:
          description: The Metrc item id for the output. Required unless use_same_item is true, and must be omitted when it is. Must exist in the source package's Metrc license.
          type: integer
        metrc_notes:
          description: Notes sent to Metrc as the output package's note when it is created (max 255 characters).
          type: string
        metrc_production_batch_number:
          description: When set, flags the output as a Metrc production batch with this batch number.
          type: string
        output_compliance_quantity:
          description: Size of the new package, in the output package's compliance unit (the source unit when use_same_item is true, otherwise the unit of metrc_item_id). Must be > 0.
          type: number
        package_date:
          description: The output package's packaged date. Defaults to today when omitted.
          type: string
        product_id:
          description: The output product ID. Must be package-tracked.
          type: string
        use_same_item:
          description: When true, the output package reuses the source package's Metrc item and metrc_item_id must be omitted.
          type: boolean
      required:
      - compliance_label
      - location_id
      - product_id
      - output_compliance_quantity
      - input_compliance_quantity
      title: Split Package Output
      type: object
    AssemblyInput:
      description: An ingredient consumed by an assembly — the inventory used up to produce an output, and its cost.
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        compliance_quantity:
          description: The quantity of this input expressed in the package's unit type, as reported to the state compliance system, as a decimal string. Null when this input is not package-tracked.
          type: string
        cost_per_unit:
          description: Actual cost per unit — `total_cost_actual` divided by this input's quantity (in its product's unit).
          type: string
        cost_per_unit_default:
          description: Default (standard) cost per unit — `total_cost_default` divided by this input's quantity (in its product's unit).
          type: string
        id:
          description: ID for this assembly input
          type: string
        location:
          $ref: '#/components/schemas/LocationCompact'
        package:
          $ref: '#/components/schemas/Package'
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: The quantity of this input in its product's unit, as a decimal string (e.g. "25").
          type: string
        status:
          description: The status of this input. One of DRAFT (not yet fulfilled with a batch or package), PENDING (fulfilled and waiting to be consumed), or COMPLETED (consumed once the assembly was completed).
          type: string
        total_cost_actual:
          description: Total actual cost of the inventory consumed by this input. Distru traces the components that produced the consumed inventory and sums the real costs incurred along that chain — for example the price paid when a component was purchased, assembly costs, and costs added by stock adjustments, among others. This cost propagates to the output the input feeds.
          type: string
        total_cost_default:
          description: Total default (standard) cost of this input. Traced the same way as `total_cost_actual`, but each component is valued at its product's configured unit cost (the product's `unit_cost`) instead of its real cost.
          type: string
      required:
      - quantity
      - status
      - id
      title: AssemblyInput
      type: object
    Product:
      description: A sellable or trackable item in your catalog — its name, pricing, category, unit of measure, and how its inventory is tracked (see `inventory_tracking_method`).
      properties:
        batches_with_active_quantity_by_location:
          description: The product's batches that hold active quantity, grouped by location. Present only when the request passes `include_batches_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not batch-tracked or holds no active batches.
          items:
            $ref: '#/components/schemas/BatchesWithActiveQuantityByLocation'
          type: array
        bill_of_materials:
          $ref: '#/components/schemas/BillOfMaterials'
        brand:
          $ref: '#/components/schemas/CompanyCompact'
        category:
          $ref: '#/components/schemas/ProductCategoryCompact'
        creator:
          $ref: '#/components/schemas/User'
        custom_data:
          description: The custom data for this product
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        deleted_at:
          description: ISO 8601 datetime the product was soft-deleted at, or null when the product has not been deleted
          type: string
        description:
          description: Plain-text description of this product, or null when none was entered. Always null together with `description_markdown` and non-null together with it — one is never set without the other.
          type: string
        description_markdown:
          description: The same description in Markdown. Null when `description` is null; populated whenever `description` is populated.
          type: string
        external_name:
          description: Customer-facing name shown on DistruCommerce menus and the Order Tracker, or null when none is set (it does not fall back to `name`)
          type: string
        gross_weight:
          description: The gross weight of one unit including packaging, as a decimal string, measured in `gross_weight_unit_type`. Null when not set; it is always set together with `gross_weight_unit_type` and null together with it.
          type: string
        gross_weight_unit_type:
          $ref: '#/components/schemas/UnitType'
        id:
          description: ID for this product
          type: string
        images:
          description: 'The images associated with this product, in display order: by `rank`, lowest first (the first is the primary image), then by id. Images with no rank come last. Empty array when the product has no images.'
          items:
            $ref: '#/components/schemas/Image'
          type: array
        inserted_datetime:
          description: The datetime this product was created at
          type: string
        inventory_tracking_method:
          description: 'How this product''s inventory is tracked. One of: `BATCH` (grouped into batches sharing traits such as expiration dates and test results), `PACKAGE` (inventory is defined by packages), `PRODUCT` (ungrouped; inventory exists directly on the product).'
          enum:
          - PACKAGE
          - BATCH
          - PRODUCT
          type: string
        is_active:
          description: True when the product is active. False when it has been marked inactive (archived), which hides it from most product pickers.
          type: boolean
        is_featured:
          description: True when the product is flagged as featured
          type: boolean
        leaflink_product_id:
          description: The LeafLink product ID this product is synced to, or null if not synced
          type: integer
        menu_visibility:
          description: 'Which menus this product is shown in. One of `DO_NOT_INCLUDE`, `INCLUDE_IN_ALL`, `INCLUDE_IN_SELECT` (same values accepted by the upsert endpoint); defaults to `DO_NOT_INCLUDE`. The `menus` field below lists the specific menus the product belongs to — this is how you see which menus when the value is `INCLUDE_IN_SELECT`. Setting `INCLUDE_IN_ALL` adds the product to every menu, and a menu created later gets it too, except a copy of a menu it isn''t on, or a new (not copied) menu made by a user who can''t see the product: read `menus` for where it really is.'
          enum:
          - DO_NOT_INCLUDE
          - INCLUDE_IN_ALL
          - INCLUDE_IN_SELECT
          type: string
        menus:
          description: 'Menus this product is on, ordered by menu creation time then id (includes inactive menus). Follows `menu_visibility`: the chosen menus for `INCLUDE_IN_SELECT`, every menu but the exceptions listed under `menu_visibility` for `INCLUDE_IN_ALL`, and usually none for `DO_NOT_INCLUDE`. A change made by a team-restricted user never removes the product from menus that user can''t see, so those stay listed.'
          items:
            $ref: '#/components/schemas/CompactMenu'
          type: array
        msrp:
          description: Manufacturer's suggested retail price, as a decimal string (e.g. "19.99"), or null when not set
          type: string
        name:
          description: Human readable name for this product
          type: string
        owner:
          $ref: '#/components/schemas/User'
        packages_with_active_quantity_by_location:
          description: The product's packages that hold active quantity, grouped by location. Present only when the request passes `include_packages_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not package-tracked or holds no active packages.
          items:
            $ref: '#/components/schemas/PackagesWithActiveQuantityByLocation'
          type: array
        product_group:
          $ref: '#/components/schemas/ProductGroupCompact'
        quantity_active:
          description: Total active on-hand quantity of this product across all locations, as a decimal string (e.g. "100"). Sums the product's active stock — positive quantity held at a location. Equals the sum of the per-location amounts in `quantity_active_by_location`, so the two always reconcile. "0" when the product has no active stock. Reserved stock is still physically on-hand, so it is included here; subtract `quantity_reserved` to get `quantity_available`. Sold stock and in-transit stock (held by a user rather than a location) is excluded.
          type: string
        quantity_active_by_location:
          description: The product's active on-hand quantity broken down by location — one entry per location holding active stock, ordered by location id. Empty array when the product has no active stock. The entries sum to `quantity_active`.
          items:
            $ref: '#/components/schemas/QuantityActiveByLocation'
          type: array
        quantity_available:
          description: Active on-hand quantity minus reserved quantity, as a decimal string (e.g. "100"). Equals `quantity_active` − `quantity_reserved` — what is on-hand and not already spoken for by unfulfilled sales orders or draft assemblies. Can be negative when more is reserved than is on-hand at a location. "0" when the product has no active stock and nothing reserved.
          type: string
        quantity_available_threshold_max:
          description: 'Over-stock alert threshold: Distru flags the product when its available quantity rises above this value. Decimal string, or null when no over-stock alert is configured. When both thresholds are set, this is strictly greater than `quantity_available_threshold_min`.'
          type: string
        quantity_available_threshold_min:
          description: 'Low-stock alert threshold: Distru flags the product when its available quantity drops below this value. Decimal string, or null when no low-stock alert is configured. When both thresholds are set, this is strictly less than `quantity_available_threshold_max`.'
          type: string
        quantity_reserved:
          description: 'Total quantity of this product currently reserved across all locations, as a decimal string (e.g. "100"). Reserved quantity is a soft hold tracked separately from on-hand stock (`quantity_active`): it rises as unfulfilled sales order items and draft assembly inputs are created, and falls as they are deleted or fulfilled. "0" when nothing is reserved.'
          type: string
        sku:
          description: The stock keeping unit (SKU) configured for this product
          type: string
        strain:
          $ref: '#/components/schemas/Strain'
        subcategory:
          $ref: '#/components/schemas/ProductSubcategoryCompact'
        tags:
          description: The tags associated with this product. Empty array when the product has no tags.
          items:
            $ref: '#/components/schemas/ProductTagRef'
          type: array
        tasks:
          description: 'The tasks linked to this product that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        total_cannabinoid_unit:
          description: The unit `total_thc` and `total_cbd` are measured in — one of MG (milligrams per unit) or PERCENT (percent by weight). Null when neither potency value is set.
          type: string
        total_cbd:
          description: Total CBD potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        total_thc:
          description: Total THC potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        treez_wholesale_price:
          description: The Treez wholesale price of this product, as a decimal string, or null when not set
          type: string
        unit_cost:
          description: The cost (purchase price) of one unit of this product, as a decimal string, or null when not set
          type: string
        unit_net_weight:
          description: The net contents of one unit of this product (weight, volume, or count of the contents), as a decimal string, measured in `unit_net_weight_serving_size_unit_type`. Null when not set.
          type: string
        unit_net_weight_serving_size_unit_type:
          $ref: '#/components/schemas/UnitType'
        unit_price:
          description: The list (sale) price of one unit of this product, as a decimal string (e.g. "25.00")
          type: string
        unit_serving_size:
          description: The serving size per unit, as a decimal string, measured in `unit_net_weight_serving_size_unit_type` (the same unit as `unit_net_weight`). Null when not set. When both are set, this is at most `unit_net_weight`.
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        units_per_case:
