        custom_data:
          description: The custom data for this assembly
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        description:
          description: Free-text description of this assembly, or null when none was entered
          type: string
        estimated_start_datetime:
          description: ISO 8601 datetime the assembly is expected to start, or null when not set.
          type: string
        estimated_work_hours:
          description: The whole-hours part of the estimated work time. Pairs with `estimated_work_minutes` (e.g. 90 minutes of work reads as `estimated_work_hours` 1, `estimated_work_minutes` 30). Null when no estimate is set.
