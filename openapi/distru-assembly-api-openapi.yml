    UpsertAssemblyRequest:
      description: An assembly to create, update, or delete, with its outputs, inputs, and costs
      properties:
        action:
          description: CREATE, UPDATE, or DELETE. Required. DELETE removes the assembly and all of its outputs, inputs, and costs.
          enum:
          - CREATE
          - UPDATE
          - DELETE
          type: string
        custom_data:
          description: 'A map of custom field IDs to their values for this assembly. Use GET /public/v1/custom-fields?parent_object=assembly to retrieve the available fields, their IDs, and their types. The value format depends on the field''s type: a text field takes a string, a date field takes a full ISO8601 datetime, and a checkbox field takes an array of its selected options. On update this replaces the whole custom-data map, so send every field you want to keep.'
          example:
            '101': Some text value
            '102': '2026-08-18T00:00:00.000-07:00'
            '103':
            - Option A
            - Option B
          type: object
        description:
          description: A free-text description for this assembly. Editable at any status.
          type: string
        estimated_start_datetime:
          description: When this assembly is planned to start, as an ISO 8601 datetime (e.g. `2026-08-19T00:00:00Z`). Optional; omit to leave it unset.
          type: string
        estimated_work_hours:
          description: The whole-hours portion of the estimated work time; must be 0 or greater. Combine with `estimated_work_minutes` for the full estimate (e.g. 1 hour 30 minutes is `estimated_work_hours` 1, `estimated_work_minutes` 30). Editable at any status.
          type: integer
        estimated_work_minutes:
          description: The minutes portion of the estimated work time; must be 0 or greater. Pairs with `estimated_work_hours` (see above). Editable at any status.
          type: integer
        id:
          description: The assembly to update or delete. Required for UPDATE and DELETE; omit for CREATE. An ID that doesn't exist for your company returns 404, and one your team restrictions hide returns 403.
          type: string
        metrc_processing_job:
          $ref: '#/components/schemas/UpsertAssemblyMetrcProcessingJob'
        outputs:
          description: 'The outputs this assembly produces, each with its own inputs and costs. Sparse on update: an output you omit is left untouched; remove one by sending it with `action` `DELETE`.'
          items:
            $ref: '#/components/schemas/UpsertAssemblyOutput'
          type: array
        owner_id:
          description: The ID of the user that owns this assembly. Optional. Editable at any status.
          type: string
        status:
          description: The assembly's lifecycle state, `PENDING` or `COMPLETED` (SCREAMING_CASE). Required when creating. `PENDING` claims/reserves ingredient inventory but consumes nothing; `COMPLETED` consumes the inputs and produces the outputs into inventory, and requires every output to be COMPLETED. Creating directly as `COMPLETED` performs that consumption immediately. Once `COMPLETED` an assembly cannot be moved back to `PENDING` and only a few fields remain editable (see the endpoint description).
          enum:
          - PENDING
          - COMPLETED
          type: string
      required:
      - action
      title: Upsert Assembly Request
      type: object
    TaskCompact:
      description: A compact reference to a task, as it appears in another entity's `tasks` list.
      properties:
        due_datetime:
