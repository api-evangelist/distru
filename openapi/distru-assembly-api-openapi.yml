      - id
      title: Task (compact)
      type: object
    UpsertAssemblyInput:
      description: 'An ingredient consumed by the assembly to produce an output.


        A fulfilled input (`status` `PENDING` or `COMPLETED`) draws specific on-hand inventory, and its fields depend on how the product is tracked (send only the ones listed; omit the rest):


        - Package-tracked: `package_id` + `compliance_quantity`. The product and location are derived from the package.

        - Batch-tracked: `batch_id` + `quantity` + `location_id`. The product is derived from the batch.

        - Product-tracked: `product_id` + `quantity` + `location_id`.


        A `DRAFT` input is a planned ingredient with no specific lot chosen yet — it only reserves product-level quantity. Send `product_id` + `quantity` + `location_id` and omit `batch_id`, `package_id`, and `compliance_quantity`. DRAFT is only for batch- and package-tracked products (a product-tracked product has a single implicit lot, so there is nothing to defer). When the input later moves to `PENDING`/`COMPLETED` the reservation is released and a specific batch or package is consumed. While the assembly is `PENDING` an input may be `DRAFT`, `PENDING`, or `COMPLETED`; once the assembly is `COMPLETED` every input must be `COMPLETED`.

        '
      properties:
        action:
          description: CREATE, UPDATE, or DELETE. Required.
          enum:
          - CREATE
          - UPDATE
          - DELETE
          type: string
        batch_id:
          description: The source batch. Required for a fulfilled batch-tracked input — its product is derived from it — and must be omitted for package/product-tracked and DRAFT inputs.
          type: string
        compliance_quantity:
          description: The consumed quantity in the package's compliance unit (Metrc). Required for a fulfilled package-tracked input; must be omitted otherwise (including DRAFT).
          type: number
        id:
          description: The input to update or delete. Required for UPDATE and DELETE; omit for CREATE.
          type: string
        location_id:
          description: The location the input is drawn from. Required for batch-tracked, product-tracked, and DRAFT inputs; omit for a package-tracked input (derived from the package).
          type: string
        package_id:
          description: The source package. Required for a fulfilled package-tracked input — its product and location are derived from it — and must be omitted for batch/product-tracked and DRAFT inputs.
          type: string
        product_id:
          description: The input product. Required for product-tracked and DRAFT inputs; for package/batch-tracked inputs it is derived from the package or batch, so omit it.
          type: string
        quantity:
          description: The consumed quantity in the product's unit. Required for batch-tracked, product-tracked, and DRAFT inputs; omit for package-tracked inputs (use `compliance_quantity` there).
          type: number
        status:
          description: PENDING, COMPLETED, or DRAFT. Required when creating. DRAFT reserves product-level inventory without picking a specific lot; PENDING/COMPLETED consume specific inventory.
          enum:
          - COMPLETED
          - DRAFT
          - PENDING
          type: string
      required:
      - action
      title: Upsert Assembly Input
      type: object
    BillOfMaterials:
      description: A product's bill of materials (recipe of inputs and additional costs)
