    UpsertAssemblyOutput:
      description: 'An output produced by the assembly. What you send depends on how the output product''s inventory is tracked:


        - Product-tracked (non-compliance): `product_id` + `quantity` + `location_id`. The batch is the product''s existing batch (derived — omit `batch_id`).

        - Batch-tracked (non-compliance): `product_id` + `quantity` + `location_id`. Optionally set `batch_id` to use an existing batch, or omit it and a new batch is created on completion (named by `batch_number`).

        - Package-tracked (Metrc): `product_id` + `location_id` (a Metrc-licensed facility) + `compliance_quantity` + `compliance_label` (the Metrc tag) + a Metrc item (`metrc_item_id` or `use_same_item=true`). Omit `batch_id` (derived from the product''s batch) and `quantity` (derived from `compliance_quantity`). Distru creates the package when the output is completed.


        These fields apply to package-tracked (Metrc) outputs only and must be omitted otherwise: `compliance_quantity`, `compliance_label`, `metrc_item_id`, `use_same_item`, `metrc_location_id`, `metrc_notes`, `metrc_production_batch_number`, `is_trade_sample`, `is_finished_good`, `expiration_date`, `package_date`.

        '
      properties:
        action:
          description: CREATE, UPDATE, or DELETE. Required.
          enum:
          - CREATE
          - UPDATE
          - DELETE
          type: string
        batch_id:
          description: 'The batch this output belongs to. Product-tracked and package-tracked: always omit it. Batch-tracked: optional — set it to an existing batch''s ID and the output quantity lands in that batch, or leave it blank and the output quantity lands in a new batch (named by `batch_number`).'
          type: string
        batch_number:
          description: 'The Distru batch number recorded on the output (1-255 characters). Batch-tracked: names the new batch created when `batch_id` is omitted. Package-tracked: sets the created package''s Distru batch number.'
          type: string
        bin_ids:
          description: 'The bins to store the output in, applied when the output is completed (requires bin inventory tracking enabled for the company). Package-tracked: sets the bins on the package Distru creates. Batch-tracked: replaces the batch''s current bin set — an empty array clears it. Not applicable to product-tracked outputs.'
          items:
            type: string
          type: array
        compliance_label:
          description: Package-tracked (Metrc) outputs only. The Metrc tag for the created package; must be an available tag in the output's license. Required to complete the output.
          type: string
        compliance_quantity:
          description: Package-tracked (Metrc) outputs only. The output quantity in the package's Metrc unit — the unit type of the package's Metrc item, which comes from `metrc_item_id` (or from the input package's item when `use_same_item=true`). `quantity` is derived from it by unit conversion. Send this when creating a package-tracked output.
          type: number
        copy_custom_data_from_input:
          description: Copy custom field values from the input onto this output.
          type: boolean
        costs:
          description: The costs added directly to this output.
          items:
            $ref: '#/components/schemas/UpsertAssemblyCost'
          type: array
        expiration_date:
          description: Package-tracked (Metrc) outputs only. The expiration date reported to Metrc for the created package, e.g. "2027-08-19".
          type: string
        id:
          description: The output to update or delete. Required for UPDATE and DELETE; omit for CREATE.
          type: string
        inputs:
          description: The inputs consumed to produce this output.
          items:
            $ref: '#/components/schemas/UpsertAssemblyInput'
          type: array
        is_finished_good:
          description: Package-tracked (Metrc) outputs only. When true, Distru flags the created package in Metrc as a Finished Good.
          type: boolean
        is_trade_sample:
          description: Package-tracked (Metrc) outputs only. Marks the created package as a Metrc trade sample.
          type: boolean
        location_id:
          description: The location the output is produced into. Required when creating.
          type: string
        metrc_item_id:
          description: Package-tracked (Metrc) outputs only. The Metrc item for the created package. Provide this or `use_same_item=true` (mutually exclusive).
          type: integer
        metrc_location_id:
          description: Package-tracked (Metrc) outputs only. The Metrc ID of the Metrc location the package will be created in. Only applicable if the output's Metrc license uses Metrc locations.
          type: integer
        metrc_notes:
          description: Package-tracked (Metrc) outputs only. Notes sent to Metrc when the package is created (max 255 characters).
          type: string
        metrc_production_batch_number:
          description: Package-tracked (Metrc) outputs only. Flags the created package in Metrc as a production batch and gives it this production batch number.
          type: string
        package_date:
          description: Package-tracked (Metrc) outputs only. The packaged date reported to Metrc for the created package. Defaults to today when omitted.
          type: string
        product_id:
          description: The product this output produces. Required when creating.
          type: string
        quantity:
          description: The output quantity in the product's unit. Required when creating product- and batch-tracked outputs. Omit it for package-tracked outputs — send `compliance_quantity` instead and `quantity` is derived from it by unit conversion.
          type: number
        status:
          description: PENDING or COMPLETED. Required when creating. On a Metrc processing-job assembly a package-tracked output may be COMPLETED (synced to Metrc) while the assembly stays PENDING; otherwise an output can only be COMPLETED together with the whole assembly.
          enum:
          - PENDING
          - COMPLETED
          type: string
        use_same_item:
          description: Package-tracked (Metrc) outputs only. Reuse the source input package's Metrc item instead of `metrc_item_id` (mutually exclusive with it). Valid only when the output's inputs all share the same Metrc item.
          type: boolean
      required:
      - action
      title: Upsert Assembly Output
      type: object
    Package:
      description: A specific, compliance-tracked quantity of a product identified by a unique tag (e.g. a Metrc package). This is the physical unit of inventory for package-tracked products. This is the compact reference; see PackageFull for all fields.
      properties:
        batch_number:
          description: A free-text batch number set on the package, separate from any compliance tag. Null when none is set.
          type: string
        compliance_label:
          description: The unique tag assigned by the state compliance system (e.g. the Metrc package tag). Always present for Metrc-tracked packages; may be null for BioTrack packages, and null when the package is not compliance-tracked.
          type: string
        distru_status:
          description: 'The package''s inventory lifecycle status. One of:• ACTIVE: on hand and available.• ASSEMBLING: allocated to a pending assembly.• SELLING: reserved on an open sales order.• SOLD: consumed by a completed sale.• RETURNING: on an in-progress return.• TRANSFERRED: sent out on a compliance transfer.• ONHOLD: placed on hold in the compliance system.• FINISHED: finished in the compliance system.• DISCONTINUED: discontinued.• DESTROYED: destroyed.'
          enum:
          - ACTIVE
          - ASSEMBLING
          - DESTROYED
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - RETURNING
          - SELLING
          - SOLD
          - TRANSFERRED
          type: string
        id:
          description: ID for this package in Distru
          type: string
        license_id:
          description: The ID of the [license](#model-license) this package is held under
          type: string
        location_id:
          description: The ID of the [location](#model-location) where this package is physically stored
          type: string
        metrc_id:
          description: The Metrc package ID for this package; null for non-Metrc packages
          type: integer
        quantity:
          description: The total on-hand quantity of this package, in the package's `unit_type`, as a decimal string (e.g. "100"). Always equals `quantity_active` + `quantity_assembling`. Never negative.
          type: string
        quantity_active:
          description: The freely usable portion of `quantity` — what can be used as an assembly input, moved to another location, added to a sales order, or adjusted down. Equals `quantity` minus `quantity_assembling`, in the package's `unit_type`, as a decimal string. Never negative.
          type: string
      required:
      - distru_status
      - quantity_active
      - quantity
      - location_id
      - license_id
      - id
      title: Package
      type: object
    CreateTestSampleRequest:
      description: A Metrc source package and the test sample package to create from it
      properties:
        batch_number:
          description: Distru batch number stored on the sample package. When omitted, copies the source package's batch number; pass null explicitly to leave the sample without one.
          type: string
        compliance_label:
          description: The Metrc tag for the sample package. Must be an available tag in the source package's license.
          type: string
        expiration_date:
          description: Expiration date reported to Metrc, e.g. "2027-08-19". When omitted, copies the source package's expiration date; pass null explicitly to leave the sample without one.
          type: string
        input_compliance_quantity:
          description: Amount drawn from the source package, in the source package's compliance unit. Must be > 0.
          type: number
        lab_test_batches:
          description: 'The Metrc lab test batches to assign to the sample, by exact name. Valid names depend on the license and the sample item''s Metrc product category — list them with [GET /public/v1/metrc/lab-test-batches](#get-metrc-lab-test-batches), which groups them by item category and marks the ones Metrc requires. Every `required: true` batch must be included; an unknown or disallowed name is rejected. Omit entirely when the license''s facility does not use package sample lab test batches. At most 200 items.'
          items:
            type: string
          type: array
        location_id:
          description: The location ID the sample package is produced into. Must be in the same Metrc license as the source package. Defaults to the source package's location when omitted or null.
          type: string
        metrc_item_id:
          description: The Metrc item id for the sample. Required unless use_same_item is true, and must be omitted when it is. Must exist in the source package's Metrc license.
          type: integer
        metrc_location_id:
          description: The Metrc ID of the Metrc location the sample package will be created in. Only applicable if the license uses Metrc locations. Defaults to the source package's Metrc location when omitted or null.
          type: integer
        metrc_notes:
          description: Notes sent to Metrc as the sample package's note when it is created (max 255 characters).
          type: string
        output_compliance_quantity:
          description: Size of the test sample package, in the sample's compliance unit (the source unit when use_same_item is true, otherwise the unit of metrc_item_id). Must be > 0. Defaults to input_compliance_quantity when omitted or null.
          type: number
        package_date:
          description: The sample package's packaged date. Defaults to today when omitted.
          type: string
        product_id:
          description: The sample's product ID. Must be package-tracked. Defaults to the source package's product when omitted or null.
          type: string
        source_package_id:
          description: The package to pull the sample from. Must be package-tracked and in a Metrc license. An ID that doesn't exist for your company returns 404, and one your team restrictions hide returns 403.
          type: string
        use_same_item:
          description: When true, the sample package reuses the source package's Metrc item and metrc_item_id must be omitted.
          type: boolean
      required:
      - compliance_label
      - input_compliance_quantity
      - source_package_id
      title: Create Test Sample Request
      type: object
    CostEntryInput:
      description: A single cost to apply to a record
      properties:
        cost_per_unit:
          description: Per-unit amount as a decimal (e.g. "10.00"). When omitted, the cost type's own cost per unit is used. Must be omitted for cost types with a locked cost per unit (those that don't allow inline editing) — sending it for such a type is rejected. It is only required when an inline-editable cost type has no cost per unit of its own
          type: number
        cost_type_id:
          description: Required. The cost type to apply, given as its ID from GET /public/v1/cost-types. Must exist and be accessible to the authenticated company
          type: string
        description:
          description: Optional free-form text stored on the cost
          type: string
        quantity:
          description: Required. How many units of the cost type to apply, as a decimal (e.g. "2.5"). Must be greater than 0. The amount added to each record's cost basis is cost_per_unit × quantity
          type: number
      required:
      - quantity
      - cost_type_id
      title: Cost Entry
      type: object
    SplitPackageRequest:
      description: A Metrc source package and the output packages to split it into
      properties:
        outputs:
          description: The output packages to create, between 1 and 300
          items:
            $ref: '#/components/schemas/SplitPackageOutput'
          type: array
        source_package_id:
          description: The package to split. Must be package-tracked and in a Metrc license. An ID that doesn't exist for your company returns 404, and one your team restrictions hide returns 403.
          type: string
      required:
      - outputs
      - source_package_id
      title: Split Package Request
      type: object
    Image:
      description: An image as shown in Distru
      properties:
        id:
          description: ID for this image
          type: string
        name:
          description: Original file name of this image, or null when unknown
          type: string
        rank:
          description: Display slot of this image among the product's images, 0 to 3; the lowest rank is the primary image. Null when unranked
          type: integer
        url:
          description: URL to the full-size (original) image file, or null when no file is available
          type: string
      required:
      - id
      title: Image
      type: object
    BillOfMaterialsCostType:
      description: The cost type applied by a bill-of-materials cost
      properties:
        cost_per_unit:
          description: The cost per unit, as a decimal string (e.g. "5.00"). Present only when the caller has the `costs_permissions_view_cost_types_cost_per_unit` permission; the field is omitted otherwise.
          type: string
        id:
          description: ID for this cost type
          type: string
        name:
          description: Human readable name for this cost type
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - name
      - id
      title: BillOfMaterialsCostType
      type: object
    PackagesWithActiveQuantityByLocation:
      description: A location and the product's packages that hold active quantity there.
      properties:
        location:
          $ref: '#/components/schemas/LocationCompact'
        packages:
          description: The product's packages held at this location that have active quantity, ordered by id.
          items:
            $ref: '#/components/schemas/Package'
          type: array
      required:
      - packages
      - location
      title: PackagesWithActiveQuantityByLocation
      type: object
    BatchesWithActiveQuantityByLocation:
      description: A location and the product's batches that hold active quantity there.
      properties:
        batches:
          description: The product's batches with active quantity at this location, each carrying its active quantity there, ordered by id.
          items:
            $ref: '#/components/schemas/BatchCompactWithQuantityActive'
          type: array
        location:
          $ref: '#/components/schemas/LocationCompact'
      required:
      - batches
      - location
      title: BatchesWithActiveQuantityByLocation
      type: object
    Strain:
      description: A cannabis strain (its genetics), such as "Blue Dream". Products can be linked to a strain to carry its name and type.
      properties:
        id:
          description: ID for this strain
          type: string
        inserted_datetime:
          description: The datetime this strain was created at
          type: string
        name:
          description: Name of the strain
          type: string
        strain_type:
          description: The genetic classification of the strain. Null when unset.
          enum:
          - INDICA
          - INDICA_DOMINANT
          - SATIVA
          - SATIVA_DOMINANT
          - HYBRID
          - HIGH_CBD
          type: string
        updated_datetime:
          description: The datetime this strain was last updated at
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - name
      - id
      title: Strain
      type: object
    ProductSubcategoryCompact:
      description: A finer classification within a product category (e.g. "Pre-Rolls" under Flower).
      properties:
        id:
          description: ID for this subcategory
          type: string
        name:
          description: Human readable name for this subcategory
          type: string
      required:
      - name
      - id
      title: ProductSubcategoryCompact
      type: object
    BatchCompactWithQuantityActive:
      description: A compact [batch](#model-batch) reference plus its active on-hand quantity at the location it is nested under.
      properties:
        batch_number:
          description: The batch number for this batch, or null when none is set
          type: string
        id:
          description: ID for this batch
          type: string
        name:
          description: Human readable name for this batch
          type: string
        quantity_active:
          description: The batch's active on-hand quantity at this location, as a decimal string (e.g. "100"). Always positive.
          type: string
      required:
      - quantity_active
      - name
      - id
      title: BatchCompactWithQuantityActive
      type: object
    Batch:
      description: A lot of a product — a group of inventory that shares traits such as a harvest/production run, expiration date, and lab results. Used for batch-tracked products. This is the compact reference; see BatchFull for all fields.
      properties:
        id:
          description: ID for this batch
          type: string
        name:
          description: Human readable name for this batch
          type: string
      required:
      - name
      - id
      title: Batch
      type: object
    AssemblyOutput:
      description: A finished product produced by an assembly, along with the quantity made and its cost.
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        batch_number:
          description: The batch number for this output, or null when none is set
          type: string
        bins:
          description: The bins this output's package is stored in. Empty when the output is not stored in any bin (including when it is not package-tracked).
          items:
            $ref: '#/components/schemas/BinCompact'
          type: array
        compliance_label:
          description: The unique tag assigned by the state compliance system (the Metrc package tag or BioTrack barcode). Null when this output has no compliance tag.
          type: string
        compliance_quantity:
          description: The quantity of this output expressed in the package's unit type, as reported to the state compliance system, as a decimal string. Null when this output is not package-tracked.
          type: string
        copy_custom_data_from_input:
          description: True when this output copies its custom field values from its input rather than carrying its own.
          type: boolean
        cost_per_unit:
          description: Actual cost per unit — `total_cost_actual` divided by this output's quantity (in its product's unit).
          type: string
        cost_per_unit_default:
          description: Default (standard) cost per unit — `total_cost_default` divided by this output's quantity (in its product's unit).
          type: string
        costs:
          description: The costs added directly to this assembly output (e.g. labor or packaging), on top of the material cost carried over from its inputs
          items:
            $ref: '#/components/schemas/AssemblyCost'
          type: array
        expiration_date:
          description: The expiration date for this output (e.g. "2026-08-20"), or null when none is set
          type: string
        id:
          description: ID for this assembly output
          type: string
        inputs:
          description: The inputs (source inventory) consumed to produce this output. Their cost propagates to this output and is reflected in its actual cost fields (`total_cost_actual` and `cost_per_unit`).
          items:
            $ref: '#/components/schemas/AssemblyInput'
          type: array
        is_donation:
          description: True when this output is marked as a donation.
          type: boolean
        is_finished_good:
          description: True if this output is a finished, sellable product (rather than an intermediate/work-in-progress item). Only applies to Metrc-tracked outputs.
          type: boolean
        is_production_batch:
          description: True if this output is a new production lot created by the assembly (rather than adding to existing inventory). Only applies to Metrc-tracked outputs.
          type: boolean
        is_test_sample:
          description: True when this output is a test sample.
          type: boolean
        is_trade_sample:
          description: True when this output is a trade sample.
          type: boolean
        lab_test_batches:
          description: The Metrc lab test batch names assigned to this output when it was created as a test sample (the `lab_test_batches` sent to POST `/public/v1/assemblies/create_test_sample`); null when the output is not a test sample or none were assigned.
          items:
            type: string
          type: array
        location:
          $ref: '#/components/schemas/LocationCompact'
        metrc_item_id:
          description: The Metrc item id for this output. A Metrc identifier, not a Distru ID. Null when not applicable.
          type: integer
        metrc_location_id:
          description: The Metrc location id for this output. A Metrc identifier, not a Distru ID. Null when not applicable.
          type: integer
        metrc_notes:
          description: Notes recorded on this output that are sent to Metrc as the package's note when the package is created. Null when none.
          type: string
        metrc_production_batch_number:
          description: The Metrc production batch number, set only when this output is a production batch (see `is_production_batch`); otherwise null.
          type: string
        package:
          $ref: '#/components/schemas/Package'
        package_date:
          description: The date this output's package was created (e.g. "2026-08-20"), or null when not set
          type: string
        package_unit_type:
          $ref: '#/components/schemas/UnitType'
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: The quantity of this output in its product's unit, as a decimal string (e.g. "100").
          type: string
        status:
          description: The status of this output. One of PENDING (not yet produced into inventory) or COMPLETED (produced, once the assembly is completed).
          type: string
        total_cost_actual:
          description: Total actual cost of this output. Distru traces the inputs and components consumed to produce it and sums the real costs incurred along that chain — for example the price paid when a component was purchased, assembly costs, and costs added by stock adjustments, among others — plus the costs added directly on this output (see `costs`).
          type: string
        total_cost_default:
          description: Total default (standard) cost of this output. Traced the same way as `total_cost_actual`, but each input/component is valued at its product's configured unit cost (the product's `unit_cost`) instead of its real cost.
          type: string
        use_same_item:
          description: True when this output reuses the source package's Metrc item rather than mapping to a new one.
          type: boolean
      required:
      - inputs
      - costs
      - bins
      - is_finished_good
      - is_production_batch
      - is_trade_sample
      - is_test_sample
      - is_donation
      - use_same_item
      - status
      - quantity
      - id
      title: AssemblyOutput
      type: object
  requestBodies:
    DistruPublic.V1.AssemblyController.download_pdfBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              format:
                enum:
                - binary
                - url
                - email
                type: string
                description: 'How the generated PDF is delivered. One of `binary` — the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` — a JSON body with a short-lived signed download URL (see the [PdfResponse](#model-pdfresponse) response); or `email` — emails the PDF to the addresses in `email_addresses` and returns a JSON body listing who it was emailed to. Required, but omitting it defaults to `binary` for backward compatibility.'
              email_addresses:
                items:
                  type: string
                type: array
                description: Recipient email addresses, used only when `format` is `email` (required in that case, ignored otherwise). An entry may hold several comma-separated addresses; spaces, blank entries and repeats are dropped, and `emailed_to` lists the addresses actually emailed. At least one address is required and every address must be valid, otherwise the request is rejected with a 400. At most 200 addresses may be given, counted after that cleanup.
            required:
            - format
      required: true
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: 'API token generated in Distru (Settings → Distru API). Send it on every request as `Authorization: Bearer YOUR_API_TOKEN`.'
