        creation_source:
          description: 'How this assembly was created.• MANUALLY_CREATED: created by a user in Distru or via the API.• SALES_ORDER: created automatically to repackage inventory while fulfilling a sales order.• SPLIT_PACKAGE: created by splitting an existing package into smaller packages.• LAB_TESTING: created to pull a test sample for lab testing.'
          enum:
