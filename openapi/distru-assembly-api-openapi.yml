          - COMPLETED
          type: string
        tasks:
          description: 'The tasks linked to this assembly that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
