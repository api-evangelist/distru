                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upsert a company's license
      tags:
      - Company
  /public/v1/companies/{id}/locations:
    post:
      description: 'Upsert a single location of one of the companies in your CRM — one POST handles both create and update. Include an existing location `id` in the body to update that location, or omit `id` to create a new one. The create path returns 201 and the update path returns 200; either way the response body is the full location, including its geocoded `latitude`/`longitude`. The location also appears in the company''s `locations` array on the company endpoints; it is not returned by GET /public/v1/locations, which lists only your own company''s locations.


        This endpoint only manages the locations of your partner companies: the `{id}` in the path must be a company in your CRM other than your own company. To manage your own company''s locations, use POST /public/v1/locations instead.


        `latitude` and `longitude` cannot be sent — they are derived by geocoding the address, because Distru uses these coordinates to generate directions for transfer templates and to optimize delivery routes. Since those features require coordinates, an address that cannot be geocoded is rejected: nothing is saved and the request returns 400 (correct the address fields and retry). If the geocoding service itself is temporarily unavailable the request returns 503 — the address may be fine; retry later. Previously geocoded addresses resolve without contacting the geocoding service.


        Updates are sparse: only the fields you send are changed, any field you omit keeps its current value, and sending `null` for a nullable field clears it (a required field rejects `null` with a 400). Changing any address field re-geocodes the location and refreshes its coordinates.


        Required permission: `companies_permissions_create` to create a location, `companies_permissions_edit` to update an existing one.'
      operationId: DistruPublic.V1.CompanyController.upsert_location
      parameters:
      - description: ID of the company (as returned by [GET /public/v1/companies](#get-companies)) the location belongs to. Must be a company in your CRM other than your own company; an ID that doesn't exist for your company returns 404, and one your team restrictions hide returns 403.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID of the location. Provide it to update that location — it must belong to the company in the path and not be soft-deleted, otherwise the request returns 404. Omit it to create a new location.
                name:
                  type: string
                  description: Display name of the location. Required on create; cannot be set to `null`. Characters with diacritics are replaced with their closest ASCII equivalent (e.g. `Española` becomes `Espanola`).
                street_address:
                  type: string
                  description: Street address (e.g. `1234 Mission St`). Required on create; cannot be set to `null`. Part of the geocoded address.
                apt:
                  type: string
                  description: Apartment, suite, or unit within the street address, or `null` to clear it. Optional.
                city:
                  type: string
                  description: City of the address. Required on create; cannot be set to `null`.
                state:
                  type: string
                  description: State or region of the address. Required on create; cannot be set to `null`. When `country` is `US`, must be a two-letter US state abbreviation (e.g. `CA`).
                zip:
                  type: string
                  description: Postal code of the address. Required on create; cannot be set to `null`. When `country` is `US`, must be a valid ZIP code (`#####` or `#####-####`) whose prefix matches the state.
                country:
                  type: string
                  description: Country of the address as an ISO 3166-1 alpha-2 code (e.g. `US`). Required on create; cannot be set to `null`. Official country names and common spellings are normalized to their code (e.g. `United States` becomes `US`).
                license_id:
                  type: string
                  description: ID of a [license](#model-license) held by the same company, linking the location to that license, or `null` to unlink. Optional. A license that doesn't belong to the company in the path is rejected with a 400. Manage the company's licenses via [POST /public/v1/companies/{id}/licenses](#upsert-a-companys-license).
      responses:
        '200':
          description: An updated location
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '201':
          description: A new location
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The geocoding service is temporarily unavailable — retry later
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upsert a company's location
      tags:
      - Company
components:
  schemas:
    PaymentTerm:
      description: The agreed timeframe a customer has to pay — for example "Net 30" means payment is due 30 days after the invoice.
      properties:
        days:
          description: Number of days after the invoice date until payment is due. 0 means due the same day.
          type: integer
        id:
          description: ID for this payment term
          type: string
        inserted_datetime:
          description: The datetime this payment term was created at
          type: string
        locked:
          description: True when this is a built-in Distru default payment term. A locked term cannot be deleted and only its `time_of_day` can be edited; an unlocked one is fully editable.
          type: boolean
        name:
          description: Name of the payment term. Unique per company (case-insensitive).
          example: Net 30
          type: string
        time_of_day:
          description: Time of day on the due date that payment is due, as "HH:MM:SS" (e.g. "17:00:00"). Defaults to "17:00:00".
          example: '17:00:00'
          type: string
        updated_datetime:
          description: The datetime this payment term was last updated at
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - locked
      - time_of_day
      - days
      - name
      - id
      title: PaymentTerm
      type: object
    LicenseResponse:
      description: A single license wrapped in a data envelope
      properties:
        data:
          $ref: '#/components/schemas/License'
      title: License Response
      type: object
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    LocationResponse:
      description: A single location wrapped in a data envelope
      properties:
        data:
          $ref: '#/components/schemas/Location'
      title: Location Response
      type: object
    Company:
      description: A business in your network — a customer, a vendor, or both. Holds contact details, locations, licenses, and the terms you deal on.
      properties:
        category:
          description: The kind of cannabis business this company is (Title-Case, not SCREAMING_CASE) — one of Dispensary, Delivery, Cultivator, Manufacturer, Distributor, Microbusiness, Lab, Retail, or Other. Companies in a Michigan CRM use Retail - Affiliated or Retail - Unaffiliated instead of Retail, though a Michigan company that had Retail before the split keeps it until it is changed. Null when no category is set.
          enum:
          - Cultivator
          - Delivery
          - Dispensary
          - Distributor
          - Lab
          - Manufacturer
          - Microbusiness
          - Other
          - Retail
          - Retail - Affiliated
          - Retail - Unaffiliated
          type: string
        custom_data:
          description: The custom data for this company
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        default_email:
          description: The primary email address for this company, or null when not set
          type: string
        default_payment_term:
          $ref: '#/components/schemas/PaymentTerm'
        default_purchase_order_notes:
          description: The default notes automatically added to purchase orders when this company is the supplier, or null when not set
          type: string
        default_sales_order_notes:
          description: The default external notes automatically added to sales orders when this company is the customer, or null when not set
          type: string
        deleted_at:
          description: ISO 8601 datetime this company was deleted at, or null when it is not deleted
          type: string
        group:
          $ref: '#/components/schemas/CompanyGroup'
        id:
          description: ID for this company
          example: 3f128a34-cc59-4b49-8883-23bf10e59c6c
          type: string
        inserted_datetime:
          description: ISO 8601 datetime this company was created at
          type: string
        invoice_email:
          description: The email address where sales order invoices are delivered, or null when not set
          type: string
        leaflink_brand_id:
          description: The LeafLink brand ID mapped to this company; only set on self-relationships (your own company), otherwise null
          type: integer
        leaflink_customer_id:
          description: The LeafLink customer ID mapped to this company, or null when it is not mapped to a LeafLink customer
          type: integer
        legal_business_name:
          description: The legal business name for this company. Empty string when never set.
          type: string
        licenses:
          description: The licenses held by this company. Empty when the company has none.
          items:
            $ref: '#/components/schemas/License'
          type: array
        locations:
          description: The locations belonging to this company. Empty when the company has none.
          items:
            $ref: '#/components/schemas/LocationCompact'
          type: array
        name:
          description: Human readable name for this company
          example: Retailer 1
          type: string
        order_shipment_email:
          description: The email address where sales order shipment packing slips are delivered, or null when not set
          type: string
        outstanding_balance:
          description: The current outstanding balance for this company, as a decimal string (e.g. "150.50"). "0" when nothing is outstanding, and can be negative when the company has more unused credit than they owe. Computed as the unpaid total of all invoices on the company's non-canceled orders (invoice total minus non-voided payments), reduced by the company's remaining unused credit (active credits issued minus credit already applied). Changes to it do not update `updated_datetime`; subscribe to `COMPANY_RELATIONSHIP` webhooks to follow it.
          type: string
        outstanding_balance_threshold:
          description: The balance above which this company is treated as over its credit limit; when the balance exceeds it, Distru shows a warning banner on the company's page and when selling to them. Depending on your account's settings it is compared with either `outstanding_balance` or `past_due_balance`; this API doesn't expose which. Null when no threshold is set.
          type: integer
        owner:
          $ref: '#/components/schemas/User'
        owner_id:
          description: The ID of the Distru [user](#model-user) who is the account owner (main point of contact) for this company, or null when no owner is assigned
          type: string
        past_due_balance:
          description: The part of this company's balance that is past due, as a decimal string (e.g. "150.50"); "0" when nothing is past due, never negative and never higher than `outstanding_balance`. Computed as the unpaid amount of invoices on the company's delivered or completed orders whose due date is before today in your account's timezone, reduced by the company's remaining unused credit, then capped at `outstanding_balance` (so "0" when `outstanding_balance` is 0 or negative). Invoices on orders not yet delivered don't count, and an overpaid invoice counts as 0 here; it lowers this balance only through the cap. It also changes on its own when an invoice passes its due date, within an hour after midnight in your account's timezone. Changes to it do not update `updated_datetime`; subscribe to `COMPANY_RELATIONSHIP` webhooks to follow it.
          type: string
        phone_number:
          description: The phone number for this company, or null when not set
          type: string
        purchase_order_email:
          description: The email address where purchase order slips are delivered, or null when not set
          type: string
        qb_customer_id:
          description: The QuickBooks Online customer ID mapped to this company, or null when it is not mapped to a QuickBooks Online customer
          type: string
        qb_vendor_id:
          description: The QuickBooks Online vendor ID mapped to this company, or null when it is not mapped to a QuickBooks Online vendor
          type: string
        relationship_type:
          $ref: '#/components/schemas/RelationshipType'
        sales_order_email:
          description: The email address where sales order slips are delivered, or null when not set
          type: string
        updated_datetime:
          description: ISO 8601 datetime this company was last updated at. This is the later of when the trading relationship or the underlying company record was last changed, so an edit to either updates it.
          type: string
        website:
          description: The website for this company, or null when not set
          type: string
      required:
      - past_due_balance
      - outstanding_balance
      - custom_data
      - updated_datetime
      - name
      - id
      title: Company
      type: object
    Location:
      description: 'A place where inventory is held. This is flexible: it can be a whole site such as a warehouse or store, or a more specific spot like a room or area within one. Has an address and optionally a license.'
      properties:
        address:
          description: The full address as a single formatted line, built from the street, apt, city, state, zip, and country fields
          example: 1234 Warehouse Street, Oakland, CA
          type: string
        apt:
          description: The apartment/suite/unit of this location, or null when none was entered
          type: string
        city:
          description: The city of this location
          type: string
        company_id:
          description: ID of the [company](#model-company) that owns this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        country:
          description: The country of this location
          type: string
        deleted_at:
          description: ISO 8601 datetime this location was deleted at, or null when it is not deleted
          type: string
        id:
          description: ID for this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        inserted_datetime:
          description: ISO 8601 datetime this location was created at
          type: string
        latitude:
          description: The latitude of this location, or null when it has not been geocoded
          type: number
        license:
          $ref: '#/components/schemas/License'
        license_id:
          description: ID of the [license](#model-license) this location is associated with, or null when the location has no license
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        longitude:
          description: The longitude of this location, or null when it has not been geocoded
          type: number
        metrc_id:
          description: The location's ID in Metrc. A Metrc identifier, not a Distru ID. Null when the location is not linked to Metrc.
          type: integer
        name:
          description: Human readable name for this location
          example: Warehouse 1
          type: string
        state:
          description: The state of this location
          type: string
        street_address:
          description: The street address of this location
          type: string
        updated_datetime:
          description: ISO 8601 datetime this location was last updated at
          type: string
        zip:
          description: The postal code of this location
          type: string
      required:
      - country
      - zip
      - state
      - city
      - street_address
      - updated_datetime
      - inserted_datetime
      - name
      - address
      - id
      title: Location
      type: object
    LocationCompact:
