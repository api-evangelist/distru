    CostEntryInput:
      description: A single cost to apply to a record
      properties:
        cost_per_unit:
          description: Per-unit amount as a decimal (e.g. "10.00"). When omitted, the cost type's own cost per unit is used. Must be omitted for cost types with a locked cost per unit (those that don't allow inline editing) — sending it for such a type is rejected. It is only required when an inline-editable cost type has no cost per unit of its own
          type: number
        cost_type_id:
          description: Required. The cost type to apply, given as its ID from GET /public/v1/cost-types. Must exist and be accessible to the authenticated company
          type: string
        description:
          description: Optional free-form text stored on the cost
          type: string
        quantity:
          description: Required. How many units of the cost type to apply, as a decimal (e.g. "2.5"). Must be greater than 0. The amount added to each record's cost basis is cost_per_unit × quantity
          type: number
