          description: Name of the role (e.g. Admin, Sales)
          type: string
      required:
      - name
      - id
      title: Role
      type: object
    CustomField:
      description: A user-defined field attached to a record, with the value set for this particular record. Which custom fields exist is configured in Distru; use `GET /public/v1/custom-fields` to list the definitions and their IDs.
      properties:
        id:
          description: The ID of this custom field's definition (matches an `id` from `GET /public/v1/custom-fields`). An integer.
          type: integer
        name:
          description: The name of this custom field
          type: string
        value:
          description: This record's value for the custom field, as a string, or null when no value has been set for this record
          type: string
      required:
      - name
      - id
      title: CustomField
      type: object
    QuantityActiveByLocation:
      description: Active on-hand quantity of an entity held at a single location.
      properties:
        location:
          $ref: '#/components/schemas/LocationCompact'
        quantity:
          description: Active on-hand quantity at this location, as a decimal string (e.g. "100"). Always positive.
          type: string
      required:
      - quantity
      - location
      title: QuantityActiveByLocation
      type: object
    PackageFull:
      description: A specific, compliance-tracked quantity of a product with all its details — its tag, product, dates, quantity, and testing state. This is the physical unit of inventory for package-tracked products.
      properties:
        batch_number:
          description: A free-text batch number set on the package, separate from any compliance tag. Null when none is set.
          type: string
        bins:
          description: The bins this package is stored in. Only present when bin inventory tracking is enabled for the company.
          items:
            $ref: '#/components/schemas/BinCompact'
          type: array
        biotrack_id:
          description: The BioTrack inventory ID for this package; null for non-BioTrack packages
          type: integer
        biotrack_inventory_type_id:
          description: The BioTrack inventory type ID for this package. Null for non-BioTrack packages.
          type: integer
        biotrack_net_quantity_per_unit:
          description: The BioTrack net quantity per unit for this package, as a decimal string. Null for non-BioTrack packages, and may be null for some BioTrack inventory types.
          type: string
        biotrack_room_id:
          description: The BioTrack room ID where this package is stored. Null for non-BioTrack packages.
          type: integer
        biotrack_status:
          description: The package's BioTrack inventory status. Null for non-BioTrack packages.
          enum:
          - ACTIVE
          - DESTROYED
          - SCHEDULED_FOR_DESTRUCTION
          - SCHEDULED_FOR_TRANSPORT
          - IN_TRANSPORT_BUT_NOT_RECEIVED
          - RECEIVED
          type: string
        biotrack_usable_weight:
          description: The BioTrack usable weight for this package. For weighable (weight/volume) packages this is the package's weight at creation; for count-based packages it is the per-unit amount of cannabis. May be null for some inventory types (and is null for non-BioTrack packages).
          type: string
        compliance_label:
          description: The unique tag assigned by the state compliance system (e.g. the Metrc package tag). Always present for Metrc-tracked packages; may be null for BioTrack packages, and null when the package is not compliance-tracked.
          type: string
        compliance_product_name:
          description: The product/item name as reported by the compliance system (Metrc or BioTrack), or null when none is reported
          type: string
        compliance_strain_name:
          description: The strain name as reported by the compliance system (Metrc or BioTrack), or null when none is reported
          type: string
        compliance_transferred_datetime:
          description: The datetime this package was transferred out in the compliance system (ISO 8601); null if not transferred out
          type: string
        compliance_type:
          description: 'The state compliance system tracking this package: METRC or BIOTRACK, or null when the package is not compliance-tracked. This determines which system-specific fields are populated: METRC packages carry the `metrc_*` fields (BioTrack ones null), BIOTRACK packages carry the `biotrack_*` fields (Metrc ones null).'
          type: string
        cost_per_unit_actual:
          description: Actual cost per unit — `total_cost_actual` divided by the package quantity. Returned only by the list endpoint when the request passes `include_costs=true`; the field is absent otherwise. Null when no cost has been traced for this package.
          type: string
        cost_per_unit_default:
          description: Default (standard) cost per unit — `total_cost_default` divided by the package quantity. Returned only by the list endpoint when the request passes `include_costs=true`; the field is absent otherwise. Null when no cost has been traced for this package.
          type: string
        creator:
          $ref: '#/components/schemas/User'
        custom_data:
          description: The custom data for this package
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        description:
          description: Free-text description of this package, or null when none was entered
          type: string
        distru_status:
          description: 'The package''s inventory lifecycle status. One of:• ACTIVE: on hand and available.• ASSEMBLING: allocated to a pending assembly.• SELLING: reserved on an open sales order.• SOLD: consumed by a completed sale.• RETURNING: on an in-progress return.• TRANSFERRED: sent out on a compliance transfer.• ONHOLD: placed on hold in the compliance system.• FINISHED: finished in the compliance system.• DISCONTINUED: discontinued.• DESTROYED: destroyed.'
          enum:
          - ACTIVE
          - ASSEMBLING
          - DESTROYED
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - RETURNING
          - SELLING
          - SOLD
          - TRANSFERRED
          type: string
        expiration_datetime:
          description: ISO 8601 datetime this package expires, or null when none is set
          type: string
        finished_datetime:
          description: The datetime this package was finished in the compliance system (ISO 8601); null if not finished
          type: string
        harvest_date:
          description: The harvest date for this package as an ISO 8601 date (e.g. "2026-08-20"), or null when none is set
          type: string
        id:
          description: ID for this package in Distru
          type: string
        inactivated_datetime:
          description: The datetime this package was inactivated (ISO 8601); null while active
          type: string
        inserted_datetime:
          description: The datetime this package was created at (ISO 8601)
          type: string
        is_production_batch:
          description: True when this package is a new production lot (rather than added to existing inventory). Only applies to Metrc-tracked packages; always false otherwise.
          type: boolean
        is_test_sample:
          description: True when this package is a test sample.
          type: boolean
        is_trade_sample:
          description: True when this package is a Metrc trade sample. Always false for non-Metrc packages.
          type: boolean
        lab_testing_state:
          description: The package's compliance lab-testing state (e.g. Metrc's TestPassed / NotSubmitted; BioTrack uses analogous values). Defaults to NotSubmitted, so this is always present.
          type: string
        license:
          $ref: '#/components/schemas/License'
        license_id:
          description: The ID of the [license](#model-license) this package is held under
          type: string
        location:
          $ref: '#/components/schemas/LocationCompact'
        location_id:
          description: The ID of the [location](#model-location) where this package is physically stored
          type: string
        metrc_archived_date:
          description: The date this package was archived in Metrc — i.e. the moment it was discontinued in Metrc (ISO 8601 date)
          type: string
        metrc_finished_date:
          description: The date this package was finished in Metrc (ISO 8601 date)
          type: string
        metrc_id:
          description: The Metrc package ID for this package; null for non-Metrc packages
          type: integer
        metrc_production_batch_number:
          description: The Metrc production batch number, set only when this package is a production batch (see `is_production_batch`); otherwise null.
          type: string
        metrc_received_datetime:
          description: The most recent ISO 8601 datetime this package was received via a Metrc transfer, or null when it was never received via a transfer
          type: string
        metrc_received_from_manifest_number:
          description: The Metrc manifest number the package was most recently received from, or null when it was not received via a transfer
          type: string
        metrc_source_harvest_names:
          description: The Metrc source harvest names for this package. Null when the package is not Metrc-tracked or has no source harvest.
          type: string
        metrc_status:
          description: The package's Metrc inventory status. Null for BioTrack-synced packages.
          enum:
          - ACTIVE
          - INACTIVE
          - ONHOLD
          type: string
        metrc_transfer_id:
          description: The Metrc transfer ID this package is currently on; null if not in transit
          type: integer
        metrc_unit_name:
          description: The Metrc unit of measure name for this package (e.g. "Grams"). Null when the package is not Metrc-tracked.
          type: string
        owner:
          $ref: '#/components/schemas/User'
        packaged_date:
          description: The compliance packaged date as an ISO 8601 date (e.g. "2026-08-20"), or null when none is set
          type: string
        primary_test_result:
          $ref: '#/components/schemas/PrimaryTestResult'
        product:
          $ref: '#/components/schemas/Product'
        product_id:
          description: The ID of the [product](#model-product) this package holds
          type: string
        product_unit_quantity:
          description: This package's quantity converted into its product's unit type (see `product_unit_type`), as a decimal string rounded to 9 places (e.g. "100"). Use this when you need the amount in product units rather than the package's own `unit_type`.
          type: string
        product_unit_type:
          $ref: '#/components/schemas/UnitType'
        quantity:
          description: The total on-hand quantity of this package, in the package's `unit_type`, as a decimal string (e.g. "100"). Always equals `quantity_active` + `quantity_assembling`. Never negative.
          type: string
        quantity_active:
          description: The freely usable portion of `quantity` — what can be used as an assembly input, moved to another location, added to a sales order, or adjusted down. Equals `quantity` minus `quantity_assembling`, in the package's `unit_type`, as a decimal string. Never negative.
          type: string
        quantity_assembling:
          description: The portion of `quantity` currently held for a pending assembly, in the package's `unit_type`, as a decimal string. "0" when none is allocated. Never negative.
          type: string
        total_cost_actual:
          description: Total actual cost of this package. Distru traces the inputs and components that produced the package and sums the real costs incurred along that chain — for example the price paid when a component was purchased, assembly costs, and costs added by stock adjustments, among others. Returned only by the list endpoint when the request passes `include_costs=true`; the field is absent otherwise. Null when no cost has been traced for this package.
          type: string
        total_cost_default:
          description: Total default (standard) cost of this package. Traced the same way as `total_cost_actual`, but each input/component is valued at its product's configured unit cost (the product's `unit_cost`) instead of its real cost. Returned only by the list endpoint when the request passes `include_costs=true`; the field is absent otherwise. Null when no cost has been traced for this package.
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - custom_data
      - inserted_datetime
      - is_production_batch
      - is_test_sample
      - quantity_active
      - quantity_assembling
      - quantity
      - product_unit_quantity
      - distru_status
      - location_id
      - license_id
      - lab_testing_state
      - is_trade_sample
      - product_id
      - product
      - id
      title: PackageFull
      type: object
    Package:
      description: A specific, compliance-tracked quantity of a product identified by a unique tag (e.g. a Metrc package). This is the physical unit of inventory for package-tracked products. This is the compact reference; see PackageFull for all fields.
      properties:
        batch_number:
          description: A free-text batch number set on the package, separate from any compliance tag. Null when none is set.
          type: string
        compliance_label:
          description: The unique tag assigned by the state compliance system (e.g. the Metrc package tag). Always present for Metrc-tracked packages; may be null for BioTrack packages, and null when the package is not compliance-tracked.
          type: string
        distru_status:
          description: 'The package''s inventory lifecycle status. One of:• ACTIVE: on hand and available.• ASSEMBLING: allocated to a pending assembly.• SELLING: reserved on an open sales order.• SOLD: consumed by a completed sale.• RETURNING: on an in-progress return.• TRANSFERRED: sent out on a compliance transfer.• ONHOLD: placed on hold in the compliance system.• FINISHED: finished in the compliance system.• DISCONTINUED: discontinued.• DESTROYED: destroyed.'
          enum:
          - ACTIVE
          - ASSEMBLING
          - DESTROYED
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - RETURNING
          - SELLING
          - SOLD
          - TRANSFERRED
          type: string
        id:
          description: ID for this package in Distru
          type: string
        license_id:
          description: The ID of the [license](#model-license) this package is held under
          type: string
        location_id:
          description: The ID of the [location](#model-location) where this package is physically stored
          type: string
        metrc_id:
          description: The Metrc package ID for this package; null for non-Metrc packages
          type: integer
        quantity:
          description: The total on-hand quantity of this package, in the package's `unit_type`, as a decimal string (e.g. "100"). Always equals `quantity_active` + `quantity_assembling`. Never negative.
          type: string
        quantity_active:
          description: The freely usable portion of `quantity` — what can be used as an assembly input, moved to another location, added to a sales order, or adjusted down. Equals `quantity` minus `quantity_assembling`, in the package's `unit_type`, as a decimal string. Never negative.
          type: string
      required:
      - distru_status
      - quantity_active
      - quantity
      - location_id
      - license_id
      - id
      title: Package
      type: object
    PrimaryTestResult:
      description: A compact view of the primary [test result](#model-testresult) nested on a package or batch — just its headline potency figures. Fetch the full result from the test results endpoint for the complete analyte breakdown.
      properties:
