          type: boolean
        deleted_at:
          description: ISO 8601 datetime this user was deleted at, or null when the user is not deleted
          type: string
        email:
          description: The email address of this user
          type: string
        full_name:
          description: The full name of this user, or null when not set
          type: string
        id:
          description: ID for this user
          type: string
        inserted_datetime:
          description: ISO 8601 datetime this user was created at
          type: string
        role:
          $ref: '#/components/schemas/Role'
        updated_datetime:
          description: ISO 8601 datetime this user was last updated at. It also moves on changes not shown here, such as the user signing in.
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - email
      - id
      title: User
      type: object
    AddProductCostsRequest:
      properties:
        costs:
          description: Required. Non-empty list of costs; each entry is applied to every listed product
          items:
            $ref: '#/components/schemas/CostEntryInput'
          type: array
        distribute_by_quantity:
          description: When true, split each cost across the listed products in proportion to each product's active quantity (all products must share the same unit type category). Defaults to false when omitted, applying the full cost to every product
          type: boolean
        location_ids:
          description: Optional list of location IDs scoping which locations' stock the cost applies to. Omit to apply across all locations; an explicit empty list is rejected
          items:
            type: string
          type: array
        product_ids:
          description: Required. Non-empty list of product IDs; every one must exist, be accessible to the authenticated company, and be product-tracked. Each cost is applied to all listed products
          items:
            type: string
          type: array
      required:
      - costs
      - product_ids
      title: Add Product Costs Request
      type: object
    ProductGroupCompact:
      description: A named grouping of products, defined per company (e.g. a brand line or product family).
      properties:
        id:
          description: ID for this product group
          type: string
        name:
          description: The name of this product group
          type: string
      required:
      - name
      - id
      title: ProductGroupCompact
      type: object
    Role:
      description: A permission role that determines what a [user](#model-user) can do in Distru.
