          description: Human-readable label for this line (e.g. "Delivery Fee").
          type: string
        percent:
          description: The rate of this line when `unit_type` is PERCENT, as a decimal string in the range -100 to 100 (discounts are negative, e.g. "-10"). Null when `unit_type` is PRICE.
          type: string
        price:
          description: The flat money amount of this line, as a 2-decimal string (e.g. "25.00"). Always present. Negative for a DISCOUNT.
          type: string
        tax:
          description: A tax configured in Distru Settings
          properties:
            id:
              description: ID for this Tax
              type: string
            name:
              description: The name of this tax
              type: string
          title: Tax
          type: object
        type:
          description: 'Whether this line adds to or subtracts from the total (SCREAMING_CASE).• CHARGE: adds to the total (e.g. a delivery fee). Tax lines are also returned as CHARGE, with the `tax` object populated.• DISCOUNT: subtracts from the total.'
          enum:
          - DISCOUNT
          - CHARGE
          type: string
        unit_type:
          description: 'How this line''s amount is expressed (SCREAMING_CASE).• PRICE: a flat money amount; `percent` is null.• PERCENT: a percentage; the rate is carried in `percent`.'
          enum:
          - PERCENT
          - PRICE
          type: string
      required:
