    Charge:
      description: An order-level adjustment applied on top of the line items — a charge, a discount, or a tax. It shifts the order/invoice total but is not itself a product line. Whether it adds or subtracts is set by `type`; whether the amount is a flat sum or a percentage is set by `unit_type`.
      properties:
