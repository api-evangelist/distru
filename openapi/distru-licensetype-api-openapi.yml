tags:
- name: LicenseType
paths:
  /public/v1/license-types:
    get:
      description: 'Returns every `license_type` value that is valid for your company''s US state, sorted alphabetically. Use it to discover the exact strings accepted by the `license_type` field when upserting a license on one of your companies; any other value is rejected with a 400. The set is fixed per state — it changes only when Distru adds support for new state license types — so it is safe to cache for the duration of a session.


        The full listing per state is reproduced below. States not listed use the values under **All other states**.


