      required:
      - errors
      title: ErrorResponse
      type: object
    MetrcTransfers:
      description: 'A collection of Metrc transfers.

        Note: This endpoint returns eventually consistent data, with changes taking up to 1 second to propagate in responses.

        '
      properties:
        data:
          description: Metrc Transfers
          items:
            $ref: '#/components/schemas/MetrcTransfer'
          type: array
        next_page:
          description: URL for the next page of results; null when there is no next page
          type: string
      title: Metrc Transfers
      type: object
    MetrcItemStrain:
      description: The Metrc strain an item is defined for.
      properties:
        id:
          description: The strain's identifier in Metrc — Metrc's own integer id, the same `id` returned by the Metrc strains endpoint.
          type: integer
        name:
          description: The strain name as reported by Metrc
          type: string
      required:
      - name
      - id
      title: Metrc Item Strain
      type: object
    MetrcTagResponse:
      description: A single Metrc tag
      properties:
        data:
          $ref: '#/components/schemas/MetrcTag'
      title: Metrc Tag Response
      type: object
    MetrcPackageLocation:
      description: The Metrc location holding a package.
      properties:
        id:
          description: The location's identifier in Metrc — Metrc's own integer id, the same `id` returned by [GET /public/v1/metrc/locations](#get-metrc-locations). Null when Metrc reports only a name.
          type: integer
        name:
          description: The location name as reported by Metrc, or null when Metrc reports none
