          description: The batch number of the package's batch, or null when it has none
          type: string
        compliance_label:
          description: The compliance tag on the package (its Metrc label), or null when not compliance-tracked
          type: string
        distru_status:
          description: The package's status in Distru (e.g. `ACTIVE`, `SELLING`, `SOLD`, `FINISHED`) — the same values as the packages endpoint's `distru_statuses` filter
          type: string
        id:
          description: The package ID, usable with the packages endpoints
          type: string
        license_id:
          description: The ID of the license the package belongs to, or null when it has none
          type: string
        location_id:
          description: The ID of the location holding the package, or null when it has none
          type: string
        metrc_id:
          description: The Metrc package id this Distru package mirrors — Metrc's own integer id. Null when not Metrc-tracked.
          type: integer
        quantity:
          description: The package's total quantity in Distru
          type: string
        quantity_active:
          description: The portion of `quantity` not reserved by sales orders or assemblies
