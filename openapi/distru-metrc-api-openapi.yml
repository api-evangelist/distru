    MetrcTransfer:
      description: A Metrc transfer synced from Metrc, scoped to one of your licenses, plus the Distru data linked to it (the imported order or purchase) and its `deliveries` tree with their packages.
      properties:
        deliveries:
          description: The transfer's deliveries with their packages, in manifest order
          items:
            $ref: '#/components/schemas/MetrcTransferDelivery'
          type: array
        direction:
          description: 'The transfer''s direction relative to the owning license: `INCOMING` (shipped to it) or `OUTGOING` (shipped from it). The `direction` filter accepts the same values.'
          enum:
          - INCOMING
          - OUTGOING
          type: string
        fetched_datetime:
          description: The datetime Distru last fetched this transfer from Metrc
          type: string
        id:
          description: The transfer's identifier in Metrc — Metrc's own integer id, not a Distru ID. An internal transfer between two of your licenses appears as two rows sharing this id, one per direction.
          type: integer
        import_status:
          description: '`IMPORTED` when the transfer was imported into Distru as a sales order (outgoing), a purchase (incoming), or a stock transfer; `IGNORED` when it wasn''t and is marked ignore-for-import; `UNIMPORTED` otherwise. The `import_status` filter accepts the same values.'
          enum:
          - IGNORED
          - IMPORTED
          - UNIMPORTED
          type: string
        importable_details:
          description: A human-readable explanation of why the transfer is not importable, or null when it is importable or the reason is evident from its package states
          type: string
        inserted_datetime:
          description: ISO 8601 datetime the transfer was created in Metrc
          type: string
        is_importable:
          description: True when the transfer's package states allow importing it into Distru — at least one package shipped or accepted for an outgoing transfer, at least one accepted for an incoming one. The `is_importable` filter additionally excludes already-imported and ignored transfers.
          type: boolean
