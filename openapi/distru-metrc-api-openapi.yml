openapi: 3.2.0
info:
  license:
    name: Proprietary
    url: https://www.distru.com/legal/terms-of-service
  title: Distru Metrc API
  version: '1.0'
servers:
- url: https://app.distru.com
security:
- Bearer: []
tags:
- name: Metrc
paths:
  /public/v1/metrc/items:
    get:
      description: 'Get the Metrc items — the item definitions Distru caches from Metrc — across your licenses, filtered by various attributes. Results are ordered by Metrc''s item id ascending and scoped to the company that owns the API key.


        Each row mirrors an item as it exists in Metrc (name, product category, strain, unit of measure, quantity type), plus Distru''s `unit_type` resolved by matching the item''s Metrc unit of measure to one of your company''s unit types by name (null when no unit type matches that name), and the owning `license`. Items deleted in Metrc are included by default — use `is_deleted` to return only live or only deleted items.


        This is a read-only cache: it does not create, edit, or delete items in Metrc. Data is eventually consistent — changes synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.list_items
      parameters:
      - description: Filter to items belonging to this license, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). Omit to return items across all of the company's licenses; a license ID that doesn't belong to your company simply returns no items.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: Filter to items belonging to the Metrc license with this license number (exact match, not a substring). A convenience alternative to `license_id`; combining the two is a 400. Unlike `license_id`, an unknown value is rejected — if your company has no Metrc license with this number the request fails with a 400.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      - description: Filter to items whose Metrc name contains this value (case-insensitive substring match against the item's `name`).
        in: query
        name: search
        required: false
        example: blue dream
        schema:
          type: string
      - description: 'Filter by the item''s quantity category, matched against its Metrc quantity type: `COUNT` (count-based), `VOLUME` (volume-based), or `WEIGHT` (weight-based). Omit to return all categories.'
        in: query
        name: unit_type_category
        required: false
        example: WEIGHT
        schema:
          type: string
          enum:
          - COUNT
          - VOLUME
          - WEIGHT
      - description: 'Filter to items whose Metrc product category name exactly matches one of the given values — an item matches if its `category_name` equals any listed value (OR semantics). Case-sensitive: values must match the Metrc category name verbatim. An empty list is ignored (returns items unfiltered by this parameter).'
        in: query
        name: category_names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter by whether the item is deleted in Metrc. `true` returns only deleted items; `false` returns only live items. Omit to return both.
        in: query
        name: is_deleted
        required: false
        schema:
          type: boolean
      - description: Filter to items with these Metrc item identifiers — Metrc's own integer IDs (the `id` in the response), not Distru IDs. Matches an item if its Metrc ID equals any of the listed values (OR semantics). An empty list is ignored (returns items unfiltered by this parameter).
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Filter by when Distru last fetched the item from Metrc (the `fetched_datetime` in the response). Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `,2022-07-10T00:00:00Z` returns items last fetched on or before that time.
        in: query
        name: fetched_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of Metrc items
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcItems'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc items
      tags:
      - Metrc
  /public/v1/metrc/lab-test-batches:
    get:
      description: 'Get the Metrc lab test batches that can be assigned to a test sample package created under the given license, grouped by Metrc item category. Lab test batches are defined by the state in Metrc and vary per license and item category; Distru caches them from Metrc, so this is a read-only view of that cache.


        `data` is an object with one key per Metrc item category defined for the license (the `category_name` values returned by GET /public/v1/metrc/items), each holding the batches assignable to a test sample of that category. A batch not restricted to specific categories appears under every category. A category with no assignable batches maps to an empty list.


        Use this before calling POST /public/v1/assemblies/create_test_sample: the sample''s `lab_test_batches` values must come from the `name`s listed under the sample item''s category, and every batch listed there with `required: true` must be included or the test sample is rejected.


        The response is complete (not paginated). `data` is an empty object when the license''s Metrc facility type does not use package sample lab test batches — in that case `lab_test_batches` must be omitted when creating a test sample.


        Data is eventually consistent — changes synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.list_lab_test_batches
      parameters:
      - description: The license whose lab test batches to return, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). A license ID that doesn't belong to your company simply returns an empty object. Exactly one of `license_id` or `license_number` must be given.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: 'The license whose lab test batches to return, given as its license number (exact match, not a substring). A convenience alternative to `license_id` — exactly one of the two must be given; combining them is a 400. Unlike `license_id`, an unknown value is rejected: if your company has no Metrc license with this number the request fails with a 400.'
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      responses:
        '200':
          description: Metrc lab test batches grouped by item category
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcLabTestBatches'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc lab test batches
      tags:
      - Metrc
  /public/v1/metrc/locations:
    get:
      description: 'Get the Metrc locations — the room/location definitions Distru caches from Metrc — across your licenses, filtered by various attributes. Results are ordered by Metrc''s location id ascending and scoped to the company that owns the API key.


        Each row mirrors a location as it exists in Metrc (name, location type, and which entity kinds it may hold), plus the owning `license`. Locations deleted in Metrc are included by default — use `is_deleted` to return only live or only deleted locations.


        This is a read-only cache: it does not create, edit, or delete locations in Metrc. Data is eventually consistent — changes synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.list_locations
      parameters:
      - description: Filter to locations belonging to this license, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). Omit to return locations across all of the company's licenses; a license ID that doesn't belong to your company simply returns no locations.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: Filter to locations belonging to the Metrc license with this license number (exact match, not a substring). A convenience alternative to `license_id`; combining the two is a 400. Unlike `license_id`, an unknown value is rejected — if your company has no Metrc license with this number the request fails with a 400.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      - description: Filter to locations whose Metrc name contains this value (case-insensitive substring match against the location's `name`).
        in: query
        name: search
        required: false
        example: vault
        schema:
          type: string
      - description: Filter by whether the location is deleted in Metrc. `true` returns only deleted locations; `false` returns only live locations. Omit to return both.
        in: query
        name: is_deleted
        required: false
        schema:
          type: boolean
      - description: Filter to locations with these Metrc location identifiers — Metrc's own integer IDs (the `id` in the response), not Distru IDs. Matches a location if its Metrc ID equals any of the listed values (OR semantics). An empty list is ignored (returns locations unfiltered by this parameter). At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Filter by when Distru last fetched the location from Metrc (the `fetched_datetime` in the response). Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `,2022-07-10T00:00:00Z` returns locations last fetched on or before that time.
        in: query
        name: fetched_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of Metrc locations
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcLocations'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc locations
      tags:
      - Metrc
  /public/v1/metrc/packages:
    get:
      description: 'Get the Metrc packages Distru caches from Metrc across your licenses, filtered by various attributes. Results are ordered by Metrc''s package id ascending and scoped to the company that owns the API key. Only the current version of each package is returned.


        Each row mirrors a package as it exists in Metrc — label, quantity, item, location, testing and remediation state — plus what Distru knows around it: a derived `status` that reflects the package''s real state (Metrc''s raw active/inactive buckets don''t), the company `unit_type` matching the package''s Metrc unit of measure, the full cached Metrc `item`, and `package`, the Distru package created when this Metrc package was imported (null when it hasn''t been imported). Use `is_importable=true` to list exactly the packages you could import or receive into Distru.


        This is a read-only cache: it does not create, move, or adjust packages in Metrc. Data is eventually consistent — changes synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.list_packages
      parameters:
      - description: Filter to packages belonging to this license, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). Omit to return packages across all of the company's licenses; a license ID that doesn't belong to your company simply returns no packages.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: Filter to packages belonging to the Metrc license with this license number (exact match, not a substring). A convenience alternative to `license_id`; combining the two is a 400. Unlike `license_id`, an unknown value is rejected — if your company has no Metrc license with this number the request fails with a 400.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      - description: Filter to the single package whose full 24-character Metrc tag label equals this value exactly. Case-sensitive and matched verbatim; a partial or lowercase value returns nothing. Use `search` for substring matching.
        in: query
        name: label
        required: false
        example: 1A4FF0100000022000004999
        schema:
          type: string
      - description: Filter to packages whose Metrc tag label contains this value (case-insensitive substring match). Must be at least 4 characters; a shorter value is a 400. A 24-character value is matched as an exact full label.
        in: query
        name: search
        required: false
        example: 0004999
        schema:
          type: string
      - description: 'Filter to packages in any of these derived statuses (multiple values are OR-ed; the same values are returned as each package''s `status`):

          • `ACTIVE` — live at the facility

          • `ONHOLD` — on administrative hold in Metrc

          • `TRANSFERRED` — shipped away on a transfer

          • `FINISHED` — zeroed out and finished

          • `DISCONTINUED` — discontinued in Metrc

          Omit to return every status.

          '
        in: query
        name: statuses
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - ACTIVE
            - DISCONTINUED
            - FINISHED
            - ONHOLD
            - TRANSFERRED
            type: string
      - description: 'When `true`, keep only packages that can currently be imported into Distru: positive quantity, active or on hold in Metrc, not yet imported, and not marked ignore-for-import in Distru. `false` and omitted behave the same (no filter).'
        in: query
        name: is_importable
        required: false
        schema:
          type: boolean
      - description: Filter to packages whose Metrc item category name exactly matches one of the given values (OR semantics, case-sensitive — the `item.category_name` values returned by [GET /public/v1/metrc/items](#get-metrc-items)). An empty list is ignored. At most 200 values may be given.
        in: query
        name: category_names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to packages whose Metrc item name exactly matches one of the given values (OR semantics, case-sensitive). An empty list is ignored. At most 200 values may be given.
        in: query
        name: item_names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to packages whose Metrc strain name exactly matches one of the given values (OR semantics, case-sensitive). An empty list is ignored. At most 200 values may be given.
        in: query
        name: strain_names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to packages with these Metrc package identifiers — Metrc's own integer IDs (the `id` in the response), not Distru IDs. Matches a package if its Metrc ID equals any of the listed values (OR semantics). An empty list is ignored. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Filter by when Distru last fetched the package from Metrc (the `fetched_datetime` in the response). Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `,2022-07-10T00:00:00Z` returns packages last fetched on or before that time.
        in: query
        name: fetched_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of Metrc packages
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcPackages'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc packages
      tags:
      - Metrc
  /public/v1/metrc/packages/{label}:
    get:
      description: Get a single Metrc package by its full 24-character Metrc tag label — the `label` value returned in the packages list. Case-sensitive exact match. Read-only and scoped to the company that owns the API key; returns 404 if no current package with that label belongs to your company.
      operationId: DistruPublic.V1.MetrcController.show_package
      parameters:
      - description: The package's full 24-character Metrc tag label, exactly as printed on the tag (case-sensitive). A label that doesn't exist for your company returns 404.
        in: path
        name: label
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A single Metrc package
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcPackageResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get a Metrc package
      tags:
      - Metrc
  /public/v1/metrc/strains:
    get:
      description: 'Get the Metrc strains — the strain definitions Distru caches from Metrc — across your licenses, filtered by various attributes. Results are ordered by Metrc''s strain id ascending and scoped to the company that owns the API key.


        Each row mirrors a strain as it exists in Metrc (name, genetics, testing status, THC/CBD levels, indica/sativa split), plus the owning `license`. Strains deleted in Metrc are included by default — use `is_deleted` to return only live or only deleted strains. Strain names appear on Metrc items (the `strain.name` returned by GET /public/v1/metrc/items) and are required when creating items for strain-bearing product categories.


        This is a read-only cache: it does not create, edit, or delete strains in Metrc. Data is eventually consistent — changes synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.list_strains
      parameters:
      - description: Filter to strains belonging to this license, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). Omit to return strains across all of the company's licenses; a license ID that doesn't belong to your company simply returns no strains.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: Filter to strains belonging to the Metrc license with this license number (exact match, not a substring). A convenience alternative to `license_id`; combining the two is a 400. Unlike `license_id`, an unknown value is rejected — if your company has no Metrc license with this number the request fails with a 400.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      - description: Filter to strains whose Metrc name contains this value (case-insensitive substring match against the strain's `name`).
        in: query
        name: search
        required: false
        example: blue dream
        schema:
          type: string
      - description: Filter by whether the strain is deleted in Metrc. `true` returns only deleted strains; `false` returns only live strains. Omit to return both.
        in: query
        name: is_deleted
        required: false
        schema:
          type: boolean
      - description: Filter to strains with these Metrc strain identifiers — Metrc's own integer IDs (the `id` in the response), not Distru IDs. Matches a strain if its Metrc ID equals any of the listed values (OR semantics). An empty list is ignored (returns strains unfiltered by this parameter). At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Filter by when Distru last fetched the strain from Metrc (the `fetched_datetime` in the response). Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `,2022-07-10T00:00:00Z` returns strains last fetched on or before that time.
        in: query
        name: fetched_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of Metrc strains
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcStrains'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc strains
      tags:
      - Metrc
  /public/v1/metrc/tags:
    get:
      description: 'Get the Metrc tags — the unique, state-issued compliance identifiers (RFID labels) provisioned to your licenses — filtered by various attributes. Results are ordered oldest-first (by sync time into Distru) and scoped to the company that owns the API key.


        This is a read-only view of tags already synced into Distru from Metrc; it does not order, provision, or reserve tags. Each tag is either a `PACKAGE` tag (retail/wholesale package labels) or a `PLANT` tag, and reports via `is_assigned` whether it has been attached to a package or plant yet.


        Data is eventually consistent — a tag newly synced from Metrc can take up to ~1 second to appear here.'
      operationId: DistruPublic.V1.MetrcController.index
      parameters:
      - description: Restrict the result to specific tags by ID (the same ID returned as each tag's `id`). Repeat the bracketed key once per ID. Unknown IDs simply match nothing; an empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter by tag kind. `PACKAGE` covers retail/wholesale package labels; `PLANT` covers plant tags. Omit to return both kinds.
        in: query
        name: kind
        required: false
        example: PACKAGE
        schema:
          type: string
          enum:
          - PACKAGE
          - PLANT
      - description: Filter to tags provisioned to this license, given as a Distru license resource ID (as returned by the licenses endpoint — not a Metrc or state license number). Omit to return tags across all of the company's licenses; a license ID that doesn't belong to your company simply returns no tags.
        in: query
        name: license_id
        required: false
        example: b1f4c2a0-9c3e-4d2b-8f1a-2e5c6d7a8b9c
        schema:
          type: string
      - description: Filter to tags provisioned to the Metrc license with this license number (exact match, not a substring). A convenience alternative to `license_id`; combining the two is a 400. Unlike `license_id`, an unknown value is rejected — if your company has no Metrc license with this number the request fails with a 400.
        in: query
        name: license_number
        required: false
        example: ?license_number=C11-0000001-LIC
        schema:
          type: string
      - description: Filter by whether the tag is currently attached to a package or plant. `true` returns only assigned tags; `false` returns only unassigned (still-available) tags. Omit to return both.
        in: query
        name: is_assigned
        required: false
        schema:
          type: boolean
      - description: Filter to the single tag whose full 24-character label equals this value exactly. Labels are uppercase hex (`A-F`, `0-9`). Unlike `search`, this value is matched verbatim and is not uppercased or stripped, so pass the exact uppercase label; a lowercase or partial value returns nothing. Use `search` instead for substring or fuzzy matching.
        in: query
        name: tag
        required: false
        example: 1A4FF0100000022000004999
        schema:
          type: string
      - description: Filter to tags whose label contains this value (case-insensitive substring match). The value is uppercased and stripped of any character outside `A-F`/`0-9` before matching, so only its hex portion is used; a value that reduces to 24 characters is matched as an exact full label. If nothing remains after stripping, the filter is ignored.
        in: query
        name: search
        required: false
        example: 0004999
        schema:
          type: string
      - description: Filter by when the tag was created in Distru. Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `2022-07-10T00:00:00Z,` returns tags created on or after that time.
        in: query
        name: inserted_datetime
        required: false
        example: 2022-07-10T00:00:00Z,
        schema:
          type: string
      - description: Filter by when the tag was last modified in Distru. Accepts a comma-separated `from,to` range (ISO-8601 UTC); either side may be omitted, e.g. `,2022-07-10T00:00:00Z` returns tags last modified on or before that time.
        in: query
        name: updated_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of Metrc tags
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetrcTags'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's list rate limit (3000 calls, refilling at 5 per minute, one per page) was exceeded. Retry after the period in the Retry-After header. Calls with an `updated_datetime` lower bound within the last 30 days are free and never refused; see [Incremental Sync](#incremental-sync).
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Metrc tags
      tags:
      - Metrc
  /public/v1/metrc/tags/{id}:
    get:
      description: Get a single Metrc tag by its Distru ID — the `id` value returned in the tags list (a Distru resource ID, not the raw tag label). Read-only and scoped to the company that owns the API key; returns 404 if no tag with that ID belongs to your company.
      operationId: DistruPublic.V1.MetrcController.show
      parameters:
      - description: The Distru ID of the tag, as returned in the `id` field of the tags list (not the Metrc tag label).
        in: path
        name: id
