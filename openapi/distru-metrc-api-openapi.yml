                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get a Metrc transfer
      tags:
      - Metrc
components:
  schemas:
    UnitType:
      description: A unit of measure used for quantities and pricing (e.g. Gram, Each, Pound). This is the compact reference carrying just id and name; the full unit type (its measurement category and conversion factor) is available from the unit types endpoint.
      properties:
        id:
          description: ID for this unit type
          type: string
        name:
          description: Human readable name for this unit type
          type: string
      required:
      - name
      - id
      title: Unit Type
      type: object
    MetrcTransferDelivery:
      description: 'One delivery of a Metrc transfer: a recipient facility and the packages shipped to it.'
      properties:
        actual_arrival_datetime:
          description: ISO 8601 datetime the delivery actually arrived, or null while it hasn't arrived
          type: string
        actual_departure_datetime:
          description: ISO 8601 datetime the delivery actually departed, or null while it hasn't departed
          type: string
        id:
          description: The delivery's identifier in Metrc — Metrc's own integer id, not a Distru ID.
          type: integer
        packages:
          description: The packages on this delivery, in manifest order
          items:
            $ref: '#/components/schemas/MetrcTransferPackage'
          type: array
        received_datetime:
          description: ISO 8601 datetime the delivery was received, or null while it hasn't been received
          type: string
        recipient_license_number:
          description: The license number of the facility receiving this delivery
          type: string
        recipient_name:
          description: The name of the facility receiving this delivery
          type: string
      required:
      - packages
      - recipient_name
      - recipient_license_number
      - id
      title: Metrc Transfer Delivery
      type: object
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    MetrcTag:
      description: 'A Metrc tag: a unique compliance identifier provisioned to a license for tracking a package or plant in the state cannabis system.'
      properties:
        assigned_datetime:
          description: ISO 8601 datetime this tag was assigned to a package or plant, or null while it is still unassigned
          type: string
        commissioned_date:
          description: The ISO 8601 date this tag was commissioned in Metrc (e.g. "2026-08-20"), or null when not yet commissioned
          type: string
        id:
          description: Distru's ID for this Metrc tag (not a Metrc identifier)
          type: string
        inserted_datetime:
          description: The datetime this tag was created in Distru (not a Metrc timestamp)
          type: string
        is_assigned:
          description: True once this tag has been assigned to a package or plant, false while still available. Mirrors whether `assigned_datetime` is set.
          type: boolean
        kind:
          description: Whether the tag is for a package or a plant
          enum:
          - PACKAGE
          - PLANT
          type: string
        license_id:
          description: ID of the [license](#model-license) this tag is provisioned to
          type: string
        tag:
          description: The Metrc tag label
          type: string
        updated_datetime:
          description: The datetime this tag was last updated in Distru (not a Metrc timestamp)
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - is_assigned
      - license_id
      - kind
      - tag
      - id
      title: Metrc Tag
      type: object
    MetrcLabTestBatch:
      description: A lab test batch that can be assigned to a test sample package
      properties:
        name:
          description: The lab test batch name as defined in Metrc. Pass this exact value in `lab_test_batches` when creating a test sample.
          type: string
        required:
          description: Whether Metrc requires this batch on every test sample of the item category it is listed under. A test sample missing a required batch is rejected.
          type: boolean
      required:
      - required
      - name
      title: Metrc Lab Test Batch
      type: object
    MetrcStrain:
      description: 'A Metrc strain: a strain definition synced from Metrc, scoped to one of your licenses.'
      properties:
        cbd_level:
          description: The strain's CBD level as reported by Metrc, a decimal fraction rendered as a string (e.g. "0.005" for 0.5%), or null when none is reported
          type: string
        fetched_datetime:
          description: The datetime Distru last fetched this strain from Metrc
          type: string
        genetics:
          description: The strain's genetics as reported by Metrc (e.g. "60% Indica / 40% Sativa")
          type: string
        id:
          description: The strain's identifier in Metrc. A Metrc identifier, not a Distru ID.
          type: integer
        indica_percentage:
          description: The strain's indica share as reported by Metrc, a percentage rendered as a string (e.g. "60" for 60%)
          type: string
        is_deleted:
          description: True when the strain has been deleted in Metrc.
          type: boolean
        is_used:
          description: True when Metrc reports the strain is in use (referenced by plants, plant batches, or items), so it can no longer be deleted in Metrc
          type: boolean
        license:
          $ref: '#/components/schemas/License'
        name:
          description: The strain name as reported by Metrc
          type: string
        sativa_percentage:
          description: The strain's sativa share as reported by Metrc, a percentage rendered as a string (e.g. "40" for 40%)
          type: string
        testing_status:
          description: The strain's testing status as reported by Metrc (e.g. "None", "InHouse", "ThirdParty")
          type: string
        thc_level:
          description: The strain's THC level as reported by Metrc, a decimal fraction rendered as a string (e.g. "0.212" for 21.2%), or null when none is reported
          type: string
      required:
      - fetched_datetime
      - license
      - is_deleted
      - is_used
      - sativa_percentage
      - indica_percentage
      - testing_status
      - genetics
      - name
      - id
      title: Metrc Strain
      type: object
    MetrcTransferPackage:
      description: One package on a Metrc transfer delivery, plus the Distru data linked to it (the imported Distru package and the unit type matching its unit of measure).
      properties:
        id:
          description: The package's identifier in Metrc — Metrc's own integer id, the same `id` returned by [GET /public/v1/metrc/packages](#get-metrc-packages), the same value as the nested `package.metrc_id`, and accepted by the transfers `metrc_package_id` filter.
          type: integer
        is_testing_sample:
          description: True when the package is a lab test sample
          type: boolean
        item_category_name:
          description: The Metrc item category name
          type: string
        item_name:
          description: The name of the Metrc item the package holds
          type: string
        label:
          description: The package's full 24-character Metrc tag label
          type: string
        package:
          $ref: '#/components/schemas/PackageCompact'
        quantity:
          description: 'The package''s quantity, rendered as a decimal string (e.g. "10.5"): the shipped quantity on an outgoing transfer, the received quantity on an incoming one'
          type: string
        status:
          description: 'The package''s state on this delivery: `SHIPPED` (in transit or not yet processed by the recipient), `ACCEPTED`, `REJECTED`, or `RETURNED`.'
          enum:
          - ACCEPTED
          - REJECTED
          - RETURNED
          - SHIPPED
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        wholesale_price:
          description: The package's wholesale price on the manifest, rendered as a decimal string, or null when the transfer carries no wholesale pricing
          type: string
      required:
      - is_testing_sample
      - unit_type
      - quantity
      - status
      - item_category_name
      - item_name
      - label
      - id
      title: Metrc Transfer Package
      type: object
    MetrcLabTestBatches:
      description: 'The complete set of lab test batches for the given license, keyed by Metrc item category name.

        Note: This endpoint returns eventually consistent data, with changes taking up to 1 second to propagate in responses.

        '
      properties:
        data:
          additionalProperties:
            items:
              $ref: '#/components/schemas/MetrcLabTestBatch'
            type: array
          description: An object with one key per Metrc item category defined for the license, each holding the lab test batches assignable to a test sample of that category, sorted by `name`.
          type: object
      title: Metrc Lab Test Batches
      type: object
    MetrcPackageResponse:
      description: A single Metrc package
      properties:
        data:
          $ref: '#/components/schemas/MetrcPackage'
      title: Metrc Package Response
      type: object
    MetrcItem:
      description: 'A Metrc item: an item definition synced from Metrc, scoped to one of your licenses.'
      properties:
        category_name:
          description: The Metrc product category name
          type: string
        category_type:
          description: The Metrc product category type
          type: string
        fetched_datetime:
          description: The datetime Distru last fetched this item from Metrc
          type: string
        id:
          description: The item's identifier in Metrc — Metrc's own integer id, not a Distru ID.
          type: integer
        inserted_datetime:
          description: ISO 8601 datetime this item was created in Metrc
          type: string
        is_deleted:
          description: True when the item has been deleted in Metrc.
          type: boolean
        license:
          $ref: '#/components/schemas/License'
        name:
          description: The item name as reported by Metrc
          type: string
        quantity_type:
          description: How the item's quantity is measured
          enum:
          - COUNT_BASED
          - VOLUME_BASED
          - WEIGHT_BASED
          type: string
        strain:
          $ref: '#/components/schemas/MetrcItemStrain'
        unit_type:
          $ref: '#/components/schemas/UnitType'
        updated_datetime:
          description: ISO 8601 datetime this item was last modified in Metrc
          type: string
      required:
      - fetched_datetime
      - updated_datetime
      - inserted_datetime
      - is_deleted
      - license
      - unit_type
      - quantity_type
      - category_type
      - category_name
      - name
      - id
      title: Metrc Item
      type: object
    CompactOrder:
      description: A compact view of an order as nested inside another entity (an invoice or a payment) in Distru. Use its id to fetch the full order from the orders endpoint.
      properties:
        id:
          description: ID for this order
