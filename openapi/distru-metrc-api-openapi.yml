    MetrcPackage:
      description: A Metrc package synced from Metrc, scoped to one of your licenses, plus the Distru data linked to it (matching unit type, cached item, imported Distru package).
      properties:
        archived_date:
          description: The date the package was discontinued in Metrc (`YYYY-MM-DD`), or null when not discontinued
          type: string
        contains_remediated_product:
          description: True when the package contains remediated product. Null when Metrc reports nothing.
          type: boolean
        expiration_date:
          description: The package's expiration date (`YYYY-MM-DD`), or null when Metrc reports none
          type: string
        fetched_datetime:
          description: The datetime Distru last fetched this package from Metrc
          type: string
        finished_date:
          description: The date the package was finished in Metrc (`YYYY-MM-DD`), or null while unfinished
          type: string
        id:
          description: The package's identifier in Metrc — Metrc's own integer id, not a Distru ID.
          type: integer
        is_finished_good:
          description: True when the package is flagged as a finished good in Metrc. Null when Metrc reports nothing.
          type: boolean
        is_production_batch:
          description: True when the package is a production batch. Null when Metrc reports nothing.
          type: boolean
        is_testing_sample:
          description: True when the package is a lab test sample. Null when Metrc reports nothing.
          type: boolean
        is_trade_sample:
          description: True when the package is a trade sample. Null when Metrc reports nothing.
          type: boolean
        item:
          $ref: '#/components/schemas/MetrcItem'
        lab_testing_state:
          description: The package's lab testing state as reported by Metrc (e.g. "NotSubmitted", "SubmittedForTesting", "TestPassed"), or null when none is reported
          type: string
        lab_testing_state_date:
          description: The date the lab testing state last changed (`YYYY-MM-DD`), or null when Metrc reports none
          type: string
        label:
          description: The package's full 24-character Metrc tag label, or null when Metrc reports none
          type: string
        license:
          $ref: '#/components/schemas/License'
        location:
          $ref: '#/components/schemas/MetrcPackageLocation'
        note:
          description: The free-text note on the package in Metrc, or null when there is none
          type: string
        package:
          $ref: '#/components/schemas/PackageCompact'
        packaged_date:
          description: The date the package was created in Metrc (`YYYY-MM-DD`), or null when Metrc reports none
          type: string
        product_requires_remediation:
          description: True when the product requires remediation. Null when Metrc reports nothing.
          type: boolean
        production_batch_number:
          description: The production batch number, or null when the package has none
          type: string
        quantity:
          description: The package's current quantity as reported by Metrc, rendered as a decimal string (e.g. "12.5"), or null when Metrc reports none
          type: string
        received_datetime:
          description: ISO 8601 datetime the package was received on an incoming transfer, or null when it wasn't received on a transfer
          type: string
        received_from_facility_license_number:
          description: The license number of the facility that shipped this package to you, or null when it wasn't received on a transfer
          type: string
        received_from_facility_name:
          description: The name of the facility that shipped this package to you, or null when it wasn't received on a transfer
          type: string
        received_from_manifest_number:
          description: The manifest number of the incoming transfer that delivered this package, or null when it wasn't received on a transfer
          type: string
        remediation_date:
          description: The date the product was remediated (`YYYY-MM-DD`), or null when it wasn't
          type: string
        source_harvest_names:
          description: The comma-separated Metrc harvest names this package traces back to, or null when it has no source harvests
          type: string
        source_package_labels:
          description: The comma-separated Metrc tag labels of the packages this one was created from, or null when it has no source packages
          type: string
        status:
          description: 'The package''s derived state:

            • `ACTIVE` — live at the facility

            • `ONHOLD` — on administrative hold in Metrc

            • `TRANSFERRED` — shipped away on a transfer

            • `FINISHED` — zeroed out and finished

            • `DISCONTINUED` — discontinued in Metrc

            The `statuses` filter accepts the same values.

            '
          enum:
          - ACTIVE
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - TRANSFERRED
          type: string
        transferred_datetime:
          description: ISO 8601 datetime Distru observed the package leave on an outgoing transfer, or null while it hasn't been transferred away
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        updated_datetime:
          description: ISO 8601 datetime this package was last modified in Metrc, or null when Metrc reports none
          type: string
      required:
      - fetched_datetime
      - status
      - id
      title: Metrc Package
      type: object
