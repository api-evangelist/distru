        updated_datetime:
          description: The datetime this strain was last updated at
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - name
      - id
      title: Strain
      type: object
    ProductSubcategoryCompact:
      description: A finer classification within a product category (e.g. "Pre-Rolls" under Flower).
      properties:
        id:
