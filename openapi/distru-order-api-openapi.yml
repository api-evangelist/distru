          type: string
        name:
          description: Human readable name for this subcategory
          type: string
      required:
      - name
      - id
      title: ProductSubcategoryCompact
      type: object
    BatchCompactWithQuantityActive:
      description: A compact [batch](#model-batch) reference plus its active on-hand quantity at the location it is nested under.
      properties:
        batch_number:
