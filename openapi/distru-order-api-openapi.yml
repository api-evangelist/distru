          type: string
        name:
          description: Original file name of this image, or null when unknown
          type: string
        rank:
          description: Display slot of this image among the product's images, 0 to 3; the lowest rank is the primary image. Null when unranked
          type: integer
        url:
          description: URL to the full-size (original) image file, or null when no file is available
