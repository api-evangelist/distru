    QuantityActiveByLocation:
      description: Active on-hand quantity of an entity held at a single location.
      properties:
        location:
          $ref: '#/components/schemas/LocationCompact'
        quantity:
          description: Active on-hand quantity at this location, as a decimal string (e.g. "100"). Always positive.
          type: string
      required:
      - quantity
      - location
      title: QuantityActiveByLocation
      type: object
    Charge:
      description: An order-level adjustment applied on top of the line items — a charge, a discount, or a tax. It shifts the order/invoice total but is not itself a product line. Whether it adds or subtracts is set by `type`; whether the amount is a flat sum or a percentage is set by `unit_type`.
      properties:
        charge_preset:
          $ref: '#/components/schemas/ChargePresetCompact'
        id:
          description: ID for this charge
          type: string
        inserted_datetime:
          description: The datetime this charge was created at
          type: string
        name:
          description: Human-readable label for this line (e.g. "Delivery Fee").
          type: string
        percent:
          description: The rate of this line when `unit_type` is PERCENT, as a decimal string in the range -100 to 100 (discounts are negative, e.g. "-10"). Null when `unit_type` is PRICE.
          type: string
        price:
          description: The flat money amount of this line, as a 2-decimal string (e.g. "25.00"). Always present. Negative for a DISCOUNT.
          type: string
        tax:
          description: A tax configured in Distru Settings
          properties:
            id:
              description: ID for this Tax
              type: string
            name:
              description: The name of this tax
              type: string
          title: Tax
          type: object
        type:
          description: 'Whether this line adds to or subtracts from the total (SCREAMING_CASE).• CHARGE: adds to the total (e.g. a delivery fee). Tax lines are also returned as CHARGE, with the `tax` object populated.• DISCOUNT: subtracts from the total.'
          enum:
          - DISCOUNT
          - CHARGE
          type: string
        unit_type:
          description: 'How this line''s amount is expressed (SCREAMING_CASE).• PRICE: a flat money amount; `percent` is null.• PERCENT: a percentage; the rate is carried in `percent`.'
          enum:
          - PERCENT
          - PRICE
          type: string
      required:
      - inserted_datetime
      - price
      - name
      - unit_type
      - type
      - id
      title: Charge
      type: object
    Image:
      description: An image as shown in Distru
      properties:
