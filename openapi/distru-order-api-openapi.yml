    Batch:
      description: A lot of a product — a group of inventory that shares traits such as a harvest/production run, expiration date, and lab results. Used for batch-tracked products. This is the compact reference; see BatchFull for all fields.
      properties:
        id:
          description: ID for this batch
          type: string
        name:
          description: Human readable name for this batch
          type: string
      required:
      - name
      - id
      title: Batch
      type: object
    CompactReturn:
      description: A compact representation of a return
      properties:
        company:
          $ref: '#/components/schemas/CompanyCompact'
        id:
          description: ID for this return
          type: string
        return_datetime:
          description: The date of this return, as `YYYY-MM-DD` (e.g. `2022-07-10`)
          type: string
        return_number:
          description: The return number as shown in the Distru UI (e.g. `RET-1001`)
          type: string
        status:
          description: 'The return''s status (SCREAMING_CASE): PROCESSING, SHIPPED, RECEIVED, or COMPLETED.'
          enum:
          - PROCESSING
          - SHIPPED
          - RECEIVED
          - COMPLETED
          type: string
        total:
          description: The total value of this return
          type: number
      required:
      - total
      - id
      title: CompactReturn
      type: object
    Order:
      description: A sale of products to a customer. Holds the line items sold, their quantities and prices, any extra charges/discounts/taxes, delivery and fulfillment details, and links to the resulting invoices and returns.
      properties:
        billing_location:
          $ref: '#/components/schemas/LocationWithLicense'
        biotrack_id:
          description: The BioTrack manifest this order is associated with, or null when the order is not linked to a BioTrack transfer. An order can be linked to only one compliance transfer, so this is null whenever `metrc_transfer_id` is set.
          type: string
        blaze_payment_type:
          description: The payment type reported to Blaze for an order whose buyer company is mapped to a Blaze retailer through the Distru integration. Null for orders not tied to a Blaze-associated company.
          enum:
          - CASH
          - CREDIT
          - DEBIT
          - COD
          - ACH_TRANSFER
          - CHEQUE
          - OTHER
          type: string
        buyer_company:
          $ref: '#/components/schemas/CompanyCompact'
        buyer_note:
          description: A note left by the buyer when the order was placed through a Distru menu, or null for orders not placed through a menu (or placed without a note)
          type: string
        charges:
          description: The additional lines of Charge, Discount, or Tax added to this order
          items:
            $ref: '#/components/schemas/Charge'
          title: Charges
          type: array
        combined_order:
          $ref: '#/components/schemas/CompactOrder'
        company:
          $ref: '#/components/schemas/CompanyCompact'
        creator:
          $ref: '#/components/schemas/User'
        custom_data:
          description: The custom field values set on this order, one entry per defined Order custom field. Always an array (empty when the company has no Order custom fields); set these values via the upsert endpoint's `custom_data` param.
          items:
            $ref: '#/components/schemas/CustomField'
          title: CustomData
          type: array
        delivered_datetime:
          description: The datetime the order was marked Delivered or Completed, or null if it never reached those statuses
          type: string
        delivery_datetime:
          description: The datetime the order was / will be delivered, or null if none is set
          type: string
        due_datetime:
          description: The datetime by which the customer is expected to pay for this order. Always present — every order has a due date (enforced on write).
          type: string
        external_notes:
          description: The "Message to Customer" shown on this order's slips, or null when unset.
          type: string
        id:
          description: ID for this order
          type: string
        inserted_datetime:
          description: The datetime at which the order was created in Distru
          type: string
        internal_notes:
          description: Free-form notes visible only inside Distru, never shown to the customer. Null when unset.
          type: string
        invoices:
          description: The invoices on this order, including voided ones
          items:
            $ref: '#/components/schemas/CompactInvoice'
          title: OrderInvoices
          type: array
        items:
          description: The order items present on this order
          items:
            $ref: '#/components/schemas/SalesOrderItem'
          title: SalesOrderItems
          type: array
        leaflink_id:
          description: LeafLink's own identifier for this order, or null for orders not synced from LeafLink. Set together with `leaflink_order_number`.
          type: string
        leaflink_order_number:
          description: The LeafLink order number for this order, or null for orders not synced from LeafLink. Set together with `leaflink_id` — either both are present or both are null.
          type: string
        location:
          $ref: '#/components/schemas/LocationWithLicense'
        menu:
          $ref: '#/components/schemas/CompactMenu'
        metrc_transfer_id:
          description: Metrc's own integer id for the outgoing transfer this order is associated with, or null when the order is not linked to a Metrc transfer. An order can be linked to only one compliance transfer, so this is null whenever `biotrack_id` is set.
          type: integer
        metrc_transfer_template_error:
          description: The error explaining why this order's Metrc transfer template failed to sync. Only set while `metrc_transfer_template_status` is FAILED, null otherwise.
          type: string
        metrc_transfer_template_id:
          description: The ID of the Metrc transfer template Distru created in Metrc for this order, or null if none has been created
          type: integer
        metrc_transfer_template_status:
          description: 'The sync status of this order''s Metrc transfer template, or null if no template sync has been requested.• PENDING: the template is queued to be created or updated in Metrc.• COMPLETED: the template exists in Metrc and matches this order.• FAILED: the last sync attempt failed — see `metrc_transfer_template_error` for the reason.'
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          type: string
        order_datetime:
          description: The datetime on which the order was placed
          type: string
        order_number:
          description: The order number as shown in the Distru UI. Distru-assigned and unique per company.
          type: string
        owner:
          $ref: '#/components/schemas/User'
        payment_term_name:
          description: The name of the payment term applied to this order (e.g. "Net 30", "COD"), or null if no payment term is set. Used to derive `due_datetime` on create.
          type: string
        returns:
          description: The returns on this order
          items:
            $ref: '#/components/schemas/CompactReturn'
          title: OrderReturns
          type: array
        shipping_location:
          $ref: '#/components/schemas/LocationWithLicense'
        status:
          description: 'Where this order is in its lifecycle, which also governs how it affects inventory.• PENDING: does not affect inventory — assigning packages/batches to line items does not change their `active` quantity, unfulfilled items do not add to the product''s `reserved` quantity, and the order cannot be associated with a compliance transfer.• PROCESSING: affects inventory — assigning a package/batch to a line item moves that quantity out of `active` and into a committed selling state, unfulfilled items add to the product''s `reserved` quantity, and the order may be associated with a compliance transfer.• READY_TO_SHIP: same inventory behavior as PROCESSING, but every line item must be fulfilled.• DELIVERING, DELIVERED, and COMPLETED: every line item must be fulfilled, and the order must be associated with a compliance transfer if it contains any package-tracked items.• CANCELED: the order has been canceled — like PENDING, it does not affect inventory and cannot be associated with a compliance transfer.'
          enum:
          - PENDING
          - PROCESSING
          - READY_TO_SHIP
          - DELIVERING
          - DELIVERED
          - COMPLETED
          - CANCELED
          type: string
        tasks:
          description: 'The tasks linked to this order that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        total:
          description: The order total including all line items, charges, discounts, and taxes, as a decimal string. Recomputed by Distru on every write; defaults to "0" for an order with no items or charges.
          type: string
        updated_datetime:
          description: The datetime at which the order was last updated in Distru
          type: string
      required:
      - custom_data
      - tasks
      - updated_datetime
      - inserted_datetime
      - order_datetime
      - due_datetime
      - total
      - order_number
      - status
      - id
      title: Order
      type: object
  requestBodies:
    DistruPublic.V1.AssemblyController.download_pdfBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              format:
                enum:
                - binary
                - url
                - email
                type: string
                description: 'How the generated PDF is delivered. One of `binary` — the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` — a JSON body with a short-lived signed download URL (see the [PdfResponse](#model-pdfresponse) response); or `email` — emails the PDF to the addresses in `email_addresses` and returns a JSON body listing who it was emailed to. Required, but omitting it defaults to `binary` for backward compatibility.'
              email_addresses:
                items:
                  type: string
                type: array
                description: Recipient email addresses, used only when `format` is `email` (required in that case, ignored otherwise). An entry may hold several comma-separated addresses; spaces, blank entries and repeats are dropped, and `emailed_to` lists the addresses actually emailed. At least one address is required and every address must be valid, otherwise the request is rejected with a 400. At most 200 addresses may be given, counted after that cleanup.
            required:
            - format
      required: true
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: 'API token generated in Distru (Settings → Distru API). Send it on every request as `Authorization: Bearer YOUR_API_TOKEN`.'
