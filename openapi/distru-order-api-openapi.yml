openapi: 3.2.0
info:
  license:
    name: Proprietary
    url: https://www.distru.com/legal/terms-of-service
  title: Distru Order API
  version: '1.0'
servers:
- url: https://app.distru.com
security:
- Bearer: []
tags:
- name: Order
paths:
  /public/v1/orders:
    get:
      description: 'List sales orders, most recent order date first, filtered by the query parameters below. Each entry is the same full order object returned by GET /public/v1/orders/{id}, including its line items, charges, invoices, and returns.


        Results are paginated: the response is a `data` array plus a `next_page` URL. Follow `next_page` to walk subsequent pages; a null `next_page` means the last page was reached. All datetime filters accept an inclusive range and combine with AND (an order must satisfy every filter given).


        Required permission: `orders_permissions_view`. Results are further limited to the orders the authenticated user can see under their team restrictions, so this may return fewer orders than exist on the company.'
      operationId: DistruPublic.V1.OrderController.index
      parameters:
      - description: Restrict the result to specific orders by ID (the same ID returned as each order's `id`). Repeat the bracketed key once per ID. Unknown IDs simply match nothing; an empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter by the delivery datetime (an order's `delivery_datetime`). Inclusive ISO8601 range written as `after,before`; either side may be omitted. `2022-07-10T00:00:00Z,` keeps orders delivered on or after that instant, `,2022-07-10T00:00:00Z` keeps those on or before it, and supplying both bounds keeps orders in between. Orders with no delivery datetime are excluded whenever this filter is present.
        in: query
        name: delivery_datetime
        required: false
        example: 2022-07-10T00:00:00Z,
        schema:
          type: string
      - description: Filter by the due datetime — when the customer is expected to pay (an order's `due_datetime`). Inclusive ISO8601 range `after,before`; either side may be omitted (`,2022-07-10T00:00:00Z` keeps orders due on or before that instant).
        in: query
        name: due_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Filter by when the order was created in Distru (its `inserted_datetime`). Inclusive ISO8601 range `after,before`; either side may be omitted.
        in: query
        name: inserted_datetime
        required: false
        example: 2022-07-10T00:00:00Z,
        schema:
          type: string
      - description: Filter by the order datetime — when the order was placed (its `order_datetime`). Inclusive ISO8601 range `after,before`; either side may be omitted. Results are always sorted by this field, newest first.
        in: query
        name: order_datetime
        required: false
        example: 2022-07-10T00:00:00Z,2022-07-11T00:00:00Z
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      - description: 'Filter by lifecycle status; repeat the key to pass several and orders in ANY of the given statuses are returned. SCREAMING_CASE, one of: PENDING, PROCESSING, READY_TO_SHIP, DELIVERING, DELIVERED, COMPLETED, CANCELED. See the `status` field on the [order](#model-order) for what each value means. At most 200 statuses may be given.'
        in: query
        name: statuses
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - PENDING
            - PROCESSING
            - READY_TO_SHIP
            - DELIVERING
            - DELIVERED
            - COMPLETED
            - CANCELED
            type: string
      - description: Filter by when the order was last modified in Distru (its `updated_datetime`). Inclusive ISO8601 range `after,before`; either side may be omitted. Useful for polling only the orders that changed since your last sync.
        in: query
        name: updated_datetime
        required: false
        example: ',2022-07-10T00:00:00Z'
        schema:
          type: string
      - description: Filter to orders whose buyer (customer) is any of these companies. Pass company relationship IDs — the same id returned as each order's `company.id` and by GET /public/v1/companies. Repeat the bracketed key once per ID. Unknown IDs (including ones that don't belong to your company) simply match nothing; an empty list is treated as no filter. At most 200 IDs.
        in: query
        name: company_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders placed by any of these buyer companies — the DistruCommerce buyer that placed the order (each order's `buyer_company.id`), set only for menu orders placed by the buyer themselves. Distinct from `company_ids`, which is the order's customer/company relationship. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: buyer_company_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders owned by any of these Distru users (each order's `owner.id`). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: owner_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders whose top-level location is any of these Distru locations (each order's `location.id`). This is the order's own location, not the per-line-item fulfillment location. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: location_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders whose billing location is any of these Distru locations (each order's `billing_location.id`). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: billing_location_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders whose shipping location is any of these Distru locations (each order's `shipping_location.id`). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: shipping_location_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders placed through any of these DistruCommerce menus (each order's `menu.id`). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: menu_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders whose order number contains this text, case-insensitively (substring match). For an exact match on one or more full order numbers, use `order_numbers` instead.
        in: query
        name: order_number
        required: false
        example: ?order_number=SO-10
        schema:
          type: string
      - description: Filter to orders whose order number exactly matches any of these values, case-insensitively. Repeat the bracketed key once per value; an empty list is treated as no filter. At most 200 values. Use `order_number` for a substring search instead.
        in: query
        name: order_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders synced from any of these LeafLink orders, matching LeafLink's own order identifier (each order's `leaflink_id`). Exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values.
        in: query
        name: leaflink_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders associated with any of these Metrc transfers, matching Metrc's own integer transfer id (each order's `metrc_transfer_id`). Repeat the bracketed key per value; empty list is no filter. At most 200 values.
        in: query
        name: metrc_transfer_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Filter to orders associated with any of these BioTrack manifests (each order's `biotrack_id`). Exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values.
        in: query
        name: biotrack_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter by when the order was marked Delivered or Completed (an order's `delivered_datetime`). Inclusive ISO8601 range `after,before`; either side may be omitted. Orders that never reached Delivered or Completed have no delivered datetime and are excluded whenever this filter is present.
        in: query
        name: delivered_datetime
        required: false
        example: 2022-07-10T00:00:00Z,
        schema:
          type: string
      - description: Filter to orders whose customer belongs to any of these company relationship groups. Pass company relationship group IDs (the same id returned by GET /public/v1/company-relationship-groups). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs.
        in: query
        name: company_group_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Filter by payment status, derived from the order''s invoices and their payments against the order total (net of returns). Repeat the key to pass several; orders in ANY of the given statuses are returned. SCREAMING_CASE, one of:

          • NOT_PAID — nothing has been paid.

          • PARTIALLY_PAID — some but not the full amount has been paid.

          • FULLY_PAID — paid in full.

          • OVER_PAID — paid more than the order total.

          At most 200 values.'
        in: query
        name: payment_statuses
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - NOT_PAID
            - PARTIALLY_PAID
            - FULLY_PAID
            - OVER_PAID
            type: string
      - description: Filter by the order `total` (the raw order total including line items, charges, discounts, and taxes — the same value returned as each order's `total`). Inclusive range written as `min,max`; either side may be omitted. `100,` keeps orders totaling 100 or more, `,500` keeps those totaling 500 or less, and `100,500` keeps those in between.
        in: query
        name: total
        required: false
        example: 100,500
        schema:
          type: string
      - description: Filter to orders that contain a line item drawn from any of these batches (matching an order item's batch). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: batch_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item drawn from any of these packages (matching an order item's package). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: package_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose package carries any of these compliance labels (the package's Metrc/BioTrack label). Case-sensitive exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: package_compliance_labels
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose package has any of these batch numbers (the batch number stored on the package). Case-sensitive exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: package_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose batch has any of these batch numbers (matching the order item's batch). Case-sensitive exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: batch_batch_numbers
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item of any of these products (matching an order item's product). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product belongs to any of these product categories. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_category_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product belongs to any of these product subcategories. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_subcategory_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product belongs to any of these product groups. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_group_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product has any of these brands. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_brand_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product has any of these vendors (the product's supplier company relationship). Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_vendor_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product has any of these strains. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_strain_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product carries any of these tags. Repeat the bracketed key per ID; unknown IDs match nothing; empty list is no filter. At most 200 IDs. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_tag_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter to orders that contain a line item whose product has any of these SKUs. Case-insensitive exact match. Repeat the bracketed key per value; empty list is no filter. At most 200 values. When combined with the other item and product filters, a single line item must satisfy all of them together (e.g. the same line is both in the given batch and of the given product).
        in: query
        name: product_skus
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Filter by custom field values, as `custom_data[{id}]=value` where `{id}` is a custom field's numeric id. Repeat with different ids to filter on several fields at once; a record must match every one (AND). Matching is case-sensitive exact against the value stored on the record. The id must be a filterable custom field defined on this entity — use `GET /public/v1/custom-fields?parent_object=order` to list the ids, their types, and which are filterable. A non-numeric id, an id not defined on this entity, or an id that isn't filterable returns a 400.
        in: query
        name: custom_data
        required: false
        schema:
          type: object
      responses:
        '200':
          description: A list of orders
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Orders'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's list rate limit (3000 calls, refilling at 5 per minute, one per page) was exceeded. Retry after the period in the Retry-After header. Calls with an `updated_datetime` lower bound within the last 30 days are free and never refused; see [Incremental Sync](#incremental-sync).
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get orders
      tags:
      - Order
    post:
      description: 'Create or update a single sales order. Omit `id` to create a new order (Distru assigns the order number and id); pass an existing order''s `id` to update it. An `id` that doesn''t exist, or belongs to another company, returns a not-found error.


        Updates are sparse at the top level: send only the fields you want to change — every field you omit (including `status`) keeps its current value. The `items` and `charges` collections work differently. Omit the whole `items` (or `charges`) field and its existing rows are left untouched. Send the field and it fully replaces that set: an existing row whose `id` you omit is deleted, an entry whose `id` matches an existing row updates it (omitted fields on that entry are kept from the existing row, so you can patch a single field by sending just its `id` and the change), and an entry whose `id` is new (or omitted — Distru then assigns one) is added. Sending `items` as an empty array removes every line, which an order cannot be left in, so it is rejected. Charges are full-replace on update — see the `charges` field for how existing charges, presets, and deletions are handled; on create, charge presets whose auto-apply tags match the order''s products are added automatically. The whole upsert is atomic: if any part is rejected (a validation error, a disallowed status transition, an unfulfillable line) nothing is changed and the response is a 400 whose `errors` point at the offending field.


        Setting `status` moves the order through its lifecycle and drives inventory. A PENDING or CANCELED order reserves nothing and touches no inventory; moving to PROCESSING commits sellable inventory — assigning a package or batch to a line item moves that quantity into a committed selling state and any unfulfilled line adds to the product''s `reserved` quantity; READY_TO_SHIP, DELIVERING, DELIVERED, and COMPLETED additionally require every line item to be fulfilled. See the `status` field on the order for the full per-status behavior and transition requirements.


        Compliance: associating the order with a state transfer is one-system-only — send `metrc_transfer_id` OR `biotrack_id`, never both. Doing so builds the order from that outgoing Metrc/BioTrack transfer. Any order carrying package-tracked items must be associated with a compliance transfer before it can reach DELIVERING, DELIVERED, or COMPLETED.


        Invoicing: set `upsert_invoice` to create or refresh this order''s invoice, and `email_invoice` to email it. The response returns the saved order with its recomputed `total`, line items (with cost fields), charges, invoices, and returns.


        Required permission: `orders_permissions_create` to create, `orders_permissions_edit` (plus access to the order under team restrictions) to update.'
      operationId: DistruPublic.V1.OrderController.upsert
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                biotrack_id:
                  type: string
                  description: The BioTrack manifest to associate with this order, building the order from that outgoing BioTrack transfer. Mutually exclusive with `metrc_transfer_id` — send at most one; an order can be linked to only one compliance transfer.
                blaze_payment_type:
                  enum:
                  - CASH
                  - CREDIT
                  - DEBIT
                  - COD
                  - ACH_TRANSFER
                  - CHEQUE
                  - OTHER
                  type: string
                  description: The payment type for an order shipping to a Blaze-associated company. Required (and only meaningful) when the order's buyer company is mapped to a Blaze retailer through the Distru integration; leave it off otherwise.
                company_id:
                  type: string
                  description: The buyer of this order, as a company relationship ID (the same id in each order's `company.id` and GET /public/v1/companies). Determines the customer, and drives pricing, default payment term (used to derive `due_datetime`), and `blaze_payment_type` requirements. Optional while the order stays PENDING, PROCESSING, or CANCELED, but required to move it to READY_TO_SHIP, DELIVERING, DELIVERED, or COMPLETED. Once a customer is set, you cannot clear it back to null on a later update.
                delivery_datetime:
                  type: string
                  description: ISO8601 datetime the order was / will be delivered. Optional; null when the order has no delivery datetime set.
                due_datetime:
                  type: string
                  description: 'The datetime by which the customer is expected to pay for this order. Optional: when omitted, it is derived from the customer''s default payment term, then the company default order payment term, then falls back to the order date (COD).'
                external_notes:
                  type: string
                  description: This is a message that will be shown to the customer on order slips. This is the "Message to Customer" field in the Distru order form.
                upsert_invoice:
                  type: boolean
                  description: When true, create an invoice for this order if it doesn't have one yet, or update the existing invoice with the order's latest changes.
                email_invoice:
                  type: boolean
                  description: When true, email the order's invoice. No email is sent unless the order has an invoice (see `upsert_invoice`) and a recipient can be resolved from `email_invoice_addresses` or the buyer company relationship's invoice email.
                email_invoice_addresses:
                  type: string
                  description: Comma-separated list of email addresses to send the invoice to when `email_invoice` is true. Takes precedence over the company relationship's invoice email. Invalid addresses are rejected.
                id:
                  type: string
                  description: ID for this order. Omit it to create a new order — Distru assigns the ID. Provide an existing order's ID to update that order; an ID that doesn't exist returns a not-found error.
                order_datetime:
                  type: string
                  description: ISO8601 datetime the order was placed. Required on create — omitting it there returns a validation error; on update, omit to leave the existing value unchanged. This is the field the list endpoint sorts (newest first) and filters on.
                charges:
                  items:
                    $ref: '#/components/schemas/OrderChargeRequest'
                  type: array
                  description: 'The order''s complete set of charges and discounts — the extra lines (fees, discounts, taxes) added on top of the items. Each entry follows the [OrderChargeRequest](#model-orderchargerequest) shape.


                    Replacement semantics: on update the charges you send become the order''s entire set — any existing charge you don''t include is deleted. Omit the `charges` field entirely to leave the current charges unchanged; send `[]` to remove them all. Each charge is matched to an existing one by `id` — a charge with a new or absent `id` is added, a charge with a known `id` is updated, and on a matched charge any field you omit keeps its current value — so sending just `{"id": "..."}` keeps that charge exactly as it is. You never need to resend a charge''s full payload to preserve it; include its `id` and only the fields you want to change.


                    Manual charges: provide `name`, `type`, `unit_type`, and the amount. For a PERCENT charge the amount is calculated from the order subtotal and any `price` you send is ignored; send `percent` instead.


                    Preset charges: set `charge_preset_id` and leave `name` and `type` out — Distru fills them from the [charge preset](#model-chargepreset). If the preset allows inline edits you may also set `unit_type` and the amount (`price` or `percent`); otherwise send only `charge_preset_id`. Sending a field the preset controls returns a 400.


                    `charge_preset_id` is fixed once a charge exists. Omitting `charge_preset_id` on an update keeps the charge''s current preset, like any other omitted field. But you cannot change it: sending a different `charge_preset_id`, sending null to detach a preset, or adding a `charge_preset_id` to a charge that was manual all return a 400. To switch a charge to a different preset or to a manual charge, drop it (omit its `id`, which deletes it) and add a new charge.


                    Auto-apply: on order create, presets whose auto-apply tags match the order''s products are added automatically (see the preset''s `auto_apply_tags_on_sales_orders` flag); a preset you also send explicitly is applied once. Updates never auto-apply: adding items later does not add new preset charges (existing PERCENT charges still recompute from the new subtotal; fixed-price ones are unchanged). The reverse also holds: an auto-applied charge is never auto-removed — deleting the line items whose product tags added it leaves the charge in place until you drop it yourself (omit its `id` from a `charges` update).'
                items:
                  items:
                    $ref: '#/components/schemas/OrderItemRequest'
                  type: array
                  description: 'The products being sold on this order, one entry per line. Required on create. On update it is optional: omit it to leave the order''s existing lines untouched, or send it to fully replace the line set — an existing line whose `id` you omit is deleted, an entry whose `id` matches an existing line updates it (fields you omit on the entry keep their current value, so an `id`-only entry is a no-op), and an entry with a new or omitted `id` is added. An empty array is rejected because every order must keep at least one item. If the order is matched with a compliance transfer, its package-tracked lines each map one-to-one to a transferred package and cannot be deleted — omitting one is rejected. Each entry follows the [OrderItemRequest](#model-orderitemrequest) shape.'
                internal_notes:
                  type: string
                  description: Free-form notes visible only inside Distru; never shown to the customer. Use `external_notes` for a customer-facing message.
                metrc_transfer_id:
                  type: integer
                  description: The Metrc transfer to associate with this order, building the order from that outgoing Metrc transfer. This is Metrc's own integer transfer id, not a Distru ID. Mutually exclusive with `biotrack_id` — send at most one; an order can be linked to only one compliance transfer.
                location_id:
                  type: string
                  description: The Distru location ID of the order's top-level location — used to filter orders and to associate the order with a compliance (Metrc) license, identifying which Metrc license the order takes place under. It is not the location sale quantities are drawn from; each order item sets that via its own `location_id`. Optional in general, but required when the order has any package-tracked items, where it must reference a location that has a compliance license and that license must match the license of every package-tracked item's location.
                billing_location_id:
                  type: string
                  description: The billing location's ID (a Distru location ID). Optional.
                shipping_location_id:
                  type: string
                  description: The shipping location's ID (a Distru location ID). Optional.
                owner_id:
                  type: string
                  description: The Distru user that owns this order, as a user ID (the same id in the response's `owner.id`). Optional.
                status:
                  enum:
                  - PENDING
                  - PROCESSING
                  - READY_TO_SHIP
                  - DELIVERING
                  - DELIVERED
                  - COMPLETED
                  - CANCELED
                  type: string
                  description: 'The status to set for this order, controlling where it sits in its lifecycle and how it affects inventory and compliance. Required on create; on update, omit to leave the current status unchanged. See the `status` field on the [order response](#model-orderresponse) for what each value means. Note that some transitions have requirements: moving to READY_TO_SHIP, DELIVERING, DELIVERED, or COMPLETED requires every line item to be fulfilled and a customer (`company_id`) to be set, and DELIVERING/DELIVERED/COMPLETED additionally require a compliance transfer when the order carries any package-tracked items.'
                custom_data:
                  type: object
                  description: 'A map of custom field IDs to their values. Use GET /public/v1/custom-fields?parent_object=order to retrieve available custom fields, their IDs, and their types. The value format depends on the field''s type: a text field takes a string, a date field takes a full ISO8601 datetime, and a checkbox field takes an array of its selected options.'
      responses:
        '200':
          description: A single order
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upsert an order
      tags:
      - Order
  /public/v1/orders/{id}:
    delete:
      description: 'Deletes a sales order. This is a hard delete: the order is permanently removed together with its line items, charges, and shipments — it disappears from `GET /public/v1/orders`, `GET /public/v1/orders/{id}` returns 404 for it, and it cannot be recovered through the API. Responds 204 with no body on success, or 404 if no order with that `id` exists in your company (including one that belongs to another company or was already deleted).


        Some orders cannot be deleted; each of these is refused with a 400 and nothing is changed:


        • An order matched to a compliance transfer (Metrc or BioTrack). Unmatch it first if the transfer allows it; otherwise it can never be deleted through the API.

        • An order with MERGED status. Delete the combined order it was merged into instead — that resets its source orders back to PENDING, after which they can be deleted individually.

        • An order with returns recorded against it.

        • A historical shared-license order.

        • Any custom validation rule your company has configured for order deletion can also refuse the delete.


        Inventory assigned to the order''s line items is released back to available inventory, whatever the order''s status — including quantities already deducted by a COMPLETED order. Assemblies that were created to produce items for this order and are still PENDING are deleted too, releasing the ingredient inventory they had claimed.


        The order''s invoices are hard-deleted in the same call: their payments are removed, credits generated by overpaying them are canceled, and credit balance applied to them is released back onto the credits. If your company is integrated with QuickBooks Online, the linked invoices are scheduled for deletion there too (that sync is eventual — observe it in QuickBooks Online, not in the 204).


        Other effects, all in one atomic call: if this is a combined order, the orders that were merged into it are reset to PENDING status; tasks tied to the order are deleted; files attached to the order are detached but kept. Nothing is synced to Metrc or BioTrack, and an order imported from LeafLink is not rejected in LeafLink.


        Required permission: `orders_permissions_delete` (plus access to the order under team restrictions).'
      operationId: DistruPublic.V1.OrderController.delete
      parameters:
      - description: ID of the order to delete, as returned by the list, fetch, and upsert endpoints. An ID that doesn't exist for your company returns 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete an order
      tags:
      - Order
    get:
      description: 'Get a single order by ID, including its line items, charges, invoices, returns, delivery/fulfillment details, and custom field values — the same object returned in each entry of GET /public/v1/orders and in the upsert response. An ID that doesn''t exist, or belongs to another company, returns a not-found error.


        Note: this endpoint returns eventually consistent data — a write can take up to 1 second to be reflected here, so an order you just upserted may briefly read back with its previous values.


        Required permission: `orders_permissions_view`. The authenticated user must also have access to the requested order under their team restrictions, so an order that exists on the company can still return not-found if it falls outside those restrictions.'
      operationId: DistruPublic.V1.OrderController.show
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A single order
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get an order
      tags:
      - Order
  /public/v1/orders/{id}/pdf:
    post:
      description: 'Generate the order slip PDF for a single sales order and download it directly, get a signed link

        to it, or email it (see `format`).


        The same permissions that govern downloading this PDF in the Distru web app apply to this endpoint; when `format` is `email`, the web app''s permission for emailing it applies instead (documents the web app cannot email keep the download permission).


        `format` selects how the generated PDF is delivered and has three modes: `binary` returns the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` returns a JSON envelope `{"data": {"url": ..., "expires_datetime": ...}}` with a temporary signed download URL; `email` sends the PDF to the addresses in `email_addresses` and returns a JSON envelope `{"data": {"emailed_to": [...]}}`. `format` is required, but for backward compatibility omitting it defaults to `binary`.


        All PDF download endpoints share a single, combined rate limit for your account: 20 requests per minute and 1000 per day in total across every PDF endpoint (not per endpoint). Requests over the limit return 429 with a Retry-After header, and only successful downloads count toward it.'
      operationId: DistruPublic.V1.OrderController.download_pdf
      parameters:
      - description: ID for an order
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/DistruPublic.V1.AssemblyController.download_pdfBody'
      responses:
        '200':
          description: 'When `format` is `binary` (or omitted), the raw PDF file (`Content-Type: application/pdf`). When `format` is `url`, a JSON body with a temporary signed download URL; when `format` is `email`, a JSON body listing the addresses the PDF was emailed to (see the PdfResponse schema).'
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
        '400':
          description: Invalid parameters
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's shared PDF download rate limit (20/minute, 1000/day across all PDF endpoints) was exceeded. Retry after the period in the Retry-After header.
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Generate a sales order slip PDF
      tags:
      - Order
  /public/v1/orders/{id}/test-results/pdf:
    post:
      description: 'Generate the combined Certificate of Analysis (COA) PDF for a single sales order — built from the primary lab result of each line item''s batch or package — and download it directly, get a signed link to it, or email it (see `format`). Returns 404 when the order has no attached lab results, with the message `This order has no lab results attached`, which tells it apart from an unknown ID (`Not Found`).


        The same permissions that govern downloading this PDF in the Distru web app apply to this endpoint; when `format` is `email`, the web app''s permission for emailing it applies instead (documents the web app cannot email keep the download permission).


        `format` selects how the generated PDF is delivered and has three modes: `binary` returns the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` returns a JSON envelope `{"data": {"url": ..., "expires_datetime": ...}}` with a temporary signed download URL; `email` sends the PDF to the addresses in `email_addresses` and returns a JSON envelope `{"data": {"emailed_to": [...]}}`. `format` is required, but for backward compatibility omitting it defaults to `binary`.


        All PDF download endpoints share a single, combined rate limit for your account: 20 requests per minute and 1000 per day in total across every PDF endpoint (not per endpoint). Requests over the limit return 429 with a Retry-After header, and only successful downloads count toward it.'
      operationId: DistruPublic.V1.OrderController.download_test_results_pdf
      parameters:
      - description: ID for an order
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/DistruPublic.V1.AssemblyController.download_pdfBody'
      responses:
        '200':
          description: 'When `format` is `binary` (or omitted), the raw PDF file (`Content-Type: application/pdf`). When `format` is `url`, a JSON body with a temporary signed download URL; when `format` is `email`, a JSON body listing the addresses the PDF was emailed to (see the PdfResponse schema).'
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
        '400':
          description: Invalid parameters
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found, or the order has no lab results attached (the message says which)
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's shared PDF download rate limit (20/minute, 1000/day across all PDF endpoints) was exceeded. Retry after the period in the Retry-After header.
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Generate a sales order's Certificate of Analysis (COA) PDF
      tags:
      - Order
components:
  schemas:
    UnitType:
      description: A unit of measure used for quantities and pricing (e.g. Gram, Each, Pound). This is the compact reference carrying just id and name; the full unit type (its measurement category and conversion factor) is available from the unit types endpoint.
      properties:
        id:
          description: ID for this unit type
          type: string
        name:
          description: Human readable name for this unit type
          type: string
      required:
      - name
      - id
      title: Unit Type
      type: object
    BatchesWithActiveQuantityByLocation:
      description: A location and the product's batches that hold active quantity there.
      properties:
        batches:
          description: The product's batches with active quantity at this location, each carrying its active quantity there, ordered by id.
          items:
            $ref: '#/components/schemas/BatchCompactWithQuantityActive'
          type: array
        location:
          $ref: '#/components/schemas/LocationCompact'
      required:
      - batches
      - location
      title: BatchesWithActiveQuantityByLocation
      type: object
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    OrderChargeRequest:
      description: Order charge params
      properties:
        charge_preset_id:
          description: 'The ID of the charge preset this charge is created from (see [GET /public/v1/charge-presets](#get-charge-presets)). When set, Distru fills `name`, `type`, and the amounts from the preset: sending `name`, `type`, or `tax_id` returns a 400, and `unit_type`/`percent`/`price` may only be sent when the preset allows inline edits — always as positive values, the preset''s type determines whether the amount is added or subtracted. Omit for a manual charge. Fixed once the charge exists: it cannot be changed, cleared, or added to an existing manual charge — remove the charge and add a new one instead. An ID that doesn''t exist for your company returns 400.'
          type: string
        id:
          description: ID for this order charge. If it matches an existing charge on this order that charge is updated (fields you omit keep their current value); otherwise a new charge is created with this ID. Omit it to have Distru assign the ID.
          type: string
        name:
          description: The label for this line (e.g. "Delivery Fee"), shown on the order and its invoice. Required for a manual charge; must be omitted when `charge_preset_id` is set — the preset provides it.
          type: string
        percent:
          description: The percentage applied for this line. Required when `unit_type` is PERCENT and must be null otherwise; the resulting amount is computed from the order subtotal. On a preset charge it may only be sent when the preset allows inline edits, as a positive value.
          type: number
        price:
          description: The flat amount for this line. Applies when `unit_type` is PRICE. May be omitted for a PERCENT line, where Distru derives the amount from `percent`. On a preset charge it may only be sent when the preset allows inline edits, as a positive value.
          type: number
        tax_id:
          description: 'The ID of the tax this line applies. When set, the charge is treated as a tax line: it appears with a nested `tax` object in the response and is included in tax totals. Providing it forces `type` to CHARGE (a tax can never be a discount), so `type` may be omitted for a tax line. Cannot be combined with `charge_preset_id`. Michigan operators are limited to at most one Michigan state tax line per order; this limit does not apply anywhere else. When updating an existing charge (sent with its `id`): omitting `tax_id` leaves its current tax as-is; sending null clears the tax and turns it back into a normal charge; sending the same id is a no-op; sending a different id re-points it to that tax.'
          type: string
        type:
          description: 'Whether this line adds to or subtracts from the order: CHARGE or DISCOUNT (SCREAMING_CASE). Required for a normal line; may be omitted when `tax_id` is set, which forces it to CHARGE; must be omitted when `charge_preset_id` is set — the preset provides it.'
          enum:
          - CHARGE
          - DISCOUNT
          type: string
        unit_type:
          description: 'How the line is measured: PERCENT (a percentage of the subtotal, set via `percent`) or PRICE (a flat amount, set via `price`). SCREAMING_CASE. Required for a manual charge; on a preset charge it comes from the preset and may only be sent when the preset allows inline edits.'
          enum:
          - PERCENT
          - PRICE
          type: string
      title: OrderCharge (Request)
      type: object
    OrderItemRequest:
      description: Order item params
      properties:
        batch_id:
          description: The ID of the batch this line item draws from; set it to fulfill a batch-tracked line, and the product is inferred from it (no `product_id` needed). To create an unfulfilled line instead, leave this empty and send `product_id` — the product's `reserved` quantity goes up without committing to a batch. Must be empty for product-tracked and package-tracked products.
          type: string
        compliance_quantity:
          description: The compliance quantity for this item, expressed in the package's unit type; leave null when the item is not package-tracked (no `package_id`). Must be the full quantity currently in the package.
          type: number
        id:
          description: ID for this order item. If it matches an existing line on this order that line is updated (fields you omit keep their current value); otherwise a new line is created with this ID. Omit it to have Distru assign the ID.
          type: string
        is_sample:
          description: Marks this line as a sample rather than a normal sale. Defaults to false when omitted.
          type: boolean
        location_id:
          description: The location this line item is fulfilled from, as a Distru location ID. Optional.
          type: string
        note:
          description: A free-text note on this line item, up to 1024 characters. Optional; omit to leave an existing item's note unchanged, or send an empty string to clear it.
          type: string
        package_id:
          description: The ID of the package this line item draws from; set it to fulfill a package-tracked line, and the product is inferred from it (no `product_id` needed). To create an unfulfilled line instead, leave this empty and send `product_id` — the product's `reserved` quantity goes up without committing to a package. Must be empty for product-tracked and batch-tracked products.
          type: string
        price_base:
          description: 'Price per unit for this line item before any price tiers are applied, as a decimal (up to 9 decimal places). Required on create; when updating an existing line (sent with its `id`), omit it to keep the line''s current value. Matching price tiers may adjust the price actually charged, so the line''s resulting price in the response can differ from this value — control that with `price_tier_mode`. Never send a line''s discounted `price` back as its `price_base`: when a tier discounts the line and the update keeps its tier lock (`price_tier_mode` omitted, AUTO, or OVERRIDE with the same `price_tier_version_id`), a `price_base` equal to the line''s current `price` (as returned, or rounded to cents) is rejected with a 400, since saving it would apply the discount again.'
          type: number
        price_tier_mode:
          description: 'Controls how [price tiers](#model-pricetier) set this line''s `price` (SCREAMING_CASE): AUTO lets Distru apply the best applicable tier automatically, OVERRIDE locks the line to the exact tier version in `price_tier_version_id`, and NONE disables price tiers so `price` stays equal to `price_base`. Defaults to AUTO on create; when updating an existing line (sent with its `id`), omit it to keep the line''s current mode — except when sending `price_tier_version_id`, which always requires an explicit OVERRIDE in the same line, even if the line is already stored as OVERRIDE. Sending AUTO or NONE on an update also clears the line''s existing version lock. Note that the stored mode moves on its own under AUTO: as soon as a tier matches, the line locks to that tier''s current version and reads back as OVERRIDE (see `price_tier_mode` on the [sales order item](#model-salesorderitem)).'
          enum:
          - AUTO
          - OVERRIDE
          - NONE
          type: string
        price_tier_version_id:
          description: 'The price tier version to lock this line''s pricing to. Only valid alongside `price_tier_mode: "OVERRIDE"` in the same line: required then, rejected with any other or omitted mode — so re-pointing an already-locked line to another version still means resending OVERRIDE next to the new id. Take the id from a tier''s `current_version_id` (GET /public/v1/price-tiers) to apply the tier''s latest state, or from another order item''s `price_tier_version.id` to reuse the exact snapshot that priced it. The version must belong to one of your company''s price tiers — an unknown or foreign id is rejected. Setting or changing this value (from null to a version, or from one version to another) requires the version''s tier to currently be applicable to the line: its conditions (product/customer filters, minimum quantity, validity dates) are checked and a non-applicable tier is rejected. A line already locked to a version keeps its lock on later updates even if the tier has since stopped matching — only a change re-checks applicability.'
          type: string
        product_id:
          description: The ID of the product being sold. Required for product-tracked products, where `batch_id` and `package_id` must be left empty. For batch- and package-tracked products, `product_id` is inferred when you send `batch_id` or `package_id`; sending it on its own instead creates an unfulfilled line item — the order commits to the product without drawing from a specific batch or package yet, which adds to the product's `reserved` quantity while the order is PROCESSING. Set `batch_id` or `package_id` later to fulfill it. Every line item must include at least one of `product_id`, `batch_id`, or `package_id`.
          type: string
        quantity:
          description: Quantity used on this order item, expressed in the product's unit type
          type: number
      required:
      - price_base
      - quantity
      title: OrderItem (Request)
      type: object
    BillOfMaterialsProductInput:
      description: A specific product consumed by a bill of materials
      properties:
        id:
          description: ID for this input
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: How much of the product this recipe consumes, in the product's unit, as a decimal string (e.g. "2.5").
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsProductInput
      type: object
    CompactInvoice:
      description: A compact view of an invoice as nested inside another entity (an order or a payment) in Distru. Use its id to fetch the full invoice from the invoices endpoint.
      properties:
        id:
          description: ID for this invoice
          type: string
        invoice_number:
          description: The invoice number as shown in the Distru UI (e.g. "INV-0001"). Unique per company.
          type: string
        status:
          description: 'The payment status of this invoice (SCREAMING_CASE), reflecting how much of its total has been paid — distinct from the parent order''s fulfillment `status`.• NOT_PAID: no payments applied.• PARTIALLY_PAID: paid in part but less than the total.• FULLY_PAID: paid in full.• OVER_PAID: payments exceed the total.'
          type: string
        total:
          description: The invoice total (line items plus charges/taxes minus discounts), as a decimal string (e.g. "150.50").
          type: string
      required:
      - total
      - status
      - invoice_number
      - id
      title: CompactInvoice
      type: object
    BillOfMaterialsCost:
      description: An additional cost applied by a bill of materials
      properties:
        cost_type:
          $ref: '#/components/schemas/BillOfMaterialsCostType'
        description:
          description: Free-text description of this cost, or null when none was entered
          type: string
        id:
          description: ID for this cost
          type: string
        quantity:
          description: How many units of the cost type this line applies, as a decimal string (e.g. "3"). Multiply by the cost type's `cost_per_unit` to get the line total.
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsCost
      type: object
    PriceTierVersion:
      description: An immutable snapshot of a [price tier](#model-pricetier), frozen at one of its edits. Every create or update of a tier produces a new version, and a sales order item priced by the tier locks to the version that priced it — so the discount recorded here never changes, even after the live tier is edited.
      properties:
        id:
          description: ID for this price tier version — the value to submit back as an order item's `price_tier_version_id`
          type: string
        is_live:
          description: True when this snapshot is the tier's latest version (the tier's `current_version_id`). False means the tier was edited or deleted after this snapshot was taken, so the pricing frozen here may differ from the live tier's current state.
          type: boolean
        price_tier:
          description: The tier as of this snapshot — its frozen fields rendered in the [price tier](#model-pricetier)'s shape, under the live tier's `id`. This is NOT the tier's current state (which may have changed since); it carries no conditions, menus, or ownership.
          properties:
            id:
              description: ID of the live [price tier](#model-pricetier) this snapshot belongs to — fetch it via GET /public/v1/price-tiers for its conditions and current state
              type: string
            is_flat:
              description: When true the `price` replaces the order item's `price_base` outright instead of discounting off it. Only meaningful when `price_or_percent` is PRICE — never true with PERCENT.
              type: boolean
            name:
              description: Internal name of the tier as of this snapshot
              type: string
            percent:
              description: The discount percentage off the order item's `price_base` used when `price_or_percent` is PERCENT, as a decimal string with up to 3 decimals (e.g. "12.5", 0-100); null when PRICE
              type: string
            price:
              description: The money amount used when `price_or_percent` is PRICE, as a decimal string with up to 5 decimals (e.g. "5.00"); null when PERCENT. A per-unit discount off the order item's `price_base`, or — when `is_flat` is true — the replacement per-unit price itself.
              type: string
            price_or_percent:
              description: Whether the frozen discount is a fixed amount (PRICE) or a percentage (PERCENT)
              enum:
              - PRICE
              - PERCENT
              type: string
          type: object
      required:
      - price_tier
      - is_live
      - id
      title: PriceTierVersion
      type: object
    CompactMenu:
      description: A lightweight reference to a DistruCommerce menu — the online catalog a buyer browses to place an order — carrying just its id and name. Where it appears on a sales order, it is the menu that order was placed through. Use the id to fetch the full menu from the menus endpoint.
      properties:
        id:
          description: ID of the menu
          type: string
        name:
          description: Display name of the menu
          type: string
      required:
      - name
      - id
      title: CompactMenu
      type: object
    SalesOrderItem:
      description: A single product line on a sales order — what is being sold, how much, at what price, and which inventory (batch/package) fulfills it.
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        compliance_quantity:
          description: The quantity of this order item expressed in its package's unit type, as reported to the state compliance system, as a decimal string. Null when the item is not package-tracked.
          type: string
        cost_per_unit:
          description: Actual cost per unit — `total_cost_actual` divided by this order item's quantity.
          type: string
        cost_per_unit_default:
          description: Default (standard) cost per unit — `total_cost_default` divided by this order item's quantity.
          type: string
        id:
          description: ID for this order item
          type: string
        inserted_datetime:
          description: The datetime this order item was created at
          type: string
        is_sample:
          description: True if this order item is a sample given away rather than sold.
          type: boolean
        leaflink_id:
          description: The LeafLink line-item id this order item maps to (a LeafLink identifier, not a Distru id). Null when the order did not originate from LeafLink.
          type: integer
        location:
          $ref: '#/components/schemas/LocationCompact'
        note:
          description: Free-text note on this order item, or null when none was entered.
          type: string
        package:
          $ref: '#/components/schemas/Package'
        price:
          description: Price per unit actually charged on this order item — the per-unit price after any line-level price tier discount has been applied, as a decimal string (e.g. "25.00"). Equals `price_base` when no discount applied.
          type: string
        price_base:
          description: The per-unit list price of this order item before any price tier discount, as a decimal string (e.g. "30.00").
          type: string
        price_tier_mode:
          description: 'How [price tiers](#model-pricetier) determine this order item''s `price` (SCREAMING_CASE):• AUTO: Distru searches for the best applicable tier on every save of the order. The moment one matches, the line locks to that tier''s current version — the stored mode becomes OVERRIDE and `price_tier_version` is set — so an item created as AUTO reads back as OVERRIDE once a tier has applied. It stays AUTO (with a null `price_tier_version`) only while no tier matches.• OVERRIDE: the line is locked to the exact tier snapshot in `price_tier_version`. Its discount is re-applied to `price_base` on every save, and later edits to the live tier do not change this line''s pricing.• NONE: price tiers are disabled for this line; `price` equals `price_base` and `price_tier_version` is always null.'
          enum:
          - AUTO
          - OVERRIDE
          - NONE
          type: string
        price_tier_version:
          $ref: '#/components/schemas/PriceTierVersion'
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: Quantity sold on this order item, expressed in the product's unit type, as a decimal string (e.g. "10")
          type: string
        returned_quantity:
          description: Quantity returned against this order item so far, expressed in the product's unit type, as a decimal string (e.g. "2"). Null when nothing has been returned. The cost fields above value only the non-returned quantity (`quantity` minus this).
          type: string
        thc_percentage_total:
          description: The total THC % this order line is reserved at, used when the company sells by potency. Only meaningful for batch- or package-tracked products (always null for product-tracked items). Set from the order/menu selection when the line is created — it is not derived from or changed by the assigned package (a package can only fulfill the line if its primary test result's total THC matches this value). Null when not selling by potency.
          type: string
        total_cost_actual:
          description: Total actual cost of the non-returned quantity in this order item (i.e. `quantity` minus `returned_quantity`). Distru traces the inputs and components that produced the shipped inventory and sums the real costs incurred along that chain — for example the price paid when a component was purchased, assembly costs, and costs added by stock adjustments, among others.
          type: string
        total_cost_default:
          description: Total default (standard) cost of the non-returned quantity in this order item. Traced the same way as `total_cost_actual`, but each input/component is valued at its product's configured unit cost (the product's `unit_cost`) instead of its real cost.
          type: string
      required:
      - inserted_datetime
      - price_tier_mode
      - price_base
      - price
      - quantity
      - is_sample
      - id
      title: SalesOrderItem
      type: object
    LocationWithLicense:
      description: A location with its license number inlined, as nested on orders/invoices/purchases
      properties:
        address:
          description: The full address as a single formatted line, built from the street, apt, city, state, zip, and country fields
          example: 1234 Warehouse Street, Oakland, CA
          type: string
        company_id:
          description: ID of the [company](#model-company) that owns this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        id:
          description: ID for this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        license_id:
          description: ID of the [license](#model-license) this location is associated with, or null when the location has no license
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        license_number:
          description: The license number of the location's [license](#model-license), inlined so you need not fetch it; null when the location has no license
          example: C11-1234567890
          type: string
        name:
          description: Human readable name for this location
          example: Warehouse 1
          type: string
      required:
      - name
      - address
      - id
      title: LocationWithLicense
      type: object
    Product:
      description: A sellable or trackable item in your catalog — its name, pricing, category, unit of measure, and how its inventory is tracked (see `inventory_tracking_method`).
      properties:
        batches_with_active_quantity_by_location:
          description: The product's batches that hold active quantity, grouped by location. Present only when the request passes `include_batches_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not batch-tracked or holds no active batches.
          items:
            $ref: '#/components/schemas/BatchesWithActiveQuantityByLocation'
          type: array
        bill_of_materials:
          $ref: '#/components/schemas/BillOfMaterials'
        brand:
          $ref: '#/components/schemas/CompanyCompact'
        category:
          $ref: '#/components/schemas/ProductCategoryCompact'
        creator:
          $ref: '#/components/schemas/User'
        custom_data:
          description: The custom data for this product
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        deleted_at:
          description: ISO 8601 datetime the product was soft-deleted at, or null when the product has not been deleted
          type: string
        description:
          description: Plain-text description of this product, or null when none was entered. Always null together with `description_markdown` and non-null together with it — one is never set without the other.
          type: string
        description_markdown:
          description: The same description in Markdown. Null when `description` is null; populated whenever `description` is populated.
          type: string
        external_name:
          description: Customer-facing name shown on DistruCommerce menus and the Order Tracker, or null when none is set (it does not fall back to `name`)
          type: string
        gross_weight:
          description: The gross weight of one unit including packaging, as a decimal string, measured in `gross_weight_unit_type`. Null when not set; it is always set together with `gross_weight_unit_type` and null together with it.
          type: string
        gross_weight_unit_type:
          $ref: '#/components/schemas/UnitType'
        id:
          description: ID for this product
          type: string
        images:
          description: 'The images associated with this product, in display order: by `rank`, lowest first (the first is the primary image), then by id. Images with no rank come last. Empty array when the product has no images.'
          items:
            $ref: '#/components/schemas/Image'
          type: array
        inserted_datetime:
          description: The datetime this product was created at
          type: string
        inventory_tracking_method:
          description: 'How this product''s inventory is tracked. One of: `BATCH` (grouped into batches sharing traits such as expiration dates and test results), `PACKAGE` (inventory is defined by packages), `PRODUCT` (ungrouped; inventory exists directly on the product).'
          enum:
          - PACKAGE
          - BATCH
          - PRODUCT
          type: string
        is_active:
          description: True when the product is active. False when it has been marked inactive (archived), which hides it from most product pickers.
          type: boolean
        is_featured:
          description: True when the product is flagged as featured
          type: boolean
        leaflink_product_id:
          description: The LeafLink product ID this product is synced to, or null if not synced
          type: integer
        menu_visibility:
          description: 'Which menus this product is shown in. One of `DO_NOT_INCLUDE`, `INCLUDE_IN_ALL`, `INCLUDE_IN_SELECT` (same values accepted by the upsert endpoint); defaults to `DO_NOT_INCLUDE`. The `menus` field below lists the specific menus the product belongs to — this is how you see which menus when the value is `INCLUDE_IN_SELECT`. Setting `INCLUDE_IN_ALL` adds the product to every menu, and a menu created later gets it too, except a copy of a menu it isn''t on, or a new (not copied) menu made by a user who can''t see the product: read `menus` for where it really is.'
          enum:
          - DO_NOT_INCLUDE
          - INCLUDE_IN_ALL
          - INCLUDE_IN_SELECT
          type: string
        menus:
          description: 'Menus this product is on, ordered by menu creation time then id (includes inactive menus). Follows `menu_visibility`: the chosen menus for `INCLUDE_IN_SELECT`, every menu but the exceptions listed under `menu_visibility` for `INCLUDE_IN_ALL`, and usually none for `DO_NOT_INCLUDE`. A change made by a team-restricted user never removes the product from menus that user can''t see, so those stay listed.'
          items:
            $ref: '#/components/schemas/CompactMenu'
          type: array
        msrp:
          description: Manufacturer's suggested retail price, as a decimal string (e.g. "19.99"), or null when not set
          type: string
        name:
          description: Human readable name for this product
          type: string
        owner:
          $ref: '#/components/schemas/User'
        packages_with_active_quantity_by_location:
          description: The product's packages that hold active quantity, grouped by location. Present only when the request passes `include_packages_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not package-tracked or holds no active packages.
          items:
            $ref: '#/components/schemas/PackagesWithActiveQuantityByLocation'
          type: array
        product_group:
          $ref: '#/components/schemas/ProductGroupCompact'
        quantity_active:
          description: Total active on-hand quantity of this product across all locations, as a decimal string (e.g. "100"). Sums the product's active stock — positive quantity held at a location. Equals the sum of the per-location amounts in `quantity_active_by_location`, so the two always reconcile. "0" when the product has no active stock. Reserved stock is still physically on-hand, so it is included here; subtract `quantity_reserved` to get `quantity_available`. Sold stock and in-transit stock (held by a user rather than a location) is excluded.
          type: string
        quantity_active_by_location:
          description: The product's active on-hand quantity broken down by location — one entry per location holding active stock, ordered by location id. Empty array when the product has no active stock. The entries sum to `quantity_active`.
          items:
            $ref: '#/components/schemas/QuantityActiveByLocation'
          type: array
        quantity_available:
          description: Active on-hand quantity minus reserved quantity, as a decimal string (e.g. "100"). Equals `quantity_active` − `quantity_reserved` — what is on-hand and not already spoken for by unfulfilled sales orders or draft assemblies. Can be negative when more is reserved than is on-hand at a location. "0" when the product has no active stock and nothing reserved.
          type: string
        quantity_available_threshold_max:
          description: 'Over-stock alert threshold: Distru flags the product when its available quantity rises above this value. Decimal string, or null when no over-stock alert is configured. When both thresholds are set, this is strictly greater than `quantity_available_threshold_min`.'
          type: string
        quantity_available_threshold_min:
          description: 'Low-stock alert threshold: Distru flags the product when its available quantity drops below this value. Decimal string, or null when no low-stock alert is configured. When both thresholds are set, this is strictly less than `quantity_available_threshold_max`.'
          type: string
        quantity_reserved:
          description: 'Total quantity of this product currently reserved across all locations, as a decimal string (e.g. "100"). Reserved quantity is a soft hold tracked separately from on-hand stock (`quantity_active`): it rises as unfulfilled sales order items and draft assembly inputs are created, and falls as they are deleted or fulfilled. "0" when nothing is reserved.'
          type: string
        sku:
          description: The stock keeping unit (SKU) configured for this product
          type: string
        strain:
          $ref: '#/components/schemas/Strain'
        subcategory:
          $ref: '#/components/schemas/ProductSubcategoryCompact'
        tags:
          description: The tags associated with this product. Empty array when the product has no tags.
          items:
            $ref: '#/components/schemas/ProductTagRef'
          type: array
        tasks:
          description: 'The tasks linked to this product that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        total_cannabinoid_unit:
          description: The unit `total_thc` and `total_cbd` are measured in — one of MG (milligrams per unit) or PERCENT (percent by weight). Null when neither potency value is set.
          type: string
        total_cbd:
          description: Total CBD potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        total_thc:
          description: Total THC potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        treez_wholesale_price:
          description: The Treez wholesale price of this product, as a decimal string, or null when not set
          type: string
        unit_cost:
          description: The cost (purchase price) of one unit of this product, as a decimal string, or null when not set
          type: string
        unit_net_weight:
          description: The net contents of one unit of this product (weight, volume, or count of the contents), as a decimal string, measured in `unit_net_weight_serving_size_unit_type`. Null when not set.
          type: string
        unit_net_weight_serving_size_unit_type:
          $ref: '#/components/schemas/UnitType'
        unit_price:
          description: The list (sale) price of one unit of this product, as a decimal string (e.g. "25.00")
          type: string
        unit_serving_size:
          description: The serving size per unit, as a decimal string, measured in `unit_net_weight_serving_size_unit_type` (the same unit as `unit_net_weight`). Null when not set. When both are set, this is at most `unit_net_weight`.
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        units_per_case:
          description: The number of units of this product packed in one case, as a decimal string (e.g. "12"), or null when not set
          type: string
        upc:
          description: The UPC barcode of this product, or null when not set
          type: string
        updated_datetime:
          description: The datetime this product was last updated at
          type: string
        vendor:
          $ref: '#/components/schemas/CompanyCompact'
        wholesale_unit_price:
          description: The wholesale unit price of this product, as a JSON number (e.g. 12.5) rather than a decimal string — unlike `unit_price`. Null when not set.
          type: number
      required:
      - quantity_reserved
      - quantity_available
      - quantity_active_by_location
      - quantity_active
      - custom_data
      - inventory_tracking_method
      - unit_price
      - is_featured
      - is_active
      - tasks
      - updated_datetime
      - inserted_datetime
      - sku
      - name
      - id
      title: Product
      type: object
    CompanyCompact:
      description: A lightweight reference to a company — just its identity — embedded on other entities (orders, invoices, products, etc.) to point at the full company without inlining it. The company is a trading partner (a customer or vendor) in your Distru network. Use the id to fetch its full details from the companies endpoint.
      properties:
        id:
          description: ID for this company
          example: 3f128a34-cc59-4b49-8883-23bf10e59c6c
          type: string
        name:
          description: Human readable name for this company
          example: Retailer 1
          type: string
        tasks:
          description: 'The tasks linked to this company that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        updated_datetime:
          description: ISO 8601 datetime this company was last updated at
          type: string
      required:
      - tasks
      - updated_datetime
      - name
      - id
      title: CompanyCompact
      type: object
    TaskCompact:
      description: A compact reference to a task, as it appears in another entity's `tasks` list.
      properties:
        due_datetime:
          description: When the task is due, as a UTC ISO8601 datetime.
          type: string
        id:
          description: ID of the task.
          type: string
        name:
          description: The task's name.
          type: string
        status:
          description: The task's status.
          enum:
          - ACTIVE
          - COMPLETED
          type: string
      required:
      - due_datetime
      - status
      - name
      - id
      title: Task (compact)
      type: object
    CompactOrder:
      description: A compact view of an order as nested inside another entity (an invoice or a payment) in Distru. Use its id to fetch the full order from the orders endpoint.
      properties:
        id:
          description: ID for this order
          type: string
        order_number:
          description: The order number as shown in the Distru UI (e.g. "ORD-0001"). Unique per company.
          type: string
        status:
          description: The fulfillment status of this order (SCREAMING_CASE) — its lifecycle stage, distinct from an invoice's payment status.
          type: string
        total:
