          type: string
        distru_status:
          description: 'The package''s inventory lifecycle status. One of:• ACTIVE: on hand and available.• ASSEMBLING: allocated to a pending assembly.• SELLING: reserved on an open sales order.• SOLD: consumed by a completed sale.• RETURNING: on an in-progress return.• TRANSFERRED: sent out on a compliance transfer.• ONHOLD: placed on hold in the compliance system.• FINISHED: finished in the compliance system.• DISCONTINUED: discontinued.• DESTROYED: destroyed.'
          enum:
          - ACTIVE
          - ASSEMBLING
          - DESTROYED
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - RETURNING
          - SELLING
          - SOLD
          - TRANSFERRED
          type: string
        id:
          description: ID for this package in Distru
          type: string
        license_id:
          description: The ID of the [license](#model-license) this package is held under
          type: string
        location_id:
          description: The ID of the [location](#model-location) where this package is physically stored
          type: string
        metrc_id:
          description: The Metrc package ID for this package; null for non-Metrc packages
          type: integer
        quantity:
          description: The total on-hand quantity of this package, in the package's `unit_type`, as a decimal string (e.g. "100"). Always equals `quantity_active` + `quantity_assembling`. Never negative.
          type: string
        quantity_active:
          description: The freely usable portion of `quantity` — what can be used as an assembly input, moved to another location, added to a sales order, or adjusted down. Equals `quantity` minus `quantity_assembling`, in the package's `unit_type`, as a decimal string. Never negative.
          type: string
