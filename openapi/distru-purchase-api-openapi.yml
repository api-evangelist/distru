          enum:
          - CHARGE
          - DISCOUNT
          type: string
        unit_type:
          description: Whether the preset's amount is a flat money amount (PRICE) or a percentage (PERCENT).
          enum:
          - PERCENT
          - PRICE
          type: string
      required:
      - unit_type
      - type
      - name
      - id
      title: ChargePresetCompact
      type: object
    PdfResponse:
      description: 'The JSON envelope a PDF endpoint returns for the non-binary formats: `format=url` returns `url` + `expires_datetime`, `format=email` returns `emailed_to`.'
      properties:
        data:
          description: The response payload; which fields are present depends on the requested `format`.
