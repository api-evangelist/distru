    PaymentMethod:
      description: A way payments are made or received (e.g. Cash, Check, Credit Card, Bank Transfer).
      properties:
        active:
          description: True when this payment method is active and can be selected on new payments. Defaults to false.
          type: boolean
        deleted_at:
