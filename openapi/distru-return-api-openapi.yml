openapi: 3.2.0
info:
  license:
    name: Proprietary
    url: https://www.distru.com/legal/terms-of-service
  title: Distru Return API
  version: '1.0'
servers:
- url: https://app.distru.com
security:
- Bearer: []
tags:
- name: Return
paths:
  /public/v1/returns:
    get:
      description: 'List returns, newest first (by return date), with optional filters: by customer (`company_ids`), by originating sales order (`order_ids`), by `statuses`, by custom field values (`custom_data`), and by the `inserted_datetime` / `return_datetime` / `updated_datetime` windows. When more than one filter is supplied they are combined with AND — a return must satisfy every filter to appear.


        A return records product a customer sent back. It reverses the related inventory and financials, and — when the return is set to create a credit — generates a customer credit, which can sync to QuickBooks Online as a credit memo. A return is usually tied to the original sales order; a return created without an order is a generic return and leaves the order-derived fields (`order`, `order_quantity`, `return_quantity`, `return_type`, `invoice_numbers`) empty.


        Returned goods are added back to sellable inventory only once a return reaches `COMPLETED`; while `PROCESSING`, `SHIPPED`, or `RECEIVED` they are held aside as returning stock. Line items flagged as waste are written off rather than restocked.


        Results are ordered by return date, newest first, and paginated. Follow the `next_page` URL in the response to fetch the following page rather than incrementing the page number yourself. This endpoint is eventually consistent: a change can take up to 1 second to appear here.


        Required permission: `returns_permissions_view`. Results are further limited to the returns the authenticated user can see under their team restrictions, so this may return fewer returns than exist on the company.'
      operationId: DistruPublic.V1.ReturnController.index
      parameters:
      - description: Restrict the result to specific returns by ID (the same ID returned as each return's `id`). Repeat the bracketed key once per ID. Unknown IDs simply match nothing; an empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to returns issued to specific customers by company ID (the same ID returned as each return's `company.id`). Repeat the bracketed key once per ID; matches ANY. Unknown IDs match nothing; an empty list is no filter. At most 200 IDs.
        in: query
        name: company_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Filter by creation datetime, given as an inclusive `after,before` range of ISO 8601 timestamps separated by a comma. Either bound may be left empty: `after,` keeps only returns created on or after `after`; `,before` only those created on or before `before`; `after,before` keeps those inside the closed range. A range with both bounds empty is rejected.'
        in: query
        name: inserted_datetime
        required: false
        example: ?inserted_datetime=2022-07-10T00:00:00Z,2022-07-31T00:00:00Z
        schema:
          type: string
      - description: Restrict to returns tied to specific sales orders by order ID (the same ID returned as each return's `order.id`). Repeat the bracketed key once per ID; matches ANY. A malformed ID is rejected with a 400; an unknown-but-well-formed ID matches nothing; an empty list is no filter. Generic returns (created without an order) never match. At most 200 IDs.
        in: query
        name: order_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict to returns owned by any of these Distru users (each return's `owner.id`). Repeat the bracketed key once per ID; matches ANY. Unknown IDs match nothing; an empty list is no filter. At most 200 IDs.
        in: query
        name: owner_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Restrict to returns in any of the given statuses (SCREAMING_CASE, matches ANY): PROCESSING, SHIPPED, RECEIVED, COMPLETED. Repeat the bracketed key once per status. An empty list is no filter; at most 200 statuses.'
        in: query
        name: statuses
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - PROCESSING
            - SHIPPED
            - RECEIVED
            - COMPLETED
            type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      - description: Filter by return date — the business date on the return, which can differ from when the record was created — given as an inclusive `after,before` range of ISO 8601 timestamps separated by a comma, with the same empty-bound rules as `inserted_datetime`.
        in: query
        name: return_datetime
        required: false
        example: ?return_datetime=2022-07-10T00:00:00Z,2022-07-31T00:00:00Z
        schema:
          type: string
      - description: Filter by last-modified datetime, given as an inclusive `after,before` range of ISO 8601 timestamps separated by a comma, with the same empty-bound rules as `inserted_datetime`.
        in: query
        name: updated_datetime
        required: false
        example: ?updated_datetime=,2022-07-10T00:00:00Z
        schema:
          type: string
      - description: Filter by custom field values, as `custom_data[{id}]=value` where `{id}` is a custom field's numeric id. Repeat with different ids to filter on several fields at once; a record must match every one (AND). Matching is case-sensitive exact against the value stored on the record. The id must be a filterable custom field defined on this entity — use `GET /public/v1/custom-fields?parent_object=return` to list the ids, their types, and which are filterable. A non-numeric id, an id not defined on this entity, or an id that isn't filterable returns a 400.
        in: query
        name: custom_data
        required: false
        schema:
          type: object
      responses:
        '200':
          description: A list of returns
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Returns'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's list rate limit (3000 calls, refilling at 5 per minute, one per page) was exceeded. Retry after the period in the Retry-After header. Calls with an `updated_datetime` lower bound within the last 30 days are free and never refused; see [Incremental Sync](#incremental-sync).
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get returns
      tags:
      - Return
  /public/v1/returns/{id}:
    get:
      description: 'Fetch a single return by its Distru ID, including its line items, generated credits, associated sales order and invoice numbers, and the computed return quantities.


        Returns 404 if no such return exists in your company, and 403 if the authenticated user cannot see it under their team restrictions. This endpoint is eventually consistent: a change can take up to 1 second to appear here.


        Required permission: `returns_permissions_view`.'
      operationId: DistruPublic.V1.ReturnController.show
      parameters:
      - description: Distru ID of the return — the same id string returned as `id` in a return response.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A single return
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get a return
      tags:
      - Return
components:
  schemas:
    UnitType:
      description: A unit of measure used for quantities and pricing (e.g. Gram, Each, Pound). This is the compact reference carrying just id and name; the full unit type (its measurement category and conversion factor) is available from the unit types endpoint.
      properties:
        id:
          description: ID for this unit type
          type: string
        name:
          description: Human readable name for this unit type
          type: string
      required:
      - name
      - id
      title: Unit Type
      type: object
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    BillOfMaterialsProductInput:
      description: A specific product consumed by a bill of materials
      properties:
        id:
          description: ID for this input
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: How much of the product this recipe consumes, in the product's unit, as a decimal string (e.g. "2.5").
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsProductInput
      type: object
    BillOfMaterialsCost:
      description: An additional cost applied by a bill of materials
      properties:
        cost_type:
          $ref: '#/components/schemas/BillOfMaterialsCostType'
        description:
          description: Free-text description of this cost, or null when none was entered
          type: string
        id:
          description: ID for this cost
          type: string
        quantity:
          description: How many units of the cost type this line applies, as a decimal string (e.g. "3"). Multiply by the cost type's `cost_per_unit` to get the line total.
          type: string
      required:
      - quantity
      - id
      title: BillOfMaterialsCost
      type: object
    Returns:
      description: A collection of Returns
      properties:
        data:
          description: Returns
          items:
            $ref: '#/components/schemas/Return'
          type: array
        next_page:
          description: URL for the next page of results; null when there is no next page
          type: string
      title: Returns
      type: object
    ReturnItem:
      description: A single line on a return — how much of an order line item was sent back.
      properties:
        id:
          description: Distru ID for this return item.
          type: string
        order_item:
          $ref: '#/components/schemas/CompactOrderItem'
        quantity:
          description: Quantity returned on this line, always greater than 0. Always expressed in the product's own unit type, even when the order line item was fulfilled from a package measured in a different unit.
          type: number
        waste:
          description: Whether this returned quantity is marked as waste. Waste items are written off rather than restocked into sellable inventory when the return reaches `COMPLETED`. Defaults to false.
          type: boolean
      required:
      - waste
      - quantity
      - id
      title: ReturnItem
      type: object
    CompactMenu:
      description: A lightweight reference to a DistruCommerce menu — the online catalog a buyer browses to place an order — carrying just its id and name. Where it appears on a sales order, it is the menu that order was placed through. Use the id to fetch the full menu from the menus endpoint.
      properties:
        id:
          description: ID of the menu
          type: string
        name:
          description: Display name of the menu
          type: string
      required:
      - name
      - id
      title: CompactMenu
      type: object
    Product:
      description: A sellable or trackable item in your catalog — its name, pricing, category, unit of measure, and how its inventory is tracked (see `inventory_tracking_method`).
      properties:
        batches_with_active_quantity_by_location:
          description: The product's batches that hold active quantity, grouped by location. Present only when the request passes `include_batches_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not batch-tracked or holds no active batches.
          items:
            $ref: '#/components/schemas/BatchesWithActiveQuantityByLocation'
          type: array
        bill_of_materials:
          $ref: '#/components/schemas/BillOfMaterials'
        brand:
          $ref: '#/components/schemas/CompanyCompact'
        category:
          $ref: '#/components/schemas/ProductCategoryCompact'
        creator:
          $ref: '#/components/schemas/User'
        custom_data:
          description: The custom data for this product
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        deleted_at:
          description: ISO 8601 datetime the product was soft-deleted at, or null when the product has not been deleted
          type: string
        description:
          description: Plain-text description of this product, or null when none was entered. Always null together with `description_markdown` and non-null together with it — one is never set without the other.
          type: string
        description_markdown:
          description: The same description in Markdown. Null when `description` is null; populated whenever `description` is populated.
          type: string
        external_name:
          description: Customer-facing name shown on DistruCommerce menus and the Order Tracker, or null when none is set (it does not fall back to `name`)
          type: string
        gross_weight:
          description: The gross weight of one unit including packaging, as a decimal string, measured in `gross_weight_unit_type`. Null when not set; it is always set together with `gross_weight_unit_type` and null together with it.
          type: string
        gross_weight_unit_type:
          $ref: '#/components/schemas/UnitType'
        id:
          description: ID for this product
          type: string
        images:
          description: 'The images associated with this product, in display order: by `rank`, lowest first (the first is the primary image), then by id. Images with no rank come last. Empty array when the product has no images.'
          items:
            $ref: '#/components/schemas/Image'
          type: array
        inserted_datetime:
          description: The datetime this product was created at
          type: string
        inventory_tracking_method:
          description: 'How this product''s inventory is tracked. One of: `BATCH` (grouped into batches sharing traits such as expiration dates and test results), `PACKAGE` (inventory is defined by packages), `PRODUCT` (ungrouped; inventory exists directly on the product).'
          enum:
          - PACKAGE
          - BATCH
          - PRODUCT
          type: string
        is_active:
          description: True when the product is active. False when it has been marked inactive (archived), which hides it from most product pickers.
          type: boolean
        is_featured:
          description: True when the product is flagged as featured
          type: boolean
        leaflink_product_id:
          description: The LeafLink product ID this product is synced to, or null if not synced
          type: integer
        menu_visibility:
          description: 'Which menus this product is shown in. One of `DO_NOT_INCLUDE`, `INCLUDE_IN_ALL`, `INCLUDE_IN_SELECT` (same values accepted by the upsert endpoint); defaults to `DO_NOT_INCLUDE`. The `menus` field below lists the specific menus the product belongs to — this is how you see which menus when the value is `INCLUDE_IN_SELECT`. Setting `INCLUDE_IN_ALL` adds the product to every menu, and a menu created later gets it too, except a copy of a menu it isn''t on, or a new (not copied) menu made by a user who can''t see the product: read `menus` for where it really is.'
          enum:
          - DO_NOT_INCLUDE
          - INCLUDE_IN_ALL
          - INCLUDE_IN_SELECT
          type: string
        menus:
          description: 'Menus this product is on, ordered by menu creation time then id (includes inactive menus). Follows `menu_visibility`: the chosen menus for `INCLUDE_IN_SELECT`, every menu but the exceptions listed under `menu_visibility` for `INCLUDE_IN_ALL`, and usually none for `DO_NOT_INCLUDE`. A change made by a team-restricted user never removes the product from menus that user can''t see, so those stay listed.'
          items:
            $ref: '#/components/schemas/CompactMenu'
          type: array
        msrp:
          description: Manufacturer's suggested retail price, as a decimal string (e.g. "19.99"), or null when not set
          type: string
        name:
          description: Human readable name for this product
          type: string
        owner:
          $ref: '#/components/schemas/User'
        packages_with_active_quantity_by_location:
          description: The product's packages that hold active quantity, grouped by location. Present only when the request passes `include_packages_with_active_quantity_by_location=true`; the field is absent otherwise. Empty array when the product is not package-tracked or holds no active packages.
          items:
            $ref: '#/components/schemas/PackagesWithActiveQuantityByLocation'
          type: array
        product_group:
          $ref: '#/components/schemas/ProductGroupCompact'
        quantity_active:
          description: Total active on-hand quantity of this product across all locations, as a decimal string (e.g. "100"). Sums the product's active stock — positive quantity held at a location. Equals the sum of the per-location amounts in `quantity_active_by_location`, so the two always reconcile. "0" when the product has no active stock. Reserved stock is still physically on-hand, so it is included here; subtract `quantity_reserved` to get `quantity_available`. Sold stock and in-transit stock (held by a user rather than a location) is excluded.
          type: string
        quantity_active_by_location:
          description: The product's active on-hand quantity broken down by location — one entry per location holding active stock, ordered by location id. Empty array when the product has no active stock. The entries sum to `quantity_active`.
          items:
            $ref: '#/components/schemas/QuantityActiveByLocation'
          type: array
        quantity_available:
          description: Active on-hand quantity minus reserved quantity, as a decimal string (e.g. "100"). Equals `quantity_active` − `quantity_reserved` — what is on-hand and not already spoken for by unfulfilled sales orders or draft assemblies. Can be negative when more is reserved than is on-hand at a location. "0" when the product has no active stock and nothing reserved.
          type: string
        quantity_available_threshold_max:
          description: 'Over-stock alert threshold: Distru flags the product when its available quantity rises above this value. Decimal string, or null when no over-stock alert is configured. When both thresholds are set, this is strictly greater than `quantity_available_threshold_min`.'
          type: string
        quantity_available_threshold_min:
          description: 'Low-stock alert threshold: Distru flags the product when its available quantity drops below this value. Decimal string, or null when no low-stock alert is configured. When both thresholds are set, this is strictly less than `quantity_available_threshold_max`.'
          type: string
        quantity_reserved:
          description: 'Total quantity of this product currently reserved across all locations, as a decimal string (e.g. "100"). Reserved quantity is a soft hold tracked separately from on-hand stock (`quantity_active`): it rises as unfulfilled sales order items and draft assembly inputs are created, and falls as they are deleted or fulfilled. "0" when nothing is reserved.'
          type: string
        sku:
          description: The stock keeping unit (SKU) configured for this product
          type: string
        strain:
          $ref: '#/components/schemas/Strain'
        subcategory:
          $ref: '#/components/schemas/ProductSubcategoryCompact'
        tags:
          description: The tags associated with this product. Empty array when the product has no tags.
          items:
            $ref: '#/components/schemas/ProductTagRef'
          type: array
        tasks:
          description: 'The tasks linked to this product that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        total_cannabinoid_unit:
          description: The unit `total_thc` and `total_cbd` are measured in — one of MG (milligrams per unit) or PERCENT (percent by weight). Null when neither potency value is set.
          type: string
        total_cbd:
          description: Total CBD potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        total_thc:
          description: Total THC potency, as a decimal string, measured in `total_cannabinoid_unit`. Null when not set. Non-negative; when the unit is PERCENT it is between 0 and 100. Whenever this is set, `total_cannabinoid_unit` is also set. This is a static label on the product, not a lab-test value.
          type: string
        treez_wholesale_price:
          description: The Treez wholesale price of this product, as a decimal string, or null when not set
          type: string
        unit_cost:
          description: The cost (purchase price) of one unit of this product, as a decimal string, or null when not set
          type: string
        unit_net_weight:
          description: The net contents of one unit of this product (weight, volume, or count of the contents), as a decimal string, measured in `unit_net_weight_serving_size_unit_type`. Null when not set.
          type: string
        unit_net_weight_serving_size_unit_type:
          $ref: '#/components/schemas/UnitType'
        unit_price:
          description: The list (sale) price of one unit of this product, as a decimal string (e.g. "25.00")
          type: string
        unit_serving_size:
          description: The serving size per unit, as a decimal string, measured in `unit_net_weight_serving_size_unit_type` (the same unit as `unit_net_weight`). Null when not set. When both are set, this is at most `unit_net_weight`.
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        units_per_case:
          description: The number of units of this product packed in one case, as a decimal string (e.g. "12"), or null when not set
          type: string
        upc:
          description: The UPC barcode of this product, or null when not set
          type: string
        updated_datetime:
          description: The datetime this product was last updated at
          type: string
        vendor:
          $ref: '#/components/schemas/CompanyCompact'
        wholesale_unit_price:
          description: The wholesale unit price of this product, as a JSON number (e.g. 12.5) rather than a decimal string — unlike `unit_price`. Null when not set.
          type: number
      required:
      - quantity_reserved
      - quantity_available
      - quantity_active_by_location
      - quantity_active
      - custom_data
      - inventory_tracking_method
      - unit_price
      - is_featured
      - is_active
      - tasks
      - updated_datetime
      - inserted_datetime
      - sku
      - name
      - id
      title: Product
      type: object
    CompanyCompact:
      description: A lightweight reference to a company — just its identity — embedded on other entities (orders, invoices, products, etc.) to point at the full company without inlining it. The company is a trading partner (a customer or vendor) in your Distru network. Use the id to fetch its full details from the companies endpoint.
      properties:
        id:
          description: ID for this company
          example: 3f128a34-cc59-4b49-8883-23bf10e59c6c
          type: string
        name:
          description: Human readable name for this company
          example: Retailer 1
          type: string
        tasks:
          description: 'The tasks linked to this company that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        updated_datetime:
          description: ISO 8601 datetime this company was last updated at
          type: string
      required:
      - tasks
      - updated_datetime
      - name
      - id
      title: CompanyCompact
      type: object
    ReturnResponse:
      description: A single return envelope
      properties:
        data:
          $ref: '#/components/schemas/Return'
      title: Return Response
      type: object
    TaskCompact:
      description: A compact reference to a task, as it appears in another entity's `tasks` list.
      properties:
        due_datetime:
          description: When the task is due, as a UTC ISO8601 datetime.
          type: string
        id:
          description: ID of the task.
          type: string
        name:
          description: The task's name.
          type: string
        status:
          description: The task's status.
          enum:
          - ACTIVE
          - COMPLETED
          type: string
      required:
      - due_datetime
      - status
      - name
      - id
      title: Task (compact)
      type: object
    CompactCredit:
      description: A compact representation of a credit
      properties:
        amount:
          description: The current spendable face value of this credit, as a decimal string (e.g. `"100.00"`).
          type: string
        credit_number:
          description: The credit number as shown in the Distru UI (e.g. `CR-1001`).
          type: string
        id:
          description: ID for this credit
          type: string
        source:
          description: 'How this credit was created (SCREAMING_CASE): USER, RETURN, INVOICE_PAYMENT, QB_PAYMENT, or QB_CREDIT_MEMO.'
          enum:
          - INVOICE_PAYMENT
          - QB_CREDIT_MEMO
          - QB_PAYMENT
          - RETURN
          - USER
          type: string
      required:
      - source
      - credit_number
      - amount
      - id
      title: CompactCredit
      type: object
    CompactOrder:
      description: A compact view of an order as nested inside another entity (an invoice or a payment) in Distru. Use its id to fetch the full order from the orders endpoint.
      properties:
        id:
          description: ID for this order
          type: string
        order_number:
          description: The order number as shown in the Distru UI (e.g. "ORD-0001"). Unique per company.
          type: string
        status:
          description: The fulfillment status of this order (SCREAMING_CASE) — its lifecycle stage, distinct from an invoice's payment status.
          type: string
        total:
          description: The order total (line items plus charges/taxes minus discounts), as a 2-decimal string (e.g. "150.50").
          type: string
      required:
      - total
      - status
      - order_number
      - id
      title: CompactOrder
      type: object
    BillOfMaterials:
      description: A product's bill of materials (recipe of inputs and additional costs)
      properties:
        costs:
          description: The additional (non-material) costs this recipe applies, ordered oldest first. Empty when none.
          items:
            $ref: '#/components/schemas/BillOfMaterialsCost'
          type: array
        description:
          description: Free-text description of this bill of materials, or null when none was entered
          type: string
        dynamic_inputs:
          description: The inputs that select products by attribute (category, strain, tag, and so on) rather than naming a specific product. Empty when this recipe has none.
          items:
            $ref: '#/components/schemas/BillOfMaterialsDynamicInput'
          type: array
        id:
          description: ID for this bill of materials
          type: string
        name:
          description: Human readable name for this bill of materials
          type: string
        product_inputs:
          description: The inputs that name a specific product to consume. Empty when this recipe has none. See `dynamic_inputs` for inputs that select products by attribute instead.
          items:
            $ref: '#/components/schemas/BillOfMaterialsProductInput'
          type: array
      required:
      - costs
      - dynamic_inputs
      - product_inputs
      - name
      - id
      title: BillOfMaterials
      type: object
    ErrorResponse:
      description: The envelope returned by every failed request (400, 401, 403, 404, 429). `errors` always holds at least one entry.
      properties:
        errors:
          description: One or more errors describing why the request failed.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      required:
      - errors
      title: ErrorResponse
      type: object
    BillOfMaterialsDynamicInput:
      description: A dynamic input of a bill of materials. It selects products by attribute rather than naming a specific product. Each attribute list holds the entities matched by that criterion, or is empty when the criterion is not used.
      properties:
        id:
          description: ID for this input
          type: string
        product_categories:
          description: The product categories this input matches on, or empty when it does not match on category. A product must match every non-empty criterion.
          items:
            $ref: '#/components/schemas/ProductCategoryCompact'
          type: array
        product_groups:
          description: The product groups this input matches on, or empty when it does not match on group.
          items:
            $ref: '#/components/schemas/ProductGroupCompact'
          type: array
        product_subcategories:
          description: The product subcategories this input matches on, or empty when it does not match on subcategory.
          items:
            $ref: '#/components/schemas/ProductSubcategoryCompact'
          type: array
        quantity:
          description: How much this recipe consumes of whatever product matches, as a decimal string (e.g. "2.5").
          type: string
        strains:
          description: The strains this input matches on, or empty when it does not match on strain.
          items:
            $ref: '#/components/schemas/Strain'
          type: array
        tags:
          description: The tags this input matches on, or empty when it does not match on tag.
          items:
            $ref: '#/components/schemas/ProductTagRef'
          type: array
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - tags
      - strains
      - product_groups
      - product_subcategories
      - product_categories
      - quantity
      - id
      title: BillOfMaterialsDynamicInput
      type: object
    Return:
      description: Product a customer sent back, reversing the related inventory and financials. Usually tied to the original order, and may generate a credit for the customer.
      properties:
        company:
          $ref: '#/components/schemas/CompanyCompact'
        creator:
          $ref: '#/components/schemas/User'
        credits:
          description: Customer credits generated from this return, in compact form. Empty array when the return did not create a credit.
          items:
            $ref: '#/components/schemas/CompactCredit'
          type: array
        custom_data:
          description: The return's custom field values, one entry per defined Return custom field. Always an array (empty when the company has no Return custom fields).
          items:
            $ref: '#/components/schemas/CustomField'
          title: CustomData
          type: array
        description:
          description: Free-text note on the return, or null.
          type: string
        id:
          description: Distru ID for this return.
          type: string
        inserted_datetime:
          description: The datetime the return was created in Distru.
          type: string
        invoice_numbers:
          description: Invoice numbers of the associated order, sorted ascending. Empty array when the return has no order, or the order has no invoices.
          items:
            type: string
          type: array
        items:
          description: The line items on this return.
          items:
            $ref: '#/components/schemas/ReturnItem'
          type: array
        location:
          $ref: '#/components/schemas/LocationCompact'
        order:
          $ref: '#/components/schemas/CompactOrder'
        order_quantity:
          description: Total quantity across all line items on the associated order, as a decimal string (e.g. `"12"`). Null for a generic return with no order.
          type: string
        owner:
          $ref: '#/components/schemas/User'
        qb_credit_memo_id:
          description: Id of the QuickBooks Online credit memo this return's credit maps to, once synced to QuickBooks Online. Null until synced, or if the return does not create a credit.
          type: string
        return_datetime:
          description: The business date of the return. May differ from `inserted_datetime` (when the record was created). Null if not set.
          type: string
        return_number:
          description: Human-readable return number shown in the Distru UI. Unique within your company.
          type: string
        return_quantity:
          description: Total quantity returned across all items on this return, as a decimal string (e.g. `"4"`). Null for a generic return with no order.
          type: string
        return_type:
          description: '`Full Return` when every line item on the associated order has been fully returned, otherwise `Partial Return`. Null for a generic return with no order.'
          enum:
          - Full Return
          - Partial Return
          type: string
        status:
          description: Where this return is in its lifecycle. While PROCESSING, SHIPPED, or RECEIVED, the returned goods are set aside as returning stock and have not yet been added back to sellable inventory. Once COMPLETED, the returned goods are restocked into inventory (except items flagged as waste, which are written off instead), and the return can no longer be deleted.
          enum:
          - PROCESSING
          - SHIPPED
          - RECEIVED
          - COMPLETED
          type: string
        tasks:
          description: 'The tasks linked to this return that the authenticated user can see: none without `tasks_permissions_view`, and only those their team restrictions allow. An empty array when there are none.'
          items:
            $ref: '#/components/schemas/TaskCompact'
          type: array
        total:
          description: Total monetary value of the returned line items, summed from the return's items. Defaults to 0 when the return has no items.
          type: number
        updated_datetime:
          description: The datetime the return was last modified in Distru.
          type: string
      required:
      - tasks
      - updated_datetime
      - inserted_datetime
      - items
      - credits
      - custom_data
      - creator
      - invoice_numbers
      - total
      - status
      - return_number
      - id
      title: Return
      type: object
    ProductCategoryCompact:
      description: The top-level classification of a product (e.g. Flower, Edibles, Concentrates). Categories are defined per company and can be organized into subcategories.
      properties:
        id:
          description: ID for this category
          type: string
        name:
          description: Human readable name for this category
          type: string
        official_product_category_id:
          description: The ID of Distru's standardized (official) category this maps to, used to normalize categories across companies. Null when this category is not mapped to a standardized category.
          type: string
      required:
      - name
      - id
      title: ProductCategoryCompact
      type: object
    LocationCompact:
      description: A compact reference to a [location](#model-location) as nested inside another entity in Distru. Use its `id` to fetch the full location from the locations endpoint.
      properties:
        address:
          description: The full address as a single formatted line, built from the street, apt, city, state, zip, and country fields
          example: 1234 Warehouse Street, Oakland, CA
          type: string
        company_id:
          description: ID of the [company](#model-company) that owns this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        id:
          description: ID for this location
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        license_id:
          description: ID of the [license](#model-license) this location is associated with, or null when the location has no license
          example: 02c88a3f-d759-4973-88f9-60049d682524
          type: string
        name:
          description: Human readable name for this location
          example: Warehouse 1
          type: string
      required:
      - name
      - address
      - id
      title: LocationCompact
      type: object
    ProductTagRef:
      description: A tag associated with a product
      properties:
        id:
          description: ID for this tag
          type: string
        name:
          description: The name of this tag
          type: string
      required:
      - name
      - id
      title: ProductTagRef
      type: object
    ProductGroupCompact:
      description: A named grouping of products, defined per company (e.g. a brand line or product family).
      properties:
        id:
          description: ID for this product group
          type: string
        name:
          description: The name of this product group
          type: string
      required:
      - name
      - id
      title: ProductGroupCompact
      type: object
    User:
      description: A member of your Distru team — the account behind actions like owning or creating records.
      properties:
        banned:
          description: True when this user has been banned and can no longer sign in
          type: boolean
        deleted_at:
          description: ISO 8601 datetime this user was deleted at, or null when the user is not deleted
          type: string
        email:
          description: The email address of this user
          type: string
        full_name:
          description: The full name of this user, or null when not set
          type: string
        id:
          description: ID for this user
          type: string
        inserted_datetime:
          description: ISO 8601 datetime this user was created at
          type: string
        role:
          $ref: '#/components/schemas/Role'
        updated_datetime:
          description: ISO 8601 datetime this user was last updated at. It also moves on changes not shown here, such as the user signing in.
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - email
      - id
      title: User
      type: object
    CustomField:
      description: A user-defined field attached to a record, with the value set for this particular record. Which custom fields exist is configured in Distru; use `GET /public/v1/custom-fields` to list the definitions and their IDs.
      properties:
        id:
          description: The ID of this custom field's definition (matches an `id` from `GET /public/v1/custom-fields`). An integer.
          type: integer
        name:
          description: The name of this custom field
          type: string
        value:
          description: This record's value for the custom field, as a string, or null when no value has been set for this record
          type: string
      required:
      - name
      - id
      title: CustomField
      type: object
    Role:
      description: A permission role that determines what a [user](#model-user) can do in Distru.
      properties:
        id:
          description: ID for this role
          type: string
        name:
          description: Name of the role (e.g. Admin, Sales)
          type: string
      required:
      - name
      - id
      title: Role
      type: object
    QuantityActiveByLocation:
      description: Active on-hand quantity of an entity held at a single location.
      properties:
        location:
          $ref: '#/components/schemas/LocationCompact'
        quantity:
          description: Active on-hand quantity at this location, as a decimal string (e.g. "100"). Always positive.
          type: string
      required:
      - quantity
      - location
      title: QuantityActiveByLocation
      type: object
    Package:
      description: A specific, compliance-tracked quantity of a product identified by a unique tag (e.g. a Metrc package). This is the physical unit of inventory for package-tracked products. This is the compact reference; see PackageFull for all fields.
      properties:
        batch_number:
          description: A free-text batch number set on the package, separate from any compliance tag. Null when none is set.
          type: string
        compliance_label:
          description: The unique tag assigned by the state compliance system (e.g. the Metrc package tag). Always present for Metrc-tracked packages; may be null for BioTrack packages, and null when the package is not compliance-tracked.
          type: string
        distru_status:
          description: 'The package''s inventory lifecycle status. One of:• ACTIVE: on hand and available.• ASSEMBLING: allocated to a pending assembly.• SELLING: reserved on an open sales order.• SOLD: consumed by a completed sale.• RETURNING: on an in-progress return.• TRANSFERRED: sent out on a compliance transfer.• ONHOLD: placed on hold in the compliance system.• FINISHED: finished in the compliance system.• DISCONTINUED: discontinued.• DESTROYED: destroyed.'
          enum:
          - ACTIVE
          - ASSEMBLING
          - DESTROYED
          - DISCONTINUED
          - FINISHED
          - ONHOLD
          - RETURNING
          - SELLING
          - SOLD
          - TRANSFERRED
          type: string
        id:
          description: ID for this package in Distru
          type: string
        license_id:
          description: The ID of the [license](#model-license) this package is held under
          type: string
        location_id:
          description: The ID of the [location](#model-location) where this package is physically stored
          type: string
        metrc_id:
          description: The Metrc package ID for this package; null for non-Metrc packages
          type: integer
        quantity:
          description: The total on-hand quantity of this package, in the package's `unit_type`, as a decimal string (e.g. "100"). Always equals `quantity_active` + `quantity_assembling`. Never negative.
          type: string
        quantity_active:
          description: The freely usable portion of `quantity` — what can be used as an assembly input, moved to another location, added to a sales order, or adjusted down. Equals `quantity` minus `quantity_assembling`, in the package's `unit_type`, as a decimal string. Never negative.
          type: string
      required:
      - distru_status
      - quantity_active
      - quantity
      - location_id
      - license_id
      - id
      title: Package
      type: object
    Batch:
      description: A lot of a product — a group of inventory that shares traits such as a harvest/production run, expiration date, and lab results. Used for batch-tracked products. This is the compact reference; see BatchFull for all fields.
      properties:
        id:
          description: ID for this batch
          type: string
        name:
          description: Human readable name for this batch
          type: string
      required:
      - name
      - id
      title: Batch
      type: object
    Image:
      description: An image as shown in Distru
      properties:
        id:
          description: ID for this image
          type: string
        name:
          description: Original file name of this image, or null when unknown
          type: string
        rank:
          description: Display slot of this image among the product's images, 0 to 3; the lowest rank is the primary image. Null when unranked
          type: integer
        url:
          description: URL to the full-size (original) image file, or null when no file is available
          type: string
      required:
      - id
      title: Image
      type: object
    BillOfMaterialsCostType:
      description: The cost type applied by a bill-of-materials cost
      properties:
        cost_per_unit:
          description: The cost per unit, as a decimal string (e.g. "5.00"). Present only when the caller has the `costs_permissions_view_cost_types_cost_per_unit` permission; the field is omitted otherwise.
          type: string
        id:
          description: ID for this cost type
          type: string
        name:
          description: Human readable name for this cost type
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - name
      - id
      title: BillOfMaterialsCostType
      type: object
    PackagesWithActiveQuantityByLocation:
      description: A location and the product's packages that hold active quantity there.
      properties:
        location:
          $ref: '#/components/schemas/LocationCompact'
        packages:
          description: The product's packages held at this location that have active quantity, ordered by id.
          items:
            $ref: '#/components/schemas/Package'
          type: array
      required:
      - packages
      - location
      title: PackagesWithActiveQuantityByLocation
      type: object
    BatchesWithActiveQuantityByLocation:
      description: A location and the product's batches that hold active quantity there.
      properties:
        batches:
          description: The product's batches with active quantity at this location, each carrying its active quantity there, ordered by id.
          items:
            $ref: '#/components/schemas/BatchCompactWithQuantityActive'
          type: array
        location:
          $ref: '#/components/schemas/LocationCompact'
      required:
      - batches
      - location
      title: BatchesWithActiveQuantityByLocation
      type: object
    Strain:
      description: A cannabis strain (its genetics), such as "Blue Dream". Products can be linked to a strain to carry its name and type.
      properties:
        id:
          description: ID for this strain
          type: string
        inserted_datetime:
          description: The datetime this strain was created at
          type: string
        name:
          description: Name of the strain
          type: string
        strain_type:
          description: The genetic classification of the strain. Null when unset.
          enum:
          - INDICA
          - INDICA_DOMINANT
          - SATIVA
          - SATIVA_DOMINANT
          - HYBRID
          - HIGH_CBD
          type: string
        updated_datetime:
          description: The datetime this strain was last updated at
          type: string
      required:
      - updated_datetime
      - inserted_datetime
      - name
      - id
      title: Strain
      type: object
    ProductSubcategoryCompact:
      description: A finer classification within a product category (e.g. "Pre-Rolls" under Flower).
      properties:
        id:
          description: ID for this subcategory
          type: string
        name:
          description: Human readable name for this subcategory
          type: string
      required:
      - name
      - id
      title: ProductSubcategoryCompact
      type: object
    BatchCompactWithQuantityActive:
      description: A compact [batch](#model-batch) reference plus its active on-hand quantity at the location it is nested under.
      properties:
        batch_number:
          description: The batch number for this batch, or null when none is set
          type: string
        id:
          description: ID for this batch
          type: string
        name:
          description: Human readable name for this batch
          type: string
        quantity_active:
          description: The batch's active on-hand quantity at this location, as a decimal string (e.g. "100"). Always positive.
          type: string
      required:
      - quantity_active
      - name
      - id
      title: BatchCompactWithQuantityActive
      type: object
    CompactOrderItem:
      description: A compact view of an order line item as nested inside another entity in Distru — what was sold, how much, at what price, and which inventory (batch/package) fulfills it.
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        compliance_quantity:
          description: The quantity of this order item expressed in its package's unit type, as reported to the state compliance system, as a decimal string. Null when the item is not package-tracked.
          type: string
        id:
          description: ID for this order item
          type: string
        is_sample:
          description: True if this order item is a sample given away rather than sold.
          type: boolean
        location:
          $ref: '#/components/schemas/LocationCompact'
        package:
          $ref: '#/components/schemas/Package'
        price:
          description: Price per unit actually charged on this order item — the per-unit price after any line-level price tier discount has been applied, as a decimal string (e.g. "25.00"). Equals `price_base` when no discount applied.
          type: string
        price_base:
          description: The per-unit list price of this order item before any price tier discount, as a decimal string (e.g. "30.00").
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          description: Quantity sold on this order item, expressed in the product's unit type, as a decimal string (e.g. "10")
          type: string
      required:
      - price_base
      - price
      - quantity
      - is_sample
      - id
      title: CompactOrderItem
      type: object
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: 'API token generated in Distru (Settings → Distru API). Send it on every request as `Authorization: Bearer YOUR_API_TOKEN`.'
