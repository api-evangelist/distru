      title: AdditionalTestResult
      type: object
    ErrorResponse:
      description: The envelope returned by every failed request (400, 401, 403, 404, 429). `errors` always holds at least one entry.
      properties:
        errors:
          description: One or more errors describing why the request failed.
          items:
            $ref: '#/components/schemas/Error'
          type: array
      required:
      - errors
      title: ErrorResponse
      type: object
    TestResult:
      description: Lab results for a batch or package — the Certificate of Analysis (COA). Headline potency figures (THC/CBD) sit on this object; the full analyte breakdown (terpenes, pesticides, heavy metals, and more) is nested under `additional_test_results`.
      properties:
        additional_test_results:
          $ref: '#/components/schemas/AdditionalTestResult'
        batch_id:
          description: The ID of the batch this test result belongs to, or null when it is attached to a package instead (see `package_id`)
          type: string
        biotrack_id:
          description: The test result's ID in BioTrack. A BioTrack identifier, not a Distru ID. Null when the result did not come from BioTrack.
          type: string
        cbd_mg_per_unit:
          description: CBD content in milligrams per unit, as a decimal string, or null when not measured
          type: string
        cbd_percentage:
          description: CBD content as a percentage by weight, as a decimal string, or null when not measured
          type: string
        coa_url:
          description: Public URL to view/download this test result's Certificate of Analysis (COA), or null when no file is attached
          type: string
        id:
          description: ID for this test result
          type: string
        inserted_datetime:
          description: ISO 8601 datetime this test result was created at
          type: string
        is_primary:
          description: True when this is the primary test result for its batch or package (the one whose potency figures represent the product)
          type: boolean
        lab_license_number:
          description: The license number of the lab that performed this test, or null when not set
          type: string
        lab_name:
          description: The name of the lab that performed this test, or null when not set
          type: string
        metrc_id:
          description: The test result's ID in Metrc. A Metrc identifier, not a Distru ID. Null when the result did not come from Metrc.
          type: integer
        mg_per_unit_type:
          description: The unit that the `*_mg_per_unit` figures are measured against (e.g. the per-unit size), or null when not set
          type: string
        name:
          description: The name of the test result
          type: string
        package_id:
          description: The ID of the package this test result belongs to, or null when it is attached to a batch instead (see `batch_id`)
          type: string
        release_date:
          description: The date this test result was released (e.g. "2026-08-20"), or null when not set
          type: string
        thc_mg_per_unit:
          description: THC content in milligrams per unit, as a decimal string, or null when not measured
          type: string
        thc_percentage:
          description: THC content as a percentage by weight, as a decimal string, or null when not measured
          type: string
        total_cbd_mg_per_unit:
          description: Total CBD (including its acid precursor) in milligrams per unit, as a decimal string, or null when not measured
          type: string
        total_cbd_percentage:
          description: Total CBD (including its acid precursor) as a percentage by weight, as a decimal string, or null when not measured
          type: string
        total_thc_mg_per_unit:
          description: Total THC (including its acid precursor) in milligrams per unit, as a decimal string, or null when not measured
          type: string
        total_thc_percentage:
          description: Total THC (including its acid precursor) as a percentage by weight, as a decimal string, or null when not measured
          type: string
        updated_datetime:
          description: ISO 8601 datetime this test result was last updated at
          type: string
      required:
      - inserted_datetime
      - updated_datetime
      - is_primary
      - name
      - additional_test_results
      - id
      title: TestResult
      type: object
    TestResultResponse:
      description: A single test result envelope
      properties:
        data:
          $ref: '#/components/schemas/TestResult'
      title: Test Result Response
      type: object
    TestResults:
      description: A collection of Test Results
      properties:
