openapi: 3.2.0
info:
  license:
    name: Proprietary
    url: https://www.distru.com/legal/terms-of-service
  title: Distru Test Result API
  version: '1.0'
servers:
- url: https://app.distru.com
security:
- Bearer: []
tags:
- name: TestResult
paths:
  /public/v1/test-results:
    get:
      description: 'List test results for the authenticated company, most recently created last (ordered by creation time, then id). Each result is returned in full, including its potency values, lab metadata, `additional_test_results`, `coa_url`, `is_primary` flag, and the `package_id`/`batch_id` it is attached to.


        Results are paginated; follow the `next_page` URL in the envelope to walk the full set. Reads are eventually consistent — a test result you just created or updated may take up to 1 second to appear or reflect its latest values here.


        Required permission: `products_permissions_view`.'
      operationId: DistruPublic.V1.TestResultController.index
      parameters:
      - description: Restrict the result to specific test results by ID (the same ID returned as each test result's `id`). Repeat the bracketed key once per ID. Unknown IDs simply match nothing; an empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Restrict the result to test results attached to these packages by ID (the package''s ID, as returned in each result''s `package_id`). A result is attached to exactly one package or one batch, so this matches only package-attached results. This filter looks at direct attachment only: if a package *inherits* a test result from its assembly inputs, that package is not considered here — only packages the result is directly attached to are matched. Repeat the bracketed key once per ID. Unknown IDs match nothing; an empty list is treated as no filter. At most 200 IDs may be given.'
        in: query
        name: package_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Restrict the result to test results attached to these batches by ID (the batch''s ID, as returned in each result''s `batch_id`). A result is attached to exactly one package or one batch, so this matches only batch-attached results. This filter looks at direct attachment only: if a batch *inherits* a test result from its assembly inputs, that batch is not considered here — only batches the result is directly attached to are matched. Repeat the bracketed key once per ID. Unknown IDs match nothing; an empty list is treated as no filter. At most 200 IDs may be given.'
        in: query
        name: batch_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: 'Restrict the result to test results whose attached package or batch belongs to one of these products by ID. This filter looks at direct attachment only: it matches on the product of the package or batch the result is directly attached to, so if a package/batch *inherits* a test result from its assembly inputs, that product is not considered here. Repeat the bracketed key once per ID. Unknown IDs match nothing; an empty list is treated as no filter. At most 200 IDs may be given.'
        in: query
        name: product_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Restrict the result to test results with these Metrc lab-result identifiers — Metrc's own integer IDs (the `metrc_id` in the response), not Distru IDs. Matches a result if its Metrc ID equals any listed value. Only results synced from Metrc carry one. Repeat the bracketed key once per ID. An empty list is treated as no filter. At most 200 IDs may be given.
        in: query
        name: metrc_ids
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: 'Filter to test results whose creation time falls in a range. Value is a comma-separated pair of ISO8601 UTC datetimes, `<start>,<end>`; either side may be left empty for an open-ended bound. Both bounds are inclusive. Example: `?inserted_datetime=,2022-07-10T00:00:00Z` returns everything created on or before that instant; `?inserted_datetime=2022-07-01T00:00:00Z,2022-07-10T00:00:00Z` bounds both ends.'
        in: query
        name: inserted_datetime
        required: false
        example: ?inserted_datetime=,2022-07-10T00:00:00Z
        schema:
          type: string
      - description: 'Filter to test results whose last-modified time falls in a range. Value is a comma-separated pair of ISO8601 UTC datetimes, `<start>,<end>`; either side may be left empty for an open-ended bound. Both bounds are inclusive. Example: `?updated_datetime=,2022-07-10T00:00:00Z` returns everything modified on or before that instant; `?updated_datetime=2022-07-01T00:00:00Z,2022-07-10T00:00:00Z` bounds both ends.'
        in: query
        name: updated_datetime
        required: false
        example: ?updated_datetime=,2022-07-10T00:00:00Z
        schema:
          type: string
      - description: Page selector. Page size is fixed by the server; paginate by following the `next_page` URL in each response rather than building page selectors yourself — it is null on the last page. `next_page` uses `page[after]=<cursor>`, an opaque token marking where the next page resumes; pass it back exactly as given, and only to the endpoint that issued it. This is seek-based, so every page stays fast no matter how deep you page.
        in: query
        name: page
        required: false
        example: ?page[after]=cursor
        schema:
          type: string
      responses:
        '200':
          description: A list of test results
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TestResults'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's list rate limit (3000 calls, refilling at 5 per minute, one per page) was exceeded. Retry after the period in the Retry-After header. Calls with an `updated_datetime` lower bound within the last 30 days are free and never refused; see [Incremental Sync](#incremental-sync).
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get test results
      tags:
      - TestResult
    post:
      description: 'Create or update a single test result (lab result / Certificate of Analysis) for one package or batch. Omit `id` to create; pass an existing test result''s `id` to update it. Same URL and request shape for both.


        On create, attach the result to exactly one material by sending either `package_id` or `batch_id` (never both, and at least one is required). On update, send neither — the attachment is fixed once created, and passing `package_id` or `batch_id` on an update is rejected. Only non-compliance-tracked test results can be updated through this endpoint; results synced from Metrc or BioTrack are read-only here and any update attempt is rejected.


        Updates are sparse: only the fields you send are changed, and any field you omit keeps its stored value. To clear an optional potency or lab field back to null, send it explicitly as `null`. Potency percentage fields accept at most 4 decimal places and must be between 0 and 100.


        Results created or updated here are Distru-only records — this endpoint never pushes to Metrc or BioTrack. Compliance-tracked results only ever arrive by syncing from those systems, which is why they are read-only here.


        Effects beyond the test result row:

        • Creating a result attaches it to the given package or batch and propagates it down to that material''s child packages where applicable.

        • `is_primary: true` makes this the primary result for its package/batch: it unsets whatever result was previously primary there, propagates to child packages, and repoints those materials'' inventory/stock records at this result (so it becomes the potency shown for that inventory). A material always keeps exactly one primary — the first result created for a material becomes primary automatically even if you send `is_primary: false`.

        • You cannot flip an existing primary result from `is_primary: true` to `false` directly; instead mark a different result on the same package/batch as primary, which demotes this one automatically.


        Required permission: `products_permissions_edit`.'
      operationId: DistruPublic.V1.TestResultController.upsert
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The test result's ID. Omit to create a new result; include an existing result's ID to update it (an ID that doesn't exist for your company returns 404). Only non-compliance-tracked results can be updated — updating one that is synced from Metrc or BioTrack is rejected. When present, `package_id` and `batch_id` must be omitted.
                package_id:
                  type: string
                  description: The ID of the package this result is attached to. Provide exactly one of `package_id` or `batch_id` on create; sending both, or neither, is rejected. Must be omitted on update (the attachment cannot be moved).
                batch_id:
                  type: string
                  description: The ID of the batch this result is attached to. Provide exactly one of `package_id` or `batch_id` on create; sending both, or neither, is rejected. Must be omitted on update. Batch-attached results cannot be compliance-tracked.
                additional_test_results:
                  type: object
                  description: Required on create; on update, omit to leave the stored object unchanged. A key/value object of extra lab fields beyond the built-in THC/CBD ones (e.g. terpenes, pesticides, moisture). Which keys are valid depends on the attached material's product-category test result settings; an unrecognized key is rejected, and keys valid overall but outside that material's configured set are dropped from responses. Each value must be a valid decimal within that field's configured decimal-place, digit, and range limits (percentage fields 0–100). Null values are ignored. When you do send it on update it replaces the entire object, not merged per-key — include every entry you want to keep; send `{}` to clear them all. See [here](#additionaltestresult) for the valid options.
                mg_per_unit_type:
                  enum:
                  - mg/g
                  - mg/mL
                  type: string
                  description: Required on create; on update, omit to leave unchanged. The unit the `*_mg_per_unit` fields are expressed in. One of `mg/g` or `mg/mL`.
                is_primary:
                  type: boolean
                  description: 'Required on create; on update, omit to leave unchanged. Whether this is the primary result for its package/batch. Setting `true` makes it primary — it demotes any other primary on the same material, propagates to child packages, and repoints that material''s inventory/stock potency at this result. You cannot change an existing primary result from `true` to `false` directly; mark a different result on the same package/batch as primary instead, which demotes this one automatically. Note: the first result created for a material always becomes primary regardless of this flag.'
                release_date:
                  type: string
                  description: The lab's release date for this result, as an ISO8601 date (`YYYY-MM-DD`). Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                lab_license_number:
                  type: string
                  description: The license number of the testing lab. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                lab_name:
                  type: string
                  description: The name of the testing lab. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                name:
                  type: string
                  description: Required on create; on update, omit to leave unchanged. A display name for this result (250 characters or fewer).
                thc_percentage:
                  type: number
                  format: decimal
                  description: THC as a percentage of the material (0–100, at most 4 decimal places). Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                total_thc_percentage:
                  type: number
                  format: decimal
                  description: Total THC as a percentage of the material, accounting for THCA conversion (0–100, at most 4 decimal places). Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                thc_mg_per_unit:
                  type: number
                  format: decimal
                  description: THC content per unit, expressed in the unit named by `mg_per_unit_type`. Must be 0 or greater; unlike the percentage fields it has no upper bound and no decimal-place limit. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                total_thc_mg_per_unit:
                  type: number
                  format: decimal
                  description: Total THC content per unit (accounting for THCA conversion), expressed in the unit named by `mg_per_unit_type`. Must be 0 or greater; no upper bound and no decimal-place limit. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                cbd_percentage:
                  type: number
                  format: decimal
                  description: CBD as a percentage of the material (0–100, at most 4 decimal places). Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                total_cbd_percentage:
                  type: number
                  format: decimal
                  description: Total CBD as a percentage of the material, accounting for CBDA conversion (0–100, at most 4 decimal places). Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                cbd_mg_per_unit:
                  type: number
                  format: decimal
                  description: CBD content per unit, expressed in the unit named by `mg_per_unit_type`. Must be 0 or greater; unlike the percentage fields it has no upper bound and no decimal-place limit. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
                total_cbd_mg_per_unit:
                  type: number
                  format: decimal
                  description: Total CBD content per unit (accounting for CBDA conversion), expressed in the unit named by `mg_per_unit_type`. Must be 0 or greater; no upper bound and no decimal-place limit. Optional; omitting it on update leaves it unchanged. Send `null` to clear it.
      responses:
        '200':
          description: A single test result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TestResultResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upsert a test result
      tags:
      - TestResult
  /public/v1/test-results/{id}:
    delete:
      description: 'Deletes a test result. This is a hard delete: the record is permanently removed — it disappears from `GET /public/v1/test-results`, `GET /public/v1/test-results/{id}` returns 404 for it, and it cannot be recovered through the API. Responds 204 with no body on success, or 404 if no test result with that `id` exists in your company (including one that belongs to another company or was already deleted).


        Only Distru-only results can be deleted: a result synced from Metrc or BioTrack (compliance-tracked) is refused with a 400. Nothing else blocks the delete — a result can be deleted even while it is the primary result of its package or batch.


        Effects beyond the test result itself: the result is detached from the package or batch it was attached to (and from any child packages it propagated to), and its attached Certificate of Analysis (COA) file is permanently deleted with it. Where the result was the primary one, the affected packages/batches and their inventory are left with no test result — potency stops showing for that inventory until another result is created or marked primary via the upsert endpoint; no result is auto-promoted. No inventory quantity is created, consumed, or released, and nothing is synced to Metrc or BioTrack.


        Required permission: `products_permissions_edit`.'
      operationId: DistruPublic.V1.TestResultController.delete
      parameters:
      - description: ID of the test result to delete, as returned by the list, fetch, and upsert endpoints. An ID that doesn't exist for your company returns 404.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete a test result
      tags:
      - TestResult
    get:
      description: 'Get a single test result by its ID, in full: potency values, lab metadata, `additional_test_results`, `coa_url`, the `is_primary` flag, and the `package_id`/`batch_id` it is attached to. Returns 404 if no test result with that ID exists for the authenticated company.


        Required permission: `products_permissions_view`.'
      operationId: DistruPublic.V1.TestResultController.show
      parameters:
      - description: The ID of the test result to fetch, as returned by the list and upsert endpoints.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A single test result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TestResultResponse'
        '400':
          description: Invalid parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get a test result
      tags:
      - TestResult
  /public/v1/test-results/{id}/pdf:
    post:
      description: 'Generate the Certificate of Analysis (COA) PDF for a single test result — its attached lab result file — and download it directly, get a signed link to it, or email it (see `format`). Returns 404 when the test result has no attached lab result file, with the message `This test result has no lab results attached`, which tells it apart from an unknown ID (`Not Found`).


        The same permissions that govern downloading this PDF in the Distru web app apply to this endpoint; when `format` is `email`, the web app''s permission for emailing it applies instead (documents the web app cannot email keep the download permission).


        `format` selects how the generated PDF is delivered and has three modes: `binary` returns the raw PDF bytes as the response body (`Content-Type: application/pdf`); `url` returns a JSON envelope `{"data": {"url": ..., "expires_datetime": ...}}` with a temporary signed download URL; `email` sends the PDF to the addresses in `email_addresses` and returns a JSON envelope `{"data": {"emailed_to": [...]}}`. `format` is required, but for backward compatibility omitting it defaults to `binary`.


        All PDF download endpoints share a single, combined rate limit for your account: 20 requests per minute and 1000 per day in total across every PDF endpoint (not per endpoint). Requests over the limit return 429 with a Retry-After header, and only successful downloads count toward it.'
      operationId: DistruPublic.V1.TestResultController.download_pdf
      parameters:
      - description: The ID of the test result whose Certificate of Analysis (COA) PDF you want. This is the same `id` returned by the list and get endpoints.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/DistruPublic.V1.AssemblyController.download_pdfBody'
      responses:
        '200':
          description: 'When `format` is `binary` (or omitted), the raw PDF file (`Content-Type: application/pdf`). When `format` is `url`, a JSON body with a temporary signed download URL; when `format` is `email`, a JSON body listing the addresses the PDF was emailed to (see the PdfResponse schema).'
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/PdfResponse'
        '400':
          description: Invalid parameters
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API token
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API token lacks the required permission
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found, or the test result has no lab result file attached (the message says which)
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — the account's shared PDF download rate limit (20/minute, 1000/day across all PDF endpoints) was exceeded. Retry after the period in the Retry-After header.
          content:
            application/pdf,application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Generate a test result's Certificate of Analysis (COA) PDF
      tags:
      - TestResult
components:
  schemas:
    Error:
      description: A single error describing one problem with the request.
      properties:
        message:
          description: Human-readable, customer-facing description of what went wrong.
          type: string
        pointer:
          description: 'Path to the offending field in the request: field names and, for items in a list, their integer position — e.g. ["items", 0, "quantity"]. ["base"] means the error applies to the request as a whole rather than one field.'
          items: {}
          type: array
      required:
      - message
      - pointer
      title: Error
      type: object
    PdfResponse:
      description: 'The JSON envelope a PDF endpoint returns for the non-binary formats: `format=url` returns `url` + `expires_datetime`, `format=email` returns `emailed_to`.'
      properties:
        data:
          description: The response payload; which fields are present depends on the requested `format`.
          properties:
            emailed_to:
              description: The recipient email addresses the PDF was emailed to, present only when `format=email`.
              items:
                type: string
              type: array
            expires_datetime:
              description: ISO 8601 datetime when the signed `url` expires (e.g. "2026-08-20T00:00:00Z"), present only when `format=url`.
              type: string
            url:
              description: Temporary signed URL to download the PDF, present only when `format=url`. Stops working once `expires_datetime` passes; request the endpoint again for a fresh URL.
              type: string
          type: object
      title: PdfResponse
      type: object
    AdditionalTestResult:
      description: 'The full breakdown of individual analytes measured on a lab test, grouped by category (cannabinoids, terpenes, pesticides, heavy metals, microbials, mycotoxins, residual solvents, and more). Each value is a string. The unit is encoded in the field-name suffix: `_percentage` is percent by weight, `_mg_per_unit` is milligrams per unit, `_ug_per_g` is micrograms per gram, `_ug_per_kg` is micrograms per kilogram, and `_cfu_per_g` is colony-forming units per gram. A null or empty value means the analyte was not measured.'
